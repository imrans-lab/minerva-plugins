[package]
name = "smart-remote-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "smart_remote_plugin"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.58", default-features = false }
include_dir = "0.7"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
gethostname = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }
