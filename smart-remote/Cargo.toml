[package]
name = "smart-remote-plugin"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
name = "smart_remote_plugin"
path = "src/lib.rs"

[[bin]]
name = "smart-remote-plugin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.58", default-features = false }
include_dir = "0.7"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
sha2 = "=0.10.9"
sha2_security = { package = "sha2", version = "=0.11.1" }
srp = { version = "=0.7.0-rc.3", default-features = false }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
rand_core = { version = "=0.9.5", features = ["os_rng"] }
prost = "=0.14.4"
zeroize = "=1.9.1"
btleplug = "=0.13.5"
uuid = "=1.28.0"
subtle = "2"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
gethostname = "1"
base64 = "0.22"
rubato = { version = "0.16.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "=0.9.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration"] }

[build-dependencies]
prost-build = "=0.14.4"
protox = "=0.10.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "test-util"] }
