  GENERATED FILE — do not edit ui/panel.html by hand.

  It is built from ui/src by `node ui/build.mjs`; the sources are the ones to
  change, and the build is a concatenation with no toolchain, no dependencies
  and no network. Everything the page needs is inlined here because CefTexture

  What this page is: a view. The record lives in the wrapper, every read goes

  not in the record or in flight.

  What it never does: build markup. Every value that came from the record, a

    <button type="button" data-pane="members">Members</button>
    <button type="button" data-pane="sources">Sources</button>
  </nav>

  <div class="stage" id="stage" data-detail="closed">
    <main class="reading" id="reading" tabindex="-1"></main>
    <aside class="detail" id="detail" aria-label="Detail"></aside>
    <button type="button" class="action primary arrival" id="arrival" hidden></button>
  </div>

  <div class="footrail">
    <button type="button" class="action quiet" id="handoff">Send picked answers to the bound chat</button>
    <span id="message" role="status" aria-live="polite"></span>
    <span class="spacer"></span>
    <button type="button" class="action quiet" id="help" data-help="1">Help</button>
    <span class="sizer" id="sizer" role="group" aria-labelledby="text-size-label"></span>
    <span id="revision"></span>
  </div>

</div>
