              type: 'checkbox',
              data: { pick: head.synthesis.contribution_id },
              checked: picked[head.synthesis.contribution_id] ? true : null
            }),
            ' Send to chat'
          ])
        ])
      ]));
      if (head.index > 0) {
        blocks.push(el('p', {
          class: 'superseded',
          text: 'An earlier synthesis stands under its own round below; it is kept, not overwritten.'
        }));
      }
    }

    R.runsOf(session).forEach(function (run, index) {
      blocks.push(el('section', { data: { anchor: 'run:' + run.run_id } }, [
        el('h2', {
          class: 'pane-title group',
          text: R.runTitle(session, run, index) + ' · ' + R.text(run.status)
        }),
        run.prompt && el('blockquote', { class: 'quoted', text: run.prompt }),
        R.isLive(run) && el('div', { class: 'row' }, [
          el('button', {
            class: 'action',
            type: 'button',
            data: { 'cancel-run': run.run_id },
            text: 'Cancel this round'
          })
        ]),
        R.list(run.contributions).map(function (contribution) {
          return P.contributionBlock(definition, contribution, {
            picked: !!picked[contribution.contribution_id]
          });
        }),
        // A superseded synthesis stays with the round that produced it, so
        // "revised after the follow-up" can be checked against what it revised.
        // The newest one is not repeated here: it is already at the top of the
        // pane, where a reader looks for the conclusion.
        run.synthesis && (!head || head.run !== run) && P.contributionBlock(definition, run.synthesis, {
          picked: !!picked[run.synthesis.contribution_id]
        })
      ]));
    });

    blocks.push(outcomes(session));
    // Said once, at the foot of the session, whether or not anything is kept —
    // the absence of the control is what needs explaining, and it is most
    // conspicuous when the list is empty.
    if (R.completedContributions(session).length || R.list(session.outcomes).length) {
      blocks.push(keepingNote());
    }
    return D.frag(blocks);
  }

  global.CouncilSessionPane = { sessionPane: sessionPane };
})(window);
</script>
<script>
// The Members pane: who is on the council, what each is responsible for, and
// what grounds them.
//
// Identity and responsibility are two records, and the pane keeps them apart:
// the roster shows the member with the seat's responsibility under it, and the
// member's own detail shows what it represents, what it speaks to, and what it
// does not establish. A member with no seat is listed as available rather than
// hidden, because an ungrounded or unseated member is a state the user put the
// council in and should be able to see.

(function (global) {
  'use strict';

  var D = global.CouncilDom;
  var R = global.CouncilRecord;
  var P = global.CouncilParts;
  var el = D.el;

  // What answers for this member when a round runs. The engine takes the
  // catalogue's first model when nobody chose one, and that choice costs money
  // and sets the answer's quality — so an unchosen model is stated, not left
  // blank.
  function modelLine(member) {
    return member.model_hint
      ? 'Model: ' + member.model_hint
      : 'Model: not chosen — the first model Minerva has enabled will answer';
  }

  function seatedRow(definition, seat) {
    var member = R.memberOf(definition, seat.member_id) || {};
    return el('li', {}, [
      el('button', {
        class: 'entry',
        type: 'button',
        data: { 'open-member': seat.member_id, seat: seat.seat_id }
      }, [
        P.identity(definition, seat.member_id, null),
        el('div', {
          class: 'line2',
          text: (seat.role === 'chair' ? 'Chair. ' : '') + R.text(seat.responsibility)
        }),
        member.kind !== 'human' && el('div', { class: 'line2', text: modelLine(member) })
      ])
    ]);
  }

  function unseatedRow(definition, member) {
    return el('li', {}, [
      el('div', { class: 'entry static' }, [
        P.identity(definition, member.member_id, null),
        el('div', { class: 'line2', text: R.text(member.scope) }),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'action',
            type: 'button',
            data: { 'seat-member': member.member_id },
            text: 'Give this member a seat'
          }),
          el('button', {
            class: 'action quiet',
            type: 'button',
            data: { 'open-member': member.member_id },
            text: 'Read the grounding'
          })
        ])
      ])
    ]);
  }

  // The councils Council ships with, offered on an empty project.
  //
  // They are inlined into the page by ui/build.mjs from council/presets, which
  // is the same directory the backend embeds for minerva_council_presets — so
  // what the page offers and what an agent can import are one set of files.
  // Starting one is an ordinary definition.import under a freshly minted id, so
  // a preset can be started twice and neither copy is special afterwards.
  function presetOffer() {
    var presets = global.CouncilPresets;
    if (!presets || !presets.length) { return null; }
    return D.frag([
      el('h2', { class: 'pane-title', text: 'Or start from one of these' }),
      el('ul', { class: 'roster' }, presets.map(function (preset) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: { 'use-preset': preset.definition_id }
          }, [
            el('div', { class: 'who' }, [
              el('span', { class: 'name', text: preset.name }),
              el('span', { class: 'kind', text: R.list(preset.seats).length + ' seats' })
            ]),
            el('div', { class: 'line2', text: preset.purpose })
          ])
        ]);
      }))
    ]);
  }

  function membersPane(snapshot, session) {
    // The pane shows the PROJECT's council, which is the one that can be
    // edited. A session's embedded copy is history — it records what was
    // actually asked of whom — so it is only shown when the project no longer
    // holds the council at all, and then read-only.
    var editing = R.editableDefinition(snapshot, session);
    var definition = editing || R.definitionOf(session, snapshot);
    var historical = !editing;
    if (!definition) {
      return D.frag([
        el('p', {
          class: 'empty',
          text: 'No council in this project yet. A council is a chair plus the members you seat beside it.'
        }),
        el('div', { class: 'row group' }, [
          el('button', {
            class: 'action primary',
            type: 'button',
            data: { 'create-council': '1' },
            text: 'Start a council'
          }),
          el('button', {
            class: 'action quiet',
            type: 'button',
            data: { help: '1' },
            text: 'How Council works'
          })
        ]),
        presetOffer()
      ]);
    }

    var asked = session && session.definition_snapshot;
    var drifted = !historical && asked
      && Number(asked.definition_revision) !== Number(definition.definition_revision);

    var seated = {};
    R.list(definition.seats).forEach(function (seat) { seated[seat.member_id] = seat; });
    var unseated = R.list(definition.members).filter(function (member) {
      return !seated[member.member_id];
    });

    // The masthead already carries the council's name and revision; repeating
    // them here would spend the top of a 400px pane saying nothing new.
    var blocks = [
      historical && el('div', { class: 'notice calm' }, [
        el('h3', { text: 'As it stood for this question' }),
        'This project no longer holds the council the open session was asked with, '
          + 'so what is shown is the copy kept on the session itself. It is history and is not edited here.'
      ]),
      drifted && el('div', { class: 'notice calm' }, [
        el('h3', { text: 'Changed since the question' }),
        'The open session was asked with revision ' + R.text(asked.definition_revision)
          + ' of this council; the project now holds revision ' + R.text(definition.definition_revision)
          + '. What was asked of whom is unchanged — the session keeps its own copy.'
      ]),
      definition.purpose && el('h2', { class: 'pane-title', text: 'Purpose' }),
      definition.purpose && el('p', { class: 'say flush', text: definition.purpose }),
      el('h2', { class: 'pane-title group', text: 'Seated' }),
      el('ul', { class: 'roster' }, R.list(definition.seats).map(function (seat) {
        return seatedRow(definition, seat);
      }))
    ];

    if (unseated.length) {
      blocks.push(el('h2', { class: 'pane-title group', text: 'Available, not seated' }));
      blocks.push(el('ul', { class: 'roster' }, unseated.map(function (member) {
        return unseatedRow(definition, member);
      })));
    }

    if (!historical) {
      blocks.push(el('div', { class: 'row group' }, [
        el('button', {
          class: 'action primary',
          type: 'button',
          data: { 'add-member': '1' },
          text: 'Add a member'
        })
      ]));
    }

    return D.frag(blocks);
  }

  global.CouncilMembersPane = { membersPane: membersPane, modelLine: modelLine };
})(window);
</script>
<script>
// The Sources pane: the material this council was grounded in, and — just as
// important — the material it was not.
//
// A source captured as a reference only still carries the hash of the bytes it
// stood for, so the inventory can say honestly that a claim citing it is a claim
// nobody can check here. That hash is read from the SOURCE record and never from
// the payload, which is exactly the field a withheld source does not have.

(function (global) {
  'use strict';

  var D = global.CouncilDom;
  var R = global.CouncilRecord;
  var el = D.el;

  function held(source) {
    if (!R.hasMaterial(source)) { return 'Reference only — material not in this project'; }
    return R.list(source.anchors).length + ' anchor(s), material held';
  }

  function sourcesPane(snapshot, session) {
    var definition = R.definitionOf(session, snapshot);
    var sources = R.list(definition && definition.sources);
    if (!sources.length) {
      return el('p', {
        class: 'empty',
        text: 'No source material has been captured into this council. Members with no grounding '
          + 'argue from the question and the context alone, and their claims are labelled accordingly.'
      });
    }

    var withMaterial = sources.filter(R.hasMaterial).length;
    return D.frag([
      el('h2', { class: 'pane-title', text: 'Source inventory' }),
      el('p', {
        class: 'superseded',
        text: withMaterial + ' of ' + sources.length
          + ' captures have their material in this project.'
      }),
      el('ul', { class: 'roster' }, sources.map(function (source) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: { 'open-source': source.source_id, revision: source.source_revision }
          }, [
            el('div', { class: 'who' }, [
              el('span', { class: 'name', text: source.title }),
              el('span', { class: 'kind', text: 'rev ' + R.text(source.source_revision) })
            ]),
            el('div', {
              class: 'line2',
              text: [R.text(source.author || source.locator), held(source)]
                .filter(Boolean).join(' · ')
            })
          ])
        ]);
      }))
    ]);
  }

  global.CouncilSourcesPane = { sourcesPane: sourcesPane, held: held };
})(window);
</script>
<script>
// The detail column: one thing at a time, opened from the reading column.
//
// Below a 900px panel a detail covers the reading column and Back returns to it;
// at or above 900px the two sit side by side and Back is hidden, because the
// detail column is simply where details appear. That is a container query in the
// stylesheet, not a measurement here — the page never asks how wide it is.
//
// Nothing in this file scrolls anything. A source opens with its metadata and
// the quoted span above the whole capture, so a reader in a 400px pane sees what
// was actually cited without being thrown into the middle of a document they
// have not been introduced to.

(function (global) {
  'use strict';

  var D = global.CouncilDom;
  var R = global.CouncilRecord;
  var P = global.CouncilParts;
  var el = D.el;

  function title(text) {
    return el('h3', { id: 'detail-title', tabindex: '-1', text: text });
  }

  function field(label, value) {
    if (value === null || value === undefined || value === '') { return null; }
    return el('dl', { class: 'field' }, [
      el('dt', { text: label }),
      typeof value === 'string' || typeof value === 'number'
        ? el('dd', { text: String(value) })
        : el('dd', {}, value)
    ]);
  }

  // A select over the host's enabled models. The empty option is not "no model":
  // it is "let the engine take the catalogue's first", which is what the engine
  // does and what the label says, so nobody discovers it by being billed for it.
  function modelSelect(id, models, chosen, emptyLabel) {
    var options = [el('option', { value: '', text: emptyLabel })];
    R.list(models).forEach(function (model) {
      options.push(el('option', {
        value: model.model_name,
        selected: model.model_name === chosen ? true : null,
        text: model.display
          ? model.display + ' (' + model.provider_display + ')'
          : model.model_name
      }));
    });
    // A hint the host no longer offers must still be visible and selected, or
    // saving the form would silently change which model answers.
    if (chosen && !R.list(models).some(function (m) { return m.model_name === chosen; })) {
      options.push(el('option', {
        value: chosen,
        selected: true,
        text: chosen + ' — not enabled in this Minerva'
      }));
    }
    return el('select', { id: id }, options);
  }

  // --------------------------------------------------------------- member

  function memberDetail(definition, memberId, context) {
    var member = R.memberOf(definition, memberId);
    if (!member) { return el('p', { class: 'empty', text: 'That member is not in this council.' }); }
    var seat = R.seatForMember(definition, memberId);

    var grounding = R.list(member.grounding);
    var groundingBody = grounding.length
      ? el('ul', { class: 'roster' }, grounding.map(function (ref) {
          var source = R.sourceOf(definition, ref.source_id, ref.source_revision);
          return el('li', {}, [
            el('button', {
              class: 'entry',
              type: 'button',
              data: { 'open-source': ref.source_id, revision: ref.source_revision }
            }, [
              (source ? source.title : ref.source_id) + ' · rev ' + R.text(ref.source_revision),
              source && !R.hasMaterial(source)
                && el('div', { class: 'line2', text: 'Material not in this project' })
            ])
          ]);
        }))
      : 'Nothing. This member holds no source material of its own.';

    return D.frag([
      el('h2', { text: 'Member' }),
      title(member.display_name),
      el('div', { class: 'who' }, [
        el('span', { class: 'kind', data: { kind: member.kind }, text: R.kindWord(member.kind) }),
        el('span', { class: 'seat', text: 'member revision ' + R.text(member.member_revision) })
      ]),
      member.represents && field('Represents', member.represents
        + '. The simulant and that author are separate identities; nothing here is a statement by them.'),
      seat && field('Seat in this council', seat.responsibility),
      field('Speaks to', member.scope),
      field('Does not establish', member.limitations),
      field('Grounded in', groundingBody),
      member.kind !== 'human' && context.editable && el('div', { class: 'composer' }, [
        el('label', { class: 'visible', for: 'member-model', text: 'Which model answers for this member' }),
        modelSelect('member-model', context.models, member.model_hint,
          'The first model Minerva has enabled'),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'action',
            type: 'button',
            data: { 'save-model': member.member_id },
            text: 'Save the model choice'
          })
        ])
      ])
    ]);
  }

  // --------------------------------------------------------------- source

  function sourceDetail(definition, sourceId, revision, anchorId, fetched) {
    var source = R.sourceOf(definition, sourceId, revision);
    if (!source) { return el('p', { class: 'empty', text: 'That source revision is not in this project.' }); }

    var head = [
      el('h2', { text: 'Source' }),
      title(source.title),
      field('Captured', 'revision ' + R.text(source.source_revision)
        + ' on ' + R.when(source.captured_at)),
      field('Author', source.author),
      field('Where it came from', source.locator)
    ];

    // The fetched capture is preferred over the inventory copy: in production
    // material may exceed the inline limit and be read separately.
    var live = fetched && R.hasMaterial(fetched) ? fetched : source;
    if (!R.hasMaterial(live)) {
      head.push(el('div', { class: 'notice' }, [
        el('h3', { text: 'Material not available' }),
        'This source was captured as a reference only, so nothing can be quoted from it here. '
          + 'A claim citing it is a claim you cannot check.'
      ]));
      // The hash is the whole value of an inventory entry: it says exactly which
      // bytes are missing, so the capture can be recognised if it comes back.
      head.push(field('Bytes it stood for', R.contentHash(source)));
      return D.frag(head);
    }

    var text = R.text(live.payload.inline);
    var anchor = R.anchorOf(source, anchorId);
    // The record's offsets are bytes; this string is indexed in code units.
    // R.anchorSpan does the conversion and answers null when it cannot place the
    // quote, in which case the capture is shown whole rather than with a mark
    // over words nobody cited.
    var span = R.anchorSpan(text, anchor);
    var excerpt = el('div', { class: 'excerpt' });
    if (span) {
      excerpt.appendChild(document.createTextNode(text.slice(0, span.start)));
      excerpt.appendChild(el('mark', { id: 'cited-span', text: text.slice(span.start, span.end) }));
      excerpt.appendChild(document.createTextNode(text.slice(span.end)));
    } else {
      excerpt.textContent = text;
    }

    // The cited words come first so a reader in a 400px pane sees what was
    // quoted without scrolling; the whole capture sits under it with the same
    // span marked, for reading it in context.
    return D.frag(head.concat([
      anchor && field('Cited span', 'bytes ' + R.text(anchor.start)
        + '–' + R.text(anchor.end) + ' of this capture'),
      anchor && el('blockquote', { class: 'quoted', text: anchor.quote }),
      field('Integrity', R.text(live.payload.byte_length) + ' bytes, '
        + R.text(live.payload.content_hash).slice(0, 18) + '…'),
      el('h2', { class: 'group', text: 'The capture' }),
      excerpt,
      el('h2', { class: 'group', text: 'Anchors in this capture' }),
      el('ul', { class: 'roster' }, R.list(source.anchors).map(function (a) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: {
              'open-source': source.source_id,
              revision: source.source_revision,
              anchor: a.anchor_id
            },
            text: a.quote
          })
        ]);
      }))
    ]));
  }

  // -------------------------------------------------------------- compare

  function compareDetail(session, ids) {
    var definition = session && session.definition_snapshot;
    var picked = R.list(ids).map(function (id) {
      return R.findContribution(session, id);
    }).filter(Boolean);

    var blocks = [
      el('h2', { text: 'Compare' }),
      title('Where these answers part company')
    ];
    if (picked.length < 2) {
      blocks.push(el('p', {
        class: 'empty',
        text: 'Pick a second answer to set beside this one. Everything either seat asserted '
          + 'is shown with the support it claimed.'
      }));
    }
    blocks.push(el('div', { class: 'compare' + (picked.length > 1 ? ' two' : '') },
      picked.map(function (c) {
        return el('div', { class: 'column' }, [
          P.identity(definition, c.member_id, c.seat_id),
          P.claimList(definition, c.claims, {})
        ]);
      })));

    if (picked.length > 1) {
      var counts = {};
      picked.forEach(function (c) {
        var seen = {};
        R.list(c.claims).forEach(function (claim) {
          R.list(claim.citations).forEach(function (cite) { seen[cite.source_id] = true; });
        });
        Object.keys(seen).forEach(function (id) { counts[id] = (counts[id] || 0) + 1; });
      });
      var common = Object.keys(counts).filter(function (id) { return counts[id] > 1; });
      blocks.push(el('p', { class: 'superseded group-tight',
        text: common.length
          ? 'Both cite ' + common.map(function (id) {
              var source = R.sourceOf(definition, id);
              return source ? source.title : id;
            }).join(' and ') + ', so the disagreement is over what it implies, not over what it says.'
          : 'These answers cite no source in common.'
      }));
    }

    var others = R.completedContributions(session).filter(function (c) {
      return R.list(ids).indexOf(c.contribution_id) < 0;
    });
    if (others.length) {
      blocks.push(el('h2', { class: 'group', text: 'Set another answer beside it' }));
      blocks.push(el('ul', { class: 'roster' }, others.map(function (c) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: { 'compare-add': c.contribution_id }
          }, [P.identity(definition, c.member_id, c.seat_id)])
        ]);
      })));
    }
    return D.frag(blocks);
  }

  // ------------------------------------------------------------ follow-up

  function followUpDetail(session, detail, context) {
    var definition = session && session.definition_snapshot;
    var seatId = detail.seat_id;
    var seat = R.seatOf(definition, seatId);
    var member = seat ? R.memberOf(definition, seat.member_id) : null;
    var from = detail.from ? R.findContribution(session, detail.from) : null;
    var claim = null;
    if (detail.claim_id) {
      R.runsOf(session).forEach(function (run) {
        R.partsOf(run).forEach(function (c) {
          R.list(c.claims).forEach(function (candidate) {
            if (candidate.claim_id === detail.claim_id) { claim = candidate; }
          });
        });
      });
    }

    return D.frag([
      el('h2', { text: 'Follow-up' }),
      title('Ask ' + R.text(member ? member.display_name : seatId) + ' one more thing'),
      el('p', {
        class: 'superseded',
        text: 'Only this seat is asked. The rest of the council is not re-run, and nothing '
          + 'already said is discarded.'
      }),
      claim && el('blockquote', { class: 'quoted', text: claim.text }),
      !claim && from && el('blockquote', { class: 'quoted', text: R.text(from.text).slice(0, 220) + '…' }),
      el('div', { class: 'composer' }, [
        el('label', { class: 'visually-hidden', for: 'follow-up-text', text: 'Your follow-up question' }),
        el('textarea', { id: 'follow-up-text', placeholder: 'What would you like this seat to answer?' }),
        el('label', { class: 'visible', for: 'follow-up-model', text: 'Model for this round' }),
        modelSelect('follow-up-model', context.models, '',
          'Whatever this member is normally asked with'),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'action primary',
            type: 'button',
            data: { 'send-follow-up': seatId, claim: detail.claim_id || '' },
            text: 'Ask this seat'
          }),
          el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: 'Cancel' })
        ])
      ])
    ]);
  }

  // ---------------------------------------------------------------- help

  // One headed block of the help sheet.
  function section(heading, paragraphs) {
    return D.frag([el('h4', { text: heading })].concat(paragraphs.map(function (text) {
      return el('p', { text: text });
    })));
  }

  // The shipped help, in the panel because that is where a reader is.
  //
  // Every claim here is one this build implements, and the limits at the end are
  // the ones architecture.md states rather than a softened version of them: help
  // that oversells is worse than no help, because a user only finds out at the
  // moment the thing fails. It is deliberately one screen of reference — the
  // README carries installation, models and troubleshooting, which are questions
  // asked before the panel opens.
  function helpDetail() {
    return D.frag([
      el('h2', { text: 'Help' }),
      title('How Council works'),
      el('div', { class: 'sheet' }, [
        section('Members and seats', [
          'A member is an identity; a seat is what that identity is responsible for in this '
            + 'council. They are separate so renaming one never renames the other, and so the '
            + 'same member can sit differently in two councils.',
          'An assistant is a functional advisor and represents nobody. A simulant interprets a '
            + 'named author and may only exist with captured material behind it, a narrow scope, '
            + 'and its gaps stated — it is an interpretation, never a statement by that person. '
            + 'The one human seat is you: nothing prompts it and no model answers for it.',
          'Exactly one seat is the chair. It synthesises the round and reports disagreement; it '
            + 'never adds a position of its own.'
        ]),
        section('What each member is sent', [
          'Every member in the opening round is sent the same context — your question and the '
            + 'session context — plus its own pinned grounding, and never another member\'s '
            + 'answer. That is what makes agreement mean something.',
          'A call is bounded in bytes. When the assembled prompt is too long, grounding and '
            + 'earlier contributions are dropped from the tail with a visible marker, and a '
            + 'member cannot cite material that was dropped before it was sent.'
        ]),
        section('Sources and revisions', [
          'Capturing material creates a source revision. Changing the material creates a NEW '
            + 'revision beside the old one; it is never an edit, so an answer given last week '
            + 'can still be read against the bytes it actually read.',
          'Moving a member onto a newer capture is an explicit act. Nothing re-grounds a member '
            + 'on your behalf, and doing so advances that member\'s revision so old contributions '
            + 'are not re-attributed to the new one.',
          'A source with no material in this project is legitimate — that is what an import '
            + 'without content looks like. Citations against it resolve to "material not '
            + 'available", and Sources says so rather than hiding it.'
        ]),
        section('Consulting the council', [
          'A consultation starts in a Minerva chat with Council chosen as its provider. The chat '
            + 'is the binding: the session belongs to it, and every follow-up, retry and answer '
            + 'stays attached to it. Council never routes by whichever tab is focused.',
          'One question runs one bounded round of the relevant members, then the chair '
            + 'synthesises. In the editor, "Ask this seat a follow-up" asks one member again '
            + 'and "Ask about this argument" asks whoever made one claim — either way the '
            + 'follow-up consults that seat alone and re-runs nobody else.',
          'The same two moves are typed in the chat: "/ask <member> <question>" asks one '
            + 'member alone, by display name, seat id or the id of a claim they made, and '
            + '"/bench" lists the latest round\u2019s members with their models, their claims '
            + 'labelled source, inference or unknown, and each one\u2019s status. A name that '
            + 'matches nobody, or two people, is refused with the list of seats rather than '
            + 'guessed at.'
        ]),
        section('Stopping and retrying', [
          'Stopping a chat turn cancels the round, including setup before a run exists. A member reply that lands afterwards is '
            + 'recorded as stale and changes nothing.',
          'Nothing retries itself. A failed or unanswered seat stays visible with an explicit '
            + 'Retry, and a retry is a fresh round over the seats that did not answer — so a '
            + 'partial answer is a state you can read, not an error you have to guess at.'
        ]),
        section('Keeping and reusing', [
          'Save the tab as you would any Minerva document: the councils, the sessions, the '
            + 'contributions, the source captures and the chat link are all in it.',
          'Closing a panel can leave its round running in the backend. Reopening the same '
            + 'document can recover that work while the backend still holds it. If the plugin '
            + 'or Minerva exits, saved in-flight work instead reopens as interrupted, with an '
            + 'explicit Retry. Nothing restarts model calls automatically.',
          'Pick the answers worth keeping and send them to the bound chat, or keep one as a '
            + 'native note; the link back to the contribution survives a note you later move, '
            + 'and a note that cannot be found is reported rather than dropped.',
          'A council can be exported and imported into another project. The export carries who '
            + 'is on the council and what grounds them, and it has nowhere to put a question, a '
            + 'transcript, an outcome, a note id or a chat id. Source material travels only for '
            + 'the sources you choose, and the reply names what was withheld — so exporting is '
            + 'a decision you make per source, not a switch that leaks everything.'
        ]),
        section('What this version does not do', [
          'Council is currently for small documents: councils, sessions, contributions and '
            + 'embedded excerpts share a 64 KiB backend limit and the host transport limit. '
            + 'The effective space for content is smaller because message framing also counts. '
            + 'Oversized writes are refused rather than truncated.',
          'A chat whose document has not been opened since the plugin started is a chat Council '
            + 'has no record of, and its first turn opens a fresh session in whatever document '
            + 'is loaded. The original project keeps its own session untouched.',
          'A chat answer or a tool call that lands while the tab is closed is in the backend '
            + 'and nowhere else. Reopening the council brings it in; if the backend has gone, '
            + 'the panel says so rather than saving the older copy quietly.',
          'Council does not research, does not browse, and invites nobody. Every participant is '
            + 'a model you enabled or you.'
        ])
      ]),
      el('div', { class: 'row group' }, [
        el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: 'Close' })
      ])
    ]);
  }

  // ------------------------------------------------------- assembly forms

  function createCouncilDetail() {
    return D.frag([
      el('h2', { text: 'New council' }),
      title('Start a council'),
      el('p', {
        class: 'superseded',
        text: 'A council opens with a chair and nothing else. The chair runs each round and '
          + 'reports where members disagree; it never adds a position of its own. Seat the '
          + 'members you want beside it next.'
      }),
      el('div', { class: 'composer' }, [
        el('label', { class: 'visible', for: 'council-name', text: 'Name' }),
        el('input', { id: 'council-name', type: 'text', placeholder: 'What this council is for, in a few words' }),
        el('label', { class: 'visible', for: 'council-purpose', text: 'Purpose' }),
        el('textarea', { id: 'council-purpose', placeholder: 'What kinds of decisions is this council asked to weigh in on?' }),
        el('div', { class: 'row' }, [
          el('button', { class: 'action primary', type: 'button', data: { 'create-council-send': '1' }, text: 'Create the council' }),
          el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: 'Cancel' })
        ])
      ])
    ]);
  }

  function addMemberDetail(context) {
    return D.frag([
      el('h2', { text: 'New member' }),
      title('Add a member to this council'),
      el('p', {
        class: 'superseded',
        text: 'An assistant is a functional advisor: it represents nobody. A simulant argues '
          + 'from captured writing and must say whose, and what that writing does not establish. '
          + 'Council v0.1 seats one human — you — and never consults them automatically.'
      }),
      el('div', { class: 'composer' }, [
        el('label', { class: 'visible', for: 'member-name', text: 'Display name' }),
        el('input', { id: 'member-name', type: 'text', placeholder: 'Unit costing' }),
        el('label', { class: 'visible', for: 'member-kind', text: 'Kind' }),
        el('select', { id: 'member-kind' }, [
          el('option', { value: 'assistant', text: 'Assistant — a functional advisor' }),
          el('option', { value: 'simulant', text: 'Simulant — argues from captured writing' }),
          el('option', { value: 'human', text: 'Human — you, never consulted automatically' })
        ]),
        el('label', { class: 'visible', for: 'member-represents', text: 'Represents (simulants only)' }),
        el('input', { id: 'member-represents', type: 'text', placeholder: 'Whose writing this argues from' }),
        el('label', { class: 'visible', for: 'member-scope', text: 'Speaks to' }),
        el('textarea', { id: 'member-scope', placeholder: 'What this member is qualified to argue about' }),
        el('label', { class: 'visible', for: 'member-limitations', text: 'Does not establish' }),
        el('textarea', { id: 'member-limitations', placeholder: 'What a reader must not take from this member' }),
        el('label', { class: 'visible', for: 'member-model', text: 'Which model answers for it' }),
        modelSelect('member-model', context.models, '', 'The first model Minerva has enabled'),
        el('div', { class: 'row' }, [
          el('button', { class: 'action primary', type: 'button', data: { 'add-member-send': '1' }, text: 'Add the member' }),
          el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: 'Cancel' })
        ])
      ])
    ]);
  }

  function seatMemberDetail(definition, memberId) {
    var member = R.memberOf(definition, memberId);
    return D.frag([
      el('h2', { text: 'New seat' }),
      title('Seat ' + R.text(member ? member.display_name : memberId)),
      el('p', {
        class: 'superseded',
        text: 'A seat is a responsibility, not an identity: it says what this member is being '
          + 'asked to cover in this council. The same member can be seated differently elsewhere.'
      }),
      el('div', { class: 'composer' }, [
        el('label', { class: 'visible', for: 'seat-responsibility', text: 'Responsibility' }),
        el('input', {
          id: 'seat-responsibility',
          type: 'text',
          placeholder: 'Say what the order does to the numbers.'
        }),
        el('div', { class: 'row' }, [
          el('button', { class: 'action primary', type: 'button', data: { 'seat-member-send': memberId }, text: 'Give this member a seat' }),
          el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: 'Cancel' })
        ])
      ])
    ]);
  }

  // ---------------------------------------------------------- the resting

  // The wide layout's resting state. A blank half-panel is a wasted half-panel,
  // and who is on the council and what grounds them is the context a reader
  // wants beside an argument. It is rendered unconditionally and hidden by the
  // container query when narrow, so no width detection is needed in script.
  function glance(snapshot, session) {
    var definition = R.definitionOf(session, snapshot);
    if (!definition) { return el('p', { class: 'resting', text: 'Nothing assembled yet.' }); }
    var sources = R.list(definition.sources);
    var withMaterial = sources.filter(R.hasMaterial).length;

    return D.frag([
      el('h2', { text: 'Council at a glance' }),
      el('ul', { class: 'roster' }, R.list(definition.seats).map(function (seat) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: { 'open-member': seat.member_id }
          }, [
            P.identity(definition, seat.member_id, null),
            el('div', { class: 'line2', text: seat.responsibility })
          ])
        ]);
      })),
      el('h2', { class: 'group', text: 'Grounding' }),
      el('p', {
        class: 'superseded',
        text: withMaterial + ' of ' + sources.length + ' sources have their material in this '
          + 'project; a citation into the rest cannot be checked here.'
      }),
      el('ul', { class: 'roster' }, sources.map(function (source) {
        return el('li', {}, [
          el('button', {
            class: 'entry',
            type: 'button',
            data: { 'open-source': source.source_id, revision: source.source_revision }
          }, [
            source.title,
            el('div', {
              class: 'line2',
              text: 'rev ' + R.text(source.source_revision)
                + (R.hasMaterial(source) ? '' : ' · material not in this project')
            })
          ])
        ]);
      }))
    ]);
  }

  global.CouncilDetail = {
    memberDetail: memberDetail,
    sourceDetail: sourceDetail,
    compareDetail: compareDetail,
    followUpDetail: followUpDetail,
    createCouncilDetail: createCouncilDetail,
    helpDetail: helpDetail,
    addMemberDetail: addMemberDetail,
    seatMemberDetail: seatMemberDetail,
    glance: glance,
    modelSelect: modelSelect
  };
})(window);
</script>
<script>
// What the panel does: what it reads, what it shows, and what it does when an
// answer arrives while you are reading something else.
//
// Four rules this file exists to hold:
//
//  1. The page is a view. Every render comes from a fresh snapshot.get. Nothing
//     is patched in place from an event payload, because an event carries no
//     authority — it says the record moved and never says what it now is.
//  2. Reading position is protected. Before a re-render the topmost visible
//     block is remembered by key; afterwards the scroller is nudged so that
//     block sits where it was. Saving scrollTop alone does not work, because
//     content inserted above the viewport changes what that number means.
//  3. Detail is a push, not a jump. Opening a member, a source or a comparison
//     records where you were and which control you used; Back restores both, and
//     Escape is Back. The control is remembered as a SELECTOR, not as a node: a
//     render replaces every node in the column, so a remembered node is detached
//     by the time Back runs and focusing it does nothing at all.
//  4. A refusal is not a status message. It stays until it is acknowledged or
//     acted on, where an ordinary note fades with the next thing that happens.

(function (global) {
  'use strict';

  var D = global.CouncilDom;
  var R = global.CouncilRecord;
  var el = D.el;

  var state = {
    snapshot: {},
    pane: 'session',
    detail: null,
    returnTo: null,
    picked: {},
    seen: {},
    started: false,
    models: [],
    modelsKnown: false,
    unreadable: '',
    refusal: null
  };

  var ui = {};
  var bridge = null;
  var textSize = null;

  // ------------------------------------------------------------- messages

  function say(text) {
    state.refusal = null;
    D.replace(ui.message, text ? el('span', { text: text }) : null);
  }

  // A refusal stays put. One status line shared with successes loses the reason
  // a change was rejected to whatever happened next, which is the one message a
  // reader actually needs.
  function refuse(error) {
    state.refusal = error;
    D.replace(ui.message, el('span', { class: 'refusal' }, [
      error.message || 'Refused.',
      ' ',
      el('button', {
        class: 'action quiet',
        type: 'button',
        data: { 'dismiss-refusal': '1' },
        text: 'Dismiss'
      })
    ]));
  }

  function announce(text) { ui.announcer.textContent = text; }

  // -------------------------------------------------- reading-position anchor

  function captureAnchor(scroller) {
    var frame = scroller.getBoundingClientRect();
    var nodes = scroller.querySelectorAll('[data-anchor]');
    for (var i = 0; i < nodes.length; i++) {
      var offset = nodes[i].getBoundingClientRect().top - frame.top;
      if (offset >= -8) { return { key: nodes[i].getAttribute('data-anchor'), offset: offset }; }
    }
    return null;
  }

  function restoreAnchor(scroller, anchor) {
    if (!anchor) { return; }
    var node = scroller.querySelector('[data-anchor="' + anchor.key + '"]');
    if (!node) { return; }
    var offset = node.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
    scroller.scrollTop += (offset - anchor.offset);
  }

  function inView(node, scroller) {
    var frame = scroller.getBoundingClientRect();
    var box = node.getBoundingClientRect();
    return box.top < frame.bottom && box.bottom > frame.top;
  }

  // ---------------------------------------------------------------- render

  function currentSession() { return R.selectedSession(state.snapshot); }

  function renderMasthead(session, definition) {
    D.replace(ui.councilName, [
      el('span', { text: definition ? definition.name : 'Council' }),
      definition && el('span', { text: 'rev ' + R.text(definition.definition_revision) })
    ]);
    ui.question.textContent = session ? R.text(session.question) : 'No question yet';

    var binding = (session && session.chat_binding) || {};
    D.replace(ui.questionMeta, session
      ? [
          el('span', { class: 'status', data: { status: session.status }, text: session.status }),
          el('span', { text: R.runsOf(session).length + ' round(s)' }),
          el('span', {
            text: binding.chat_id
              ? (binding.missing ? 'chat ' + binding.chat_id + ' (missing)' : 'chat ' + binding.chat_id)
              : 'not bound to a chat'
          })
        ]
      : [el('span', {
          text: R.list(state.snapshot.definitions).length
            ? 'Ready to be asked' : 'Nothing assembled yet'
        })]);
  }

  function renderFootrail() {
    D.replace(ui.sizer, [
      el('span', { class: 'visually-hidden', id: 'text-size-label', text: 'Council text size' }),
      el('button', {
        type: 'button',
        data: { 'text-smaller': '1' },
        title: 'Smaller text (Ctrl and minus)',
        aria: { label: 'Smaller text' },
        disabled: textSize.canShrink() ? null : true,
        text: 'A−'
      }),
      el('button', {
        type: 'button',
        data: { 'text-reset': '1' },
        title: 'Reset the text size (Ctrl and 0)',
        aria: { label: 'Reset text size' },
        text: textSize.label()
      }),
      el('button', {
        type: 'button',
        data: { 'text-larger': '1' },
        title: 'Larger text (Ctrl and plus)',
        aria: { label: 'Larger text' },
        disabled: textSize.canGrow() ? null : true,
        text: 'A+'
      })
    ]);
    ui.revision.textContent = 'revision ' + R.text(bridge.revision);
  }

  function readingContent(session) {
    if (state.unreadable) {
      return el('div', { class: 'notice' }, [
        el('h3', { text: 'This document is not one Council can edit' }),
        state.unreadable,
        el('p', {
          class: 'superseded flush group-tight',
          text: 'It is kept exactly as it was found and is handed back unchanged when the tab is saved.'
        })
      ]);
    }
    if (state.pane === 'members') {
      return global.CouncilMembersPane.membersPane(state.snapshot, session);
    }
    if (state.pane === 'sources') {
      return global.CouncilSourcesPane.sourcesPane(state.snapshot, session);
    }
    return global.CouncilSessionPane.sessionPane(state.snapshot, session, { picked: state.picked });
  }

  function detailContent(session) {
    var detail = state.detail;
    var definition = R.definitionOf(session, state.snapshot);
    var editable = R.editableDefinition(state.snapshot, session);
    var context = {
      models: state.models,
      modelsKnown: state.modelsKnown,
      editable: !!editable
    };
    var V = global.CouncilDetail;

    if (detail.kind === 'member') {
      return V.memberDetail(editable || definition, detail.member_id, context);
    }
    if (detail.kind === 'source') {
      return V.sourceDetail(definition, detail.source_id, detail.revision, detail.anchor_id, detail.fetched);
    }
    if (detail.kind === 'compare') { return V.compareDetail(session, detail.ids); }
    if (detail.kind === 'follow_up') { return V.followUpDetail(session, detail, context); }
    if (detail.kind === 'help') { return V.helpDetail(); }
    if (detail.kind === 'create_council') { return V.createCouncilDetail(); }
    if (detail.kind === 'add_member') { return V.addMemberDetail(context); }
    if (detail.kind === 'seat_member') { return V.seatMemberDetail(editable, detail.member_id); }
    return null;
  }

  // What the reader has typed but not sent.
  //
  // A composer is the one place in the panel holding something that exists
  // nowhere else, and the panel re-renders on every event — an answer landing
  // mid-round, the model catalogue arriving after a chooser was opened. Both
  // replace the detail column under a half-written follow-up. So the values are
  // lifted out before the replace and put back after it, along with the cursor,
  // whenever the SAME detail is being redrawn. A different detail is a different
  // form and gets none of this.
  function captureDraft(root) {
    var draft = { values: {}, focus: '', start: 0, end: 0 };
    var fields = root.querySelectorAll('input[id], textarea[id], select[id]');
    for (var i = 0; i < fields.length; i++) {
      var field = fields[i];
      if (field.type === 'checkbox' || field.type === 'radio') { continue; }
      draft.values[field.id] = field.value;
      if (field === document.activeElement) {
        draft.focus = field.id;
        // A select has no selection range, and reading one throws in some
        // browsers, so it is only asked of the fields that have it.
        if (field.selectionStart !== undefined && field.selectionStart !== null) {
          draft.start = field.selectionStart;
          draft.end = field.selectionEnd;
        }
      }
    }
    return draft;
  }

  function restoreDraft(root, draft) {
    Object.keys(draft.values).forEach(function (id) {
      var field = root.querySelector('#' + cssEscape(id));
      // Only a field that is still there and still empty: a form the render
      // filled in from the record has newer values than the ones lifted out.
      if (field && !field.value) { field.value = draft.values[id]; }
    });
    if (!draft.focus) { return; }
    var focused = root.querySelector('#' + cssEscape(draft.focus));
    if (!focused) { return; }
    focused.focus({ preventScroll: true });
    if (focused.setSelectionRange && focused.type !== 'checkbox') {
      try { focused.setSelectionRange(draft.start, draft.end); } catch (e) { /* not a text field */ }
    }
  }

  var lastDetail = null;

  function renderDetail(session) {
    ui.stage.setAttribute('data-detail', state.detail ? 'open' : 'closed');
    if (!state.detail) {
      lastDetail = null;
      D.replace(ui.detail, global.CouncilDetail.glance(state.snapshot, session));
      return;
    }
    var redrawing = state.detail === lastDetail;
    var draft = redrawing ? captureDraft(ui.detail) : null;
    lastDetail = state.detail;

    D.replace(ui.detail, [
      el('p', { class: 'back-row' }, [
        el('button', { class: 'action quiet', type: 'button', data: { back: '1' }, text: '← Back' })
      ]),
      detailContent(session)
    ]);
    if (draft) { restoreDraft(ui.detail, draft); }
    if (state.detail.focusOnOpen) {
      state.detail.focusOnOpen = false;
      var head = ui.detail.querySelector('#detail-title');
      if (head) { head.focus(); }
      // Deliberately no scroll to the marked span: the quote is already shown
      // above the capture, and a view that jumps on open has taken the reading
      // position away from the reader.
      ui.detail.scrollTop = 0;
    }
  }

  function render() {
    var session = currentSession();
    var definition = R.definitionOf(session, state.snapshot);
    renderMasthead(session, definition);

    Array.prototype.forEach.call(ui.panes.querySelectorAll('button'), function (button) {
      var mine = button.getAttribute('data-pane') === state.pane;
      // aria-current, not aria-selected: these are plain buttons, and
      // aria-selected is not mapped without a tab role.
      if (mine) { button.setAttribute('aria-current', 'page'); }
      else { button.removeAttribute('aria-current'); }
    });

    var anchor = captureAnchor(ui.reading);
    D.replace(ui.reading, readingContent(session));
    restoreAnchor(ui.reading, anchor);
    renderDetail(session);
    renderFootrail();
    noteArrivals(session);
  }

  // A contribution that completes while you are reading is announced and
  // offered, never scrolled to: the reader decides when to move.
  function noteArrivals(session) {
    var fresh = [];
    R.runsOf(session).forEach(function (run) {
      R.list(run.contributions).concat(run.synthesis ? [run.synthesis] : []).forEach(function (c) {
        if (!c || c.status !== 'complete' || state.seen[c.contribution_id]) { return; }
        state.seen[c.contribution_id] = true;
        fresh.push(c);
      });
    });
    if (!state.started) { state.started = true; ui.arrival.hidden = true; return; }
    if (!fresh.length) { return; }

    var definition = R.definitionOf(session, state.snapshot);
    var last = fresh[fresh.length - 1];
    var member = R.memberOf(definition, last.member_id);
    var who = (member && member.display_name) || last.seat_id;
    announce(who + ' answered.');

    var node = ui.reading.querySelector('#contrib-' + cssEscape(last.contribution_id));
    if (state.pane !== 'session' || !node || inView(node, ui.reading)) {
      ui.arrival.hidden = true;
      return;
    }
    ui.arrival.hidden = false;
    ui.arrival.textContent = who + ' answered ↓';
    ui.arrival.onclick = function () {
      var target = ui.reading.querySelector('#contrib-' + cssEscape(last.contribution_id));
      if (target) { target.scrollIntoView({ block: 'start' }); target.focus(); }
      ui.arrival.hidden = true;
    };
  }

  function cssEscape(value) { return String(value).replace(/[^A-Za-z0-9_-]/g, '\\$&'); }

  // ------------------------------------------------------------ navigation

  // A re-render replaces every node in the reading column, so a remembered DOM
  // node is dead by the time Back runs. What survives is a control's data
  // attributes, so the return trip is recorded as a selector.
  function selectorFor(node) {
    if (!node || !node.attributes) { return ''; }
    var parts = [node.tagName.toLowerCase()];
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('data-') === 0) { parts.push('[' + a.name + '="' + a.value + '"]'); }
    });
    return parts.length > 1 ? parts.join('') : '';
  }

  // The details that offer a model choice. Opening one re-reads the host's
  // catalogue, because a model enabled in Minerva since the panel opened must
  // appear without reopening the tab.
  var OFFERS_MODELS = { member: true, add_member: true, follow_up: true };

  function openDetail(detail, trigger) {
    if (!state.detail) {
      state.returnTo = { scrollTop: ui.reading.scrollTop, trigger: selectorFor(trigger) };
    }
    detail.focusOnOpen = true;
    state.detail = detail;
    render();
    if (OFFERS_MODELS[detail.kind]) {
      readModels().then(function () { if (state.detail === detail) { render(); } });
    }
  }

  // The catalogue is never held for longer than the control that shows it. A
  // failure leaves the last list in place: an empty select would be a worse
  // answer than a slightly old one.
  function readModels() {
    return bridge.models().then(function (catalogue) {
      if (catalogue.known || catalogue.models.length) {
        state.models = catalogue.models;
        state.modelsKnown = catalogue.known;
      }
      return catalogue;
    });
  }

  function back() {
    var to = state.returnTo;
    state.detail = null;
    state.returnTo = null;
    render();
    if (!to) { return; }
    ui.reading.scrollTop = to.scrollTop;
    var trigger = to.trigger ? ui.reading.querySelector(to.trigger) : null;
    // preventScroll: focusing must not undo the scroll position just restored.
    if (trigger) { trigger.focus({ preventScroll: true }); }
    else { ui.reading.focus({ preventScroll: true }); }
  }

  function goPane(pane) {
    state.pane = pane;
    state.detail = null;
    state.returnTo = null;
    ui.reading.scrollTop = 0;
    render();
    // set_view advances no revision, so nothing here may treat the reply as
    // evidence that anything was saved. It is user intent, sent and forgotten.
    bridge.send('wrapper.set_view', {
      view: {
        pane: pane,
        selected_session_id: (currentSession() || {}).session_id,
        selected_definition_id: (R.editableDefinition(state.snapshot, currentSession()) || {}).definition_id
      }
    });
  }

  // --------------------------------------------------------------- writing

  function value(id) {
    var node = ui.detail.querySelector('#' + id);
    return node ? String(node.value || '').trim() : '';
  }

  function mintId(prefix) {
    return prefix + '-' + Date.now().toString(36) + '-'
      + Math.floor(Math.random() * 1e6).toString(36);
  }

  function afterWrite(reply, message) {
    if (!reply || !reply.ok) { return false; }
    state.detail = null;
    state.returnTo = null;
    say(message);
    render();
    return true;
  }

  // Starting one of the councils Council ships with.
  //
  // It is an ordinary definition.import of an ordinary record — the presets are
  // inlined into this page by ui/build.mjs from council/presets, the same files
  // the backend embeds for minerva_council_presets. The one thing changed on the
  // way in is the definition_id: the shipped id NAMES the preset rather than
  // claiming a slot in this project, and import refuses an id the project
  // already holds, so minting a fresh one is what lets the same preset be
  // started twice and edited apart.
  function usePreset(id) {
    var preset = null;
    (global.CouncilPresets || []).forEach(function (candidate) {
      if (candidate.definition_id === id) { preset = candidate; }
    });
    if (!preset) { say('That council is not one this build ships.'); return; }
    var definition = JSON.parse(JSON.stringify(preset));
    definition.definition_id = mintId('def');
    definition.definition_revision = 1;
    bridge.mutate('definition.import', { definition: definition }).then(function (reply) {
      afterWrite(reply, 'Started ' + definition.name + '. Read its members before you ask anything: '
        + 'a preset is a starting point, not a fact about your situation.');
    });
  }

  function createCouncil() {
    var name = value('council-name');
    if (!name) { say('Give the council a name first.'); return; }
    var chairId = mintId('mem');
    bridge.mutate('definition.upsert', {
      definition: {
        schema_version: 1,
        record_kind: 'council_definition',
        definition_id: mintId('def'),
        definition_revision: 1,
        name: name,
        purpose: value('council-purpose'),
        members: [{
          member_id: chairId,
          member_revision: 1,
          kind: 'assistant',
          display_name: 'Chair',
          scope: 'Runs the round, reports where members disagree, and never adds a position of its own.',
          limitations: 'Has no grounding of its own; everything it reports must trace to a member contribution.',
          grounding: []
        }],
        seats: [{
          seat_id: mintId('seat'),
          member_id: chairId,
          responsibility: 'Synthesise the round and preserve disagreement.',
          role: 'chair'
        }],
        sources: [],
        // The council's own limits. They are data because a round is planned
        // from the record: a limit that lived only in a request would be gone by
        // the time it mattered.
        deliberation: {
          max_members_per_round: 4,
          max_concurrent_members: 2,
          max_prompt_bytes: 16384,
          run_budget_seconds: 300,
          max_rounds_per_session: 12,
          independent_initial_round: true,
          preserve_disagreement: true,
          per_member_timeout_seconds: 120
        }
      }
    }).then(function (reply) {
      afterWrite(reply, 'Council created with a chair. Add the members you want beside it.');
    });
  }

  function addMember() {
    var definition = R.editableDefinition(state.snapshot, currentSession());
    if (!definition) { say('There is no council in this project to add a member to.'); return; }
    var name = value('member-name');
    if (!name) { say('Give the member a display name first.'); return; }
    var kind = value('member-kind') || 'assistant';
    var member = {
      member_id: mintId('mem'),
      kind: kind,
      display_name: name,
      grounding: []
    };
    if (kind === 'simulant' && value('member-represents')) {
      member.represents = value('member-represents');
    }
    if (value('member-scope')) { member.scope = value('member-scope'); }
    if (value('member-limitations')) { member.limitations = value('member-limitations'); }
    // A human is never consulted by a round, so a model hint on one would be a
    // provenance nobody can honour.
    if (kind !== 'human' && value('member-model')) { member.model_hint = value('member-model'); }

    bridge.mutate('member.upsert', {
      definition_id: definition.definition_id,
      member: member
    }).then(function (reply) {
      afterWrite(reply, name + ' is in the council. Give them a seat to have them consulted.');
    });
  }

  function saveModel(memberId) {
    var definition = R.editableDefinition(state.snapshot, currentSession());
    var member = R.memberOf(definition, memberId);
    if (!member) { say('That member is no longer in this council.'); bridge.read(); return; }
    var next = {};
    Object.keys(member).forEach(function (key) {
      // member_revision is minted by the engine when the identity changes;
      // sending one back is refused.
      if (key !== 'member_revision') { next[key] = member[key]; }
    });
    var chosen = value('member-model');
    if (chosen) { next.model_hint = chosen; } else { delete next.model_hint; }

    bridge.mutate('member.upsert', {
      definition_id: definition.definition_id,
      member: next
    }).then(function (reply) {
      if (!reply || !reply.ok) { return; }
      say(chosen
        ? member.display_name + ' will be asked with ' + chosen + '.'
        : member.display_name + ' will be asked with whichever model Minerva lists first.');
      render();
    });
  }

  function seatMember(memberId) {
    var definition = R.editableDefinition(state.snapshot, currentSession());
    if (!definition) { say('There is no council in this project to seat into.'); return; }
    var responsibility = value('seat-responsibility');
    if (!responsibility) { say('Say what this seat is responsible for first.'); return; }
    var next = JSON.parse(JSON.stringify(definition));
    next.seats = R.list(next.seats).concat([{
      seat_id: mintId('seat'),
      member_id: memberId,
      responsibility: responsibility,
      role: 'advisor'
    }]);
    // An edit advances the revision it was written against; the engine refuses
    // one that is not ahead of what it holds.
    next.definition_revision = Number(next.definition_revision) + 1;
    bridge.mutate('definition.upsert', { definition: next }).then(function (reply) {
      afterWrite(reply, 'Seated. The next round will consult them.');
    });
  }

  function sendFollowUp(seatId, claimId) {
    var session = currentSession();
    if (!session) { say('There is no session to follow up on.'); return; }
    var prompt = value('follow-up-text');
    if (!prompt) { say('Write the follow-up first.'); return; }
    var payload = { session_id: session.session_id, kind: 'follow_up', prompt: prompt };
    // A follow-up about an argument is routed by the engine to whoever made it,
    // so the claim travels alone; naming a seat as well is refused when they
    // disagree.
    if (claimId) { payload.addressed_claim_id = claimId; }
    else { payload.addressed_seat_id = seatId; payload.seat_ids = [seatId]; }
    var model = value('follow-up-model');
    if (model && seatId) { payload.model_overrides = {}; payload.model_overrides[seatId] = model; }

    bridge.mutate('run.start', payload).then(function (reply) {
      if (!reply || !reply.ok) { return; }
      state.detail = null;
      state.returnTo = null;
      state.pane = 'session';
      say('Asked. Only that seat was consulted.');
      render();
    });
  }

  function handoff() {
    var session = currentSession();
    if (!session) { say('There is no session to send.'); return; }
    var ids = Object.keys(state.picked);
    bridge.send('wrapper.chat_handoff', {
      session_id: session.session_id,
      contribution_ids: ids
    }).then(function (reply) {
      if (!reply || !reply.ok) { return; }
      say('Sent ' + reply.payload.characters + ' characters to chat ' + reply.payload.chat_id + '.');
    });
  }

  // ---------------------------------------------------------------- events

  var TRIGGERS = ['[data-back]', '[data-pane]', '[data-goto-pane]', '[data-open-member]',
    '[data-open-source]', '[data-compare]', '[data-compare-add]', '[data-follow-up]',
    '[data-follow-claim]', '[data-send-follow-up]', '[data-retry-run]', '[data-retry-seat]',
    '[data-cancel-run]', '[data-create-council]', '[data-create-council-send]',
    '[data-use-preset]', '[data-help]',
    '[data-add-member]', '[data-add-member-send]', '[data-seat-member]', '[data-seat-member-send]',
    '[data-save-model]', '[data-dismiss-refusal]', '[data-text-larger]',
    '[data-text-smaller]', '[data-text-reset]'].join(',');

  function onClick(event) {
    var target = event.target.closest(TRIGGERS);
    if (!target) { return; }
    var d = target.dataset;

    // A valueless data- attribute reads back as '', which is falsy. Presence,
    // not truth, is what these tests have to ask for.
    if (d.back !== undefined) { back(); return; }
    if (d.dismissRefusal !== undefined) { say(''); return; }
    if (d.textLarger !== undefined) { textSize.step(1); renderFootrail(); return; }
    if (d.textSmaller !== undefined) { textSize.step(-1); renderFootrail(); return; }
    if (d.textReset !== undefined) { textSize.reset(); renderFootrail(); return; }
    if (d.pane) { goPane(d.pane); return; }
    if (d.gotoPane) { goPane(d.gotoPane); return; }

    if (d.openMember) { openDetail({ kind: 'member', member_id: d.openMember }, target); return; }

    if (d.openSource) {
      var wanted = {
        kind: 'source',
        source_id: d.openSource,
        revision: Number(d.revision),
        anchor_id: d.anchor || ''
      };
      openDetail(wanted, target);
      // The material is fetched rather than read out of the roster the page
      // already has: in production it may exceed the inline limit and live in a
      // blob.
      bridge.send('source.fetch', {
        definition_id: (R.definitionOf(currentSession(), state.snapshot) || {}).definition_id,
        source_id: wanted.source_id,
        source_revision: wanted.revision
      }).then(function (reply) {
        if (!reply || !reply.ok || state.detail !== wanted) { return; }
        wanted.fetched = reply.payload.source;
        render();
      });
      return;
    }

    if (d.compare) { openDetail({ kind: 'compare', ids: [d.compare] }, target); return; }
    if (d.compareAdd) {
      state.detail.ids = state.detail.ids.slice(0, 1).concat([d.compareAdd]);
      state.detail.focusOnOpen = true;
      render();
      return;
    }

    if (d.followUp) {
      openDetail({ kind: 'follow_up', seat_id: d.followUp, from: d.from }, target);
      return;
    }
    if (d.followClaim) {
      var contribution = null;
      R.runsOf(currentSession()).forEach(function (run) {
        R.partsOf(run).forEach(function (c) {
          R.list(c.claims).forEach(function (claim) {
            if (claim.claim_id === d.followClaim) { contribution = c; }
          });
        });
      });
      if (!contribution) { say('That argument is no longer in the session.'); bridge.read(); return; }
      openDetail({
        kind: 'follow_up',
        seat_id: contribution.seat_id,
        from: contribution.contribution_id,
        claim_id: d.followClaim
      }, target);
      return;
    }
    if (d.sendFollowUp) { sendFollowUp(d.sendFollowUp, d.claim || ''); return; }

    if (d.help !== undefined) { openDetail({ kind: 'help' }, target); return; }
    if (d.usePreset) { usePreset(d.usePreset); return; }
    if (d.createCouncil !== undefined) { openDetail({ kind: 'create_council' }, target); return; }
    if (d.createCouncilSend !== undefined) { createCouncil(); return; }
    if (d.addMember !== undefined) { openDetail({ kind: 'add_member' }, target); return; }
    if (d.addMemberSend !== undefined) { addMember(); return; }
    if (d.seatMember) { openDetail({ kind: 'seat_member', member_id: d.seatMember }, target); return; }
    if (d.seatMemberSend) { seatMember(d.seatMemberSend); return; }
    if (d.saveModel) { saveModel(d.saveModel); return; }

    if (d.retryRun) {
      bridge.mutate('run.retry', {
        session_id: (currentSession() || {}).session_id,
        run_id: d.retryRun
      }).then(function (reply) { if (reply && reply.ok) { say('Retrying.'); render(); } });
      return;
    }

    if (d.retrySeat) {
      var session = currentSession();
      var last = R.lastRun(session);
      if (!last) { say('There is no round to retry. The panel has re-read the session.'); bridge.read(); return; }
      bridge.mutate('run.retry', {
        session_id: session.session_id,
        run_id: last.run_id,
        seat_ids: [d.retrySeat]
      }).then(function (reply) { if (reply && reply.ok) { say('Asking that seat again.'); render(); } });
      return;
    }

    if (d.cancelRun) {
      bridge.mutate('run.cancel', {
        session_id: (currentSession() || {}).session_id,
        run_id: d.cancelRun
      }).then(function (reply) {
        if (reply && reply.ok) { say('Cancelled. Answers already in are kept.'); render(); }
      });
    }
  }

  function onChange(event) {
    var node = event.target.closest('[data-pick]');
    if (!node) { return; }
    var id = node.getAttribute('data-pick');
    if (node.checked) { state.picked[id] = true; } else { delete state.picked[id]; }
    ui.handoff.disabled = Object.keys(state.picked).length === 0;
  }

  function onKeydown(event) {
    if (event.key === 'Escape' && state.detail) {
      event.preventDefault();
      back();
      return;
    }
    // Minerva's own scale shortcuts do not reach inside the embedded browser, so
    // a reader pressing them here gets Council's text size instead of nothing.
    if (!event.ctrlKey && !event.metaKey) { return; }
    if (event.key === '+' || event.key === '=') { event.preventDefault(); textSize.step(1); renderFootrail(); }
    else if (event.key === '-' || event.key === '_') { event.preventDefault(); textSize.step(-1); renderFootrail(); }
    else if (event.key === '0') { event.preventDefault(); textSize.reset(); renderFootrail(); }
  }

  // ------------------------------------------------------------------ boot

  function applyTheme(payload) {
    document.documentElement.setAttribute('data-theme', payload && payload.dark ? 'dark' : 'light');
  }

  function boot() {
    ui = {
      councilName: document.getElementById('council-name'),
      question: document.getElementById('question'),
      questionMeta: document.getElementById('question-meta'),
      panes: document.getElementById('panes'),
      stage: document.getElementById('stage'),
      reading: document.getElementById('reading'),
      detail: document.getElementById('detail'),
      message: document.getElementById('message'),
      revision: document.getElementById('revision'),
      sizer: document.getElementById('sizer'),
      handoff: document.getElementById('handoff'),
      announcer: document.getElementById('announcer'),
      arrival: document.getElementById('arrival')
    };

    bridge = new global.CouncilBridgeClient.Bridge(global.council);
    textSize = new global.CouncilPrefs.TextSize(bridge);
    bridge.onRefusal = refuse;
    bridge.onSnapshot = function (snapshot) { state.snapshot = snapshot || {}; };

    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKeydown);
    ui.handoff.addEventListener('click', handoff);
    ui.handoff.disabled = true;

    global.council.onEvent(function (event) {
      if (event.event === 'council.theme_changed') { applyTheme(event.payload); return; }
      if (event.event === 'council.focus_changed') {
        document.documentElement.setAttribute('data-focused', String(!!(event.payload || {}).focused));
        return;
      }
      // The wrapper could not read back a council the engine has carried
      // further. It is a refusal, not a status line: it stays until it is
      // acknowledged, because what it says is that what was saved is missing
      // something.
      if (event.event === 'council.sync_warning') {
        refuse({ message: (event.payload || {}).message || 'This council is behind the Council backend.' });
        return;
      }
      // Everything else says the record moved. The page re-reads rather than
      // trusting the payload it was handed.
      bridge.read().then(render);
    });

    bridge.describe().then(function (reply) {
      if (reply && reply.ok && reply.payload) {
        applyTheme(reply.payload.theme);
        // The wrapper decides which sizes it will store; the page offers only
        // the ones both know.
        textSize.adopt(reply.payload.text_scales);
        if (reply.payload.unreadable) {
          state.unreadable = R.text(reply.payload.unreadable_reason);
        }
      }
      return textSize.load();
    }).then(function () {
      return bridge.read();
    }).then(function () {
      var view = state.snapshot.view || {};
      if (['session', 'members', 'sources'].indexOf(view.pane) >= 0) { state.pane = view.pane; }
      render();
      // The catalogue is NOT read here. Nothing on the first screen needs it —
      // the Members pane names each member's own model_hint out of the record —
      // and reading it costs a host round trip per enabled provider. It is read
      // when a chooser is opened, which is also the only moment it can be stale.
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // Exposed for the harness in ui/tests: it drives the page the way a reader
  // does, and needs to be able to ask what the page currently believes.
  global.CouncilApp = {
    state: state,
    render: render,
    back: back,
    bridge: function () { return bridge; },
    textSize: function () { return textSize; }
  };
})(window);
</script>
</body>
</html>
