# Pinned inputs for the pcb plugin's embedded Python runtime bundle.
#
# Consumed by scripts/build-python-runtime-bundle.sh (plugin-agnostic; every
# pcb-specific pin lives HERE). Shell-sourceable KEY=VALUE on purpose — same
# format rationale as cad/scripts/runtime-bundle.lock.
#
# The CI PBS download cache keys on the hash of THIS FILE, so bumping any pin
# invalidates the cache exactly when it should.

# python-build-standalone release tag + CPython version. Same pins as cad's
# lock so the two plugins ride one PBS download per runner when caches share.
PBS_TAG="20260510"
CPYTHON="3.12.13"

# Runtime deps only — the worker's [project.dependencies], EXACT pins for
# reproducibility. dev extras (pytest, pygerber) must NEVER enter the bundle:
# pygerber is the CAM oracle the test suite grades the emitter with, and
# shipping the oracle beside the emitter would let a packaging mistake grade
# its own homework. pyclipper is the FIRST of two native wheels; cp312 coverage verified
# in worker/pyproject.toml's wheel-availability note (manylinux x86_64 +
# 2_28_aarch64 + macosx universal2 + win_amd64) — so unlike cad, pcb ships
# the FULL platform matrix including linux-arm64.
# pillow is the SECOND native wheel (see the note in worker/pyproject.toml for
# why the texture bake needs a rasteriser and why compositing the existing
# per-layer SVGs was rejected). Its cp312 wheel coverage was checked against
# the PyPI release files for 12.3.0 and matches WHEEL_PLATS on all five build
# targets: macosx_10_13_x86_64, macosx_11_0_arm64, the
# manylinux_2_27/_2_28 x86_64 + aarch64 pair, and win_amd64.
PIP_PKGS="pyyaml==6.0.2 gerber-writer==0.4.3.3 pyclipper==1.4.0 pillow==12.3.0"

# gerbonara is a RUNTIME dependency: pcb.fab_preview re-parses the emitted
# Gerber/Excellon bytes with it — a reader independent of the writer is the
# whole point of that preview — so a bundle without it answers every preview
# with ModuleNotFoundError. Pure-Python (py3-none-any). --no-deps because its
# metadata declares click/rtree/quart, which only its CLI and web viewer
# import; the reader path we ship touches none of them, and LAYER1_IMPORTS
# below is the check that this stays true.
PIP_NO_DEPS_PKGS="gerbonara==1.6.3"

# ── EXPECTED BYTES (acceptance check K23, work item 019ffc543d1d) ────────────
#
# A VERSION IS NOT AN IMMUTABLE IDENTITY. Everything above pins what to ask
# for; nothing pins what must come back. The same release tag can serve
# different bytes after a re-upload, through a compromised mirror, or via a
# truncated transfer that still exits 0 — and these artifacts are EXTRACTED
# AND EXECUTED during packaging, then shipped to every user of the plugin.
#
# build-python-runtime-bundle.sh verifies each of these BEFORE extraction and
# ALSO on a cache hit (a cached artifact was fetched at some earlier time under
# conditions nobody can now inspect, and on CI the cache is a shared writable
# store keyed by a hash of THIS FILE rather than of the payload).
#
# HOW TO POPULATE, once per pin: download the asset, sha256 it, paste it here,
# and record the URL it came from in the same commit. Do NOT copy a hash from
# anywhere but the bytes you actually fetched — a hash taken from the same page
# that served the file proves nothing about the file.
#
# EMPTY MEANS UNVERIFIED, AND THE BUILD SAYS SO on every run rather than
# treating silence as safety. tests/test_runtime_input_pins.py turns the
# omission into a FAILING check, so an unpinned input is tracked work rather
# than an invisible hole.
#
# Provenance for every input below:
#   python-build-standalone — https://github.com/astral-sh/python-build-standalone
#     releases/download/$PBS_TAG/cpython-$CPYTHON+$PBS_TAG-<asset>-install_only.tar.gz
#     License: PSF-2.0 covers the CPython it packages. The project's OWN
#     license was recorded here as BSD-3-Clause, which is WRONG (review of
#     019ffc543d1d); it is believed to be MPL-2.0 but that was not confirmed
#     from the source, so it is marked below rather than swapped for another
#     unverified value.
#   ripgrep — https://github.com/BurntSushi/ripgrep releases/download/$RG_VERSION/...
#     License: MIT OR Unlicense.
#   wheels — PyPI, versions pinned in PIP_PKGS / PIP_NO_DEPS_PKGS above.
#     PyYAML MIT; pyclipper MIT (Clipper itself Boost-1.0); gerbonara
#     Apache-2.0 (License-Expression in its wheel METADATA); gerber-writer NOT
#     CONFIRMED (Ucamco — possibly Apache-2.0, recorded as MIT without a
#     source).
#     pillow MIT-CMU (License-Expression read from the installed 12.3.0
#     distribution metadata, not from recollection).
#
# UNRESOLVED LICENSES, using this repo's own convention for them (see
# scripts/gen_notice.py, which fails the release gate on any entry whose
# license is empty or contains "unknown" rather than shipping a guess). A
# provenance record exists to be TRUSTED FOR A DISTRIBUTION DECISION, so an
# unverified value in it is worse than an admitted gap.
PBS_PROJECT_LICENSE="UNKNOWN — pending verification (believed MPL-2.0)"
GERBER_WRITER_LICENSE="UNKNOWN — pending verification (recorded MIT without a source)"
PBS_SHA256_LINUX_X86_64=""
PBS_SHA256_LINUX_ARM64=""
PBS_SHA256_MACOS_ARM64=""
PBS_SHA256_MACOS_AMD64=""
PBS_SHA256_WINDOWS_X86_64=""

RG_SHA256_LINUX_X86_64=""
RG_SHA256_LINUX_ARM64=""
RG_SHA256_MACOS_ARM64=""
RG_SHA256_MACOS_AMD64=""
RG_SHA256_WINDOWS_X86_64=""

# Wheels are pinned by version above but NOT yet by hash. Closing this needs a
# generated requirements file consumed with pip --require-hashes, which refuses
# the whole install if any wheel's bytes differ. Tracked by the same test.
PIP_REQUIRE_HASHES_FILE=""

# Layer-1 import self-test (native builds only; cross targets skip). Imports
# every runtime dep plus both first-party worker packages, so an empty or
# mis-copied site-packages fails the bundle build, not the first user.
LAYER1_IMPORTS="import yaml; import gerber_writer; import pyclipper; import gerbonara; import PIL.Image; import pcb_worker; import agent_router"

# First-party worker code copied into site-packages. Both packages from
# worker/pyproject.toml's wheel target: pcb_worker (the JSON-RPC worker) and
# agent_router (the vendored routing engine it imports).
WORKER_SOURCE_DIR="worker"
WORKER_PACKAGES="pcb_worker agent_router"

# go:embed-reachable output dir (Go forbids `..` in embed paths, so the
# bundle must live under the Go source tree). NOTE unlike cad, this dir
# carries COMMITTED zero-byte placeholders so the plugin compiles without a
# bundle (empty embed => sharedruntime dev-tier fallback); the CI package job
# overwrites them and pcb.yml's per-plugin 40MB size assertion catches a
# release that didn't (pcb bundles are bare-CPython-sized, ~25-110MB — cad's
# 100MB threshold would red the smaller legs).
BUNDLE_OUT_DIR="internal/pcbruntime/bundle"
