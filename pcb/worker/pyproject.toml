[project]
name = "pcb-plugin-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# pyyaml is a hard runtime dependency — the worker parses/loads the canonical
# board YAML with it, and cold start imports it eagerly.
#
# gerber-writer (Karel Tavernier / Ucamco, the RS-274X/X2 spec's own author) is
# the fabrication-output writer for the `gerbers` method. PINNED to 0.4.3.3, the
# version the validation spike (pcb/spikes/gerber/REPORT.md) validated + goldened
# against — its coordinate-format self-selection makes goldens version-sensitive,
# so pin, don't float. It has no Excellon support; drill files are emitted by
# pcb_worker.gerber directly. Imported lazily (only when `gerbers` is called), so
# a missing install never affects validate/generate/check_*.
#
# agent_router (first-party, vendored under agent_router/) is the standalone PCB
# routing engine behind the `route` method. It is pure-Python and its ONLY
# external dependency is pyyaml (already listed above) — no numpy / no heavy
# native deps — so it adds ~0 to cold start. (It IS imported eagerly, despite
# what this note used to claim: importing pcb_worker.methods pulls in
# agent_router.router via pcb_worker.ir_candidates -> agent_router.layers, which
# executes the agent_router package __init__. Verified against sys.modules, not
# read off the source. It stays cheap because the engine is pure-Python.)
#
# pyclipper (PyPI "pyclipper", import name "pyclipper") is the exact INTEGER
# polygon-boolean kernel behind copper-zone fill (pcb_worker.zone_fill). PINNED
# to 1.4.0. It is a hard dependency rather than an extra because a board with a
# pour cannot be COMPILED without it — the fill is part of the IR, not a
# late-bound emitter concern — and the alternative to having it is refusing to
# fabricate the board.
#
# WHY THIS ONE, measured 2026-08-02 rather than assumed:
#   * INTEGER domain. Its booleans are exact 64-bit integer arithmetic, so a
#     fill computed in nanometres is bit-reproducible by construction rather
#     than by hope. shapely/GEOS was rejected for exactly this: float booleans
#     are not bit-stable across library builds, and testdata/gerber_golden/
#     README.md already flags emitter version-sensitivity as a live hazard.
#   * LICENSE: MIT, read from the installed package metadata (not from
#     recollection). It binds Angus Johnson's Clipper, which is Boost-1.0. Both
#     permissive.
#   * WHEELS for every platform the plugin installs on, verified against the
#     PyPI release files for 1.4.0 / cp312: manylinux_2_17_x86_64,
#     manylinux_2_28_aarch64, macosx_10_13_universal2 (arm64 + x86_64), win32
#     and win_amd64. This was the named falsifier for adding the dep at all — no
#     wheel on a target platform would have meant a source build on a user
#     machine — and it is discharged.
#
# NO FCIB: a pinned PyPI wheel, never a committed binary — the precedent
# recorded in pcb/spikes/cam/DECISION.md:100, and the same treatment the already
# tolerated native dep (rtree, via the dev extra) gets.
dependencies = [
    "pyyaml>=6.0,<7",
    "gerber-writer==0.4.3.3",
    "pyclipper==1.4.0",
    # gerbonara: the independent Gerber + Excellon READER pcb.fab_preview
    # re-parses the emitted bytes with before drawing them — a preview drawn
    # by the library that wrote the file would only show what the writer
    # meant, not what a fab receives. Pure Python. The runtime bundle installs
    # it --no-deps (scripts/runtime-bundle.lock): its declared click/rtree/
    # quart serve only its CLI and web viewer, which nothing here imports.
    "gerbonara==1.6.3",
    # Pillow: the rasteriser behind pcb_worker.texture_bake, which composites one
    # image per board side (substrate, copper, mask, plating, silk) for the 3D
    # export and for anyone who wants to see the board rather than its layers.
    # PINNED to 12.3.0.
    #
    # WHY A NEW DEPENDENCY AT ALL. Nothing shipped rasterises anything: the fab
    # preview emits per-layer VECTOR svg (gerbonara's to_svg) and the assembly
    # preview deliberately omits copper, mask and silk. The alternative — pin an
    # SVG rasteriser and composite the existing per-layer SVGs — was rejected: it
    # adds a native rasteriser AND a second notion of what a layer looks like,
    # where this draws straight from the geometry the Gerbers are emitted from.
    #
    # WHEELS for every platform the bundle builds, verified against the PyPI
    # release files for 12.3.0 / cp312 (not recalled): macosx_10_13_x86_64,
    # macosx_11_0_arm64, manylinux_2_27_x86_64.manylinux_2_28_x86_64,
    # manylinux_2_27_aarch64.manylinux_2_28_aarch64 and win_amd64 — one for each
    # tag set in build-python-runtime-bundle.sh's WHEEL_PLATS. No sdist fallback
    # is needed on any target, which is the condition --only-binary=:all: imposes.
    #
    # LICENSE: MIT-CMU, read from the installed distribution's
    # License-Expression metadata. Permissive.
    "pillow==12.3.0",
]

[project.optional-dependencies]
# circuit_synth (PyPI: "circuit-synth", import name "circuit_synth", v0.12.1
# verified importable on CPython 3.12.4 in ~0.4s) is PINNED but OPTIONAL.
#
# It is not a hard dependency because it cannot do the worker's job without
# KiCad *symbol-library* data on the machine — Component(symbol="Device:R")
# raises LibraryNotFound when KICAD_SYMBOL_DIR is unset — and its generator
# imposes its own auto-placement rather than honouring our authored
# x_mm/y_mm/rotation_deg. validate/generate/check_bom/check_libraries therefore
# run in plain Python over the canonical YAML (see kicad.py / board_model.py and
# docs/worker.md "circuit_synth divergence"). The worker probes its version via
# importlib.metadata (no import) and never blocks on it. Install this extra only
# if a future child wants circuit_synth's netlister/ERC with real KiCad libs.
circuit_synth = [
    "circuit-synth==0.12.1",
]
dev = [
    "pytest>=7.0",
    # pygerber: independent, actively-maintained X3-aware reader used ONLY by the
    # gerber test suite for round-trip parsing of every emitted layer (not a
    # runtime dependency). Pinned to the spike's validated version.
    "pygerber==2.4.3",
    # pygltflib: independent glTF 2.0 READER, used ONLY by
    # tests/oracle/test_gltf_export_oracle.py to load the .glb that
    # pcb_worker.gltf_write produces. Same justification as pygerber and
    # gerbonara above: a file parsed by the library that wrote it proves only
    # that the writer agrees with itself, and the defects that matter in a
    # binary container — a buffer view off by its padding, an accessor whose
    # count outruns its bytes — are exactly the ones a second implementation
    # sees and the first cannot. Pure Python, dev-only, so it is absent from
    # the runtime bundle and the suite skips where it is not installed.
    "pygltflib==1.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcb_worker", "agent_router"]
