# PARITY CORNER-CASE FIXTURE — the geometry smart_remote.yaml does NOT reach.
#
# smart_remote.yaml is the Stage-4 acceptance fixture and stays the primary case,
# but auditing what it actually exercises turned up four gaps that matter to a
# CROSS-SURFACE geometry gate, because each is a place where two surfaces could
# legitimately disagree and nothing would notice:
#
#   1. BOTTOM-SIDE COMPONENTS. Every smart_remote component is on `top`, so the
#      compiler's bottom-side mirror fold and the emitters' side-dependent layer
#      assignment (gerber's `top` flag, kicad's `_smd_tech_layers`) are never
#      compared across surfaces. A mirror applied twice, or not at all, is
#      invisible in smart_remote.
#
#   2. OBLONG (non-square) THROUGH-HOLE LANDS. smart_remote DOES produce shaped TH
#      lands — the pin-1 markers on its PinSocket/DIP footprints — but every one of
#      them is SQUARE (1.7x1.7, 1.6x1.6). A square land's rotation folds away under
#      its own 90-degree symmetry, so smart_remote cannot distinguish a correctly
#      rotated land from a dropped rotation. An oblong land at 90 degrees can.
#
#   3. PLATED BOARD HOLES. smart_remote's four mounting holes are all unplated, so
#      the plated-hole COPPER RING path (gerber._emit_board_hole's annulus flash,
#      kicad._kicad_mounting_hole_component's thru_hole padstack, DRC's
#      board_hole_copper primitive — finding 019f8dbb7104) is never cross-checked.
#
# A FOURTH gap is NOT closed here and is left open deliberately: smart_remote's
# only SMD pads are plain 2x2 rects, so the circle / oval / roundrect SMD aperture
# families gerber._shape_aperture branches on go uncompared. A pad SHAPE is not
# authorable from board YAML — it is owned by the locked footprint, and
# compile_board's inline/override key set (_INLINE_FAB_KEYS, compile_board.py:740)
# carries sizes, drills, annuli and plating but no shape token. Closing it needs a
# purpose-built footprint in the test library, which is a bigger change than this
# fixture. NOTE: non-rect THROUGH-HOLE lands ARE covered, via J1 pin 2 below.
#
# Deliberately MINIMAL: 3 components and 2 holes, no routing beyond one segment
# per layer, because this fixture exists to reach geometry the acceptance fixture
# misses — not to be a second acceptance fixture. Every pad here is authored
# INLINE (drill_mm / pad_width_mm / pad_height_mm / annulus_diameter_mm) so the
# geometry under test is readable in this file rather than hidden in a library
# footprint that a later library update could silently change.
version: 1
name: parity-corners
width_mm: 40
height_mm: 30
layers:
- top
- bottom
design_rules:
  clearance_mm: 0.2
  trace_width_mm: 0.3
  via_diameter_mm: 0.8
  via_drill_mm: 0.4
components:

# GAP 2 — OBLONG through-hole lands on a component rotated 90 degrees. The land is
# 1.2 x 2.4, so its rotation does NOT fold away: a surface that drops the 90
# degrees reports a 2.4 x 1.2 footprint of copper in the wrong direction, and the
# parity gate names it.
- ref: J1
  footprint: Connector_PinSocket_2.54mm:PinSocket_1x04_P2.54mm_Vertical
  value: OBLONG_TH
  x_mm: 8.0
  y_mm: 8.0
  rotation_deg: 90
  layer: top
  pins:
  - number: '1'
    name: OBL_A
    x_mm: 0.0
    y_mm: 0.0
    drill_mm: 0.8
    pad_width_mm: 1.2
    pad_height_mm: 2.4
  # Footprint pad 1 is an AUTHORED rect and pad 2 an AUTHORED oval, so the two
  # oblong overrides below land in DIFFERENT shape families — a shaped rect land
  # and a shaped OVAL (obround) land, both at 90 degrees.
  - number: '2'
    name: OBL_B
    x_mm: 0.0
    y_mm: 2.54
    drill_mm: 0.8
    pad_width_mm: 1.2
    pad_height_mm: 2.4

# GAP 1 — a BOTTOM-side component, itself rotated, with ASYMMETRIC pad placement
# (the pads are not symmetric about the origin) so a missing or doubled mirror
# moves copper rather than cancelling out.
- ref: U2
  footprint: Package_DIP:DIP-6_W7.62mm_Socket
  value: BOTTOM_SIDE
  x_mm: 28.0
  y_mm: 20.0
  rotation_deg: 90
  layer: bottom
  pins:
  - number: '1'
    name: BOT_1
    x_mm: 0.0
    y_mm: 0.0
    drill_mm: 0.8
    annulus_diameter_mm: 1.6
  - number: '2'
    name: BOT_2
    x_mm: 0.0
    y_mm: 2.54
    drill_mm: 0.8
    annulus_diameter_mm: 1.6
  # Pin 4 sits on the FAR row of the DIP, so U2's pads are asymmetric about the
  # component origin: a missing or doubled mirror MOVES copper here instead of
  # cancelling out.
  - number: '4'
    name: BOT_4
    x_mm: 7.62
    y_mm: 5.08
    drill_mm: 0.8
    annulus_diameter_mm: 1.6

# An OBLONG SMD land on a rotated component. smart_remote's SMD pads are all 2x2
# squares whose rotation folds away under their own symmetry; a 2.4 x 1.2 land at
# 90 degrees does not fold, so a dropped SMD rotation is visible here.
- ref: SW9
  footprint: EVP-ASAC1A:SW_EVP-ASAC1A
  value: SMD_OBLONG
  x_mm: 10.0
  y_mm: 22.0
  rotation_deg: 90
  layer: top
  pins:
  - number: A
    name: SMD_A
    x_mm: -3.0
    y_mm: 0.0
    pad_width_mm: 2.4
    pad_height_mm: 1.2
  - number: B
    name: SMD_B
    x_mm: 3.0
    y_mm: 0.0
    pad_width_mm: 2.4
    pad_height_mm: 1.2

nets:
- name: N_OBL
  pins:
  - J1.1
  - SW9.A
- name: N_BOT
  pins:
  - U2.1
  - SW9.B

traces:
- net: N_OBL
  layer: top
  width_mm: 0.3
  points:
  - x_mm: 8.0
    y_mm: 8.0
  - x_mm: 7.0
    y_mm: 22.0
- net: N_BOT
  layer: bottom
  width_mm: 0.3
  points:
  - x_mm: 28.0
    y_mm: 20.0
  - x_mm: 20.0
    y_mm: 20.0

vias:
- x_mm: 20.0
  y_mm: 20.0
  drill_mm: 0.4
  diameter_mm: 0.8
  net: N_BOT
  from_layer: top
  to_layer: bottom

# GAP 3 — one PLATED board hole (copper ring, authored annulus) alongside one
# unplated one, so the PTH/NPTH drill split and the plated-hole copper ring are
# both cross-checked.
pth_holes:
- x_mm: 4.0
  y_mm: 26.0
  diameter_mm: 1.0
  annulus_mm: 2.2
mounting_holes:
- x_mm: 36.0
  y_mm: 26.0
  diameter_mm: 3.2
  plated: false
