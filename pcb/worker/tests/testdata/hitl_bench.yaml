# ===========================================================================
# R13 indeterminate, made visible                                          [I]
#
# MECHANISM: a pour whose fill CANNOT be computed is not "no copper" — nothing
# was measured. Its net keeps an INDETERMINATE row, and that row must name the
# reason so the reader is told what to fix.
#
# WHAT IS SHIPPED IS FILLABLE, ON PURPOSE. See the header: one refused pour
# fails the whole compile, and zone_copper then has NO fill for ANY pour on the
# board — R3's and R4's answers would go dark with it. So Z13 ships clean and
# the FAULT IS THE GESTURE.
#
# R13 start: Z13 fills to ONE region, 112.0000 mm^2. Net R13_G has one pin, so
#            this row is about the FILL and not about connectivity.
# THE GESTURE: give Z13 a thermal relief the v1 filler cannot honour — add BOTH
#              `thermal_gap_mm: 0.3` and `thermal_bridge_width_mm: 0.3` to the
#              zone below. (Authoring only ONE of them refuses earlier and for a
#              different reason: "the missing half would have to be invented".)
#   R13 after: the compile is refused, naming THIS zone by id and saying v1 fill
#              implements SOLID connect only. Nothing on the board fills, so
#              drc's census turns the one net whose verdict DEPENDED on a pour
#              — R3_G — into an `indeterminate` row: reason "zone_copper", with
#              `detail` quoting the refusal verbatim. That is the lead: it names
#              the zone rather than saying "something is unknown".
#   R13 clear: remove both fields and the lead clears on the next check.
# ===========================================================================
- ref: TP13
  footprint: TH_TestPoint
  x_mm: 27.0
  y_mm: 152.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

# ===========================================================================
# R14 ids survive a reload                                             [blend]
#
# MECHANISM: an id that is not minted in the contract shape (`trace:<32 hex>`)
# is replaced by a fresh random token on EVERY load, because MigrateV1toV2 reads
# an ordinal handle as unminted. The three ids below ARE minted, so they are the
# same strings after a round trip and a caller can hold them across one.
#
#   trace 14000000000000000000000000000001  top,    (16,164) -> (22,164)
#   via   14000000000000000000000000000002  at (22,164), top<->bottom
#   trace 14000000000000000000000000000003  bottom, (22,164) -> (28,164)
#
# R14 A: note the via id, export_yaml, load_board {path}, then delete_traces with
#        the OLD trace id — it still resolves. Net R14_A is COMPLETE before the
#        delete (1 pin group, dangling = 0) and PARTIAL after.
#        These three are the ONLY authored ids on the board; everything else is
#        v1 and gets its id minted on load. Read them off the board document or
#        off list_vias — the Python COMPILE re-derives ordinal ids for its own
#        IR on a v1 board (the `ordinal_ids` INFO), so an id quoted out of a
#        compile diagnostic is not the one being tracked here.
# R14 B: hand-corrupt the routing sidecar's committed id claim; restoring warns
#        about the dangling claim and leaves the copper untouched.
# ===========================================================================
- ref: TP14A
  footprint: TH_TestPoint
  x_mm: 16.0
  y_mm: 164.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: TP14B
  footprint: TH_TestPoint
  x_mm: 28.0
  y_mm: 164.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

# ===========================================================================
# R15 layered route hint                                               [blend]
#
# MECHANISM: two pads 42 mm apart with a top-layer keepout standing between
# them. Nothing can be routed across K15 on top, so a hint that hops to the
# bottom layer is the only way through — and the hop must MINT VIAS sized from
# design_rules (0.8 / 0.4), not from a hard-coded default.
#
# R15 start: net R15_A has ZERO copper — it appears under `missing_copper`.
# THE GESTURE: add a route hint from TP15A to TP15B with ONE waypoint on the
#              bottom layer, inside x 34..38.
#   R15 after: EXACTLY ONE via at the hop (a bottom waypoint between two top
#              spans is one layer change, not two), diameter 0.8, drill 0.4.
#              propose_via for_hint lists that via UNDER the hint; a bare
#              propose_via elsewhere shows as unowned.
# ===========================================================================
- ref: TP15A
  footprint: TH_TestPoint
  x_mm: 15.0
  y_mm: 176.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: TP15B
  footprint: TH_TestPoint
  x_mm: 57.0
  y_mm: 176.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

# ===========================================================================
# R16 width provenance                                                     [P]
#
# MECHANISM: a route on a net that ALREADY has copper inherits that copper's
# width, and says where the number came from. The board's design_rules say
# 0.25 mm; the one trace here is 0.4 mm, so the two answers are distinguishable.
#
# R16 A: net R16_A is PARTIAL with pin_groups = 3 — {TP16A + TP16B, joined by
#        the 0.4 mm trace}, {TP16C}, {TP16D}. dangling = 0.
#        Route TP16C to TP16D on R16_A: the candidate width is 0.40, and its
#        source is `net_copper` — NOT `design_rules` (which would say 0.25).
# ===========================================================================
- ref: TP16A
  footprint: TH_TestPoint
  x_mm: 15.0
  y_mm: 188.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: TP16B
  footprint: TH_TestPoint
  x_mm: 21.0
  y_mm: 188.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: TP16C
  footprint: TH_TestPoint
  x_mm: 30.0
  y_mm: 188.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: TP16D
  footprint: TH_TestPoint
  x_mm: 36.0
  y_mm: 188.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

# ===========================================================================
# R17 view fit          [I]   no geometry — the label IS the row
# R18 fab preview       [I]   no geometry
# R19 status timer      [I]   no geometry
# R20 annotation dock   [I]   no geometry
#
# These four are about the SHELL, not the copper, so putting entities in them
# would only give the reader something irrelevant to stare at. The rows exist
# because the silk label exists, which is enough to point at.
#
# R17 A: with the panel docked narrow, set_view fit:true shows the WHOLE board —
#        60 x 250 is deliberately extreme, so a fit that only fits one axis is
#        obvious at a glance.
# R17 B: the Home key centres on the board.
# R18 A: View > Fab preview renders. This board is well over the 64 KiB IPC cap,
#        so the render must ride the snapshot-by-reference path, not the pipe.
# R18 B: the preview's contrast is readable.
# R19 A: two refused clicks less than 2 s apart — the second message must still
#        stand for its full 2 s.
# R19 B: a held lead survives a transient status message.
# R20 A: three long annotations at ~554 px — the dock opens at about 1/3 height,
#        cannot be dragged past 50%, and re-clamps on resize.
# R20 B: every row's controls are reachable, nothing scrolls sideways at
#        1200 px, and the chevron closes the dock.
# ===========================================================================

nets:

# R1 — A joins, B stops 1.0 mm short.
- name: R1_A
  pins: [TP1A.1, J1A.1]
- name: R1_B
  pins: [TP1B.1, J1B.1]

# R2 — A's run passes through TP2M; B reaches the QFN's exposed pad.
- name: R2_A
  pins: [TP2A.1, TP2M.1, TP2B.1]
- name: R2_B
  pins: [U2B.17, TP2C.1]

# R3 — TP3B is inside the pour, TP3A is not. The pour is the second island.
- name: R3_G
  pins: [TP3A.1, TP3B.1]

# R4 — R4_A is the foreign net beside the pour; R4_G owns the filled pour;
#      R4_B owns the pour the keepout empties.
- name: R4_A
  pins: [TP4A.1]
- name: R4_G
  pins: [TP4G.1]
- name: R4_B
  pins: [TP4B.1]

# R5 — MH5.1 is on the net and can never join it (np_thru_hole, no barrel).
- name: R5_A
  pins: [TP5T.1, TP5B.1, MH5.1]
- name: R5_B
  pins: [TP5C.1]

# R6 — three one-pin nets, nothing routed. Swap/move is the only thing that
#      can change these lists.
- name: R6_A
  pins: [TP6A.1]
- name: R6_B
  pins: [TP6B.1]
- name: R6_C
  pins: [TP6C.1]

# R7 — the EAST column is netted so the whole WEST column stays free for the
#      free_pins side filter.
- name: R7_A
  pins: [J7.4]
- name: R7_B
  pins: [J7.5]

# R8 — one net per part, so a pad row can be asked for by net name.
- name: R8_A
  pins: [R8A.1]
- name: R8_B
  pins: [R8B.1]

# R9 — each land plus the test point that probes it.
- name: R9_A
  pins: [TP9A.1, U9A.1]
- name: R9_B
  pins: [TP9B.1, U9B.1]

# R12 — U12A's two inline lands, one net each (a single net across both would
#       short the part it stands in for).
- name: R12_A
  pins: [U12A.1]
- name: R12_B
  pins: [U12A.2]

# R13 — the pour's net. One pin: this row is about the FILL, not connectivity.
- name: R13_G
  pins: [TP13.1]

# R14 — the net whose trace and via ids are held across a reload.
- name: R14_A
  pins: [TP14A.1, TP14B.1]

# R15 — unrouted on purpose: this is the net the hint has to solve.
- name: R15_A
  pins: [TP15A.1, TP15B.1]

# R16 — four pins, one 0.4 mm trace, two pads still owed.
- name: R16_A
  pins: [TP16A.1, TP16B.1, TP16C.1, TP16D.1]

traces:

# R1 A — 1.0 mm wide, ending at (18.5, 5.0): +0.25/+0.25 off J1A.1's centre,
#        0.354 mm from it, inside the land's inner core. JOINED.
- net: R1_A
  layer: top
  width_mm: 1.0
  points:
  - {x_mm: 14.0, y_mm: 5.0}
  - {x_mm: 18.5, y_mm: 5.0}

# R1 B — the same run stopped short. End cap leading edge x = 40.6; J1B.1's
#        left copper edge x = 41.6. Gap 1.0 mm. DANGLING at (40.475, 4.75).
- net: R1_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 38.0, y_mm: 4.75}
  - {x_mm: 40.475, y_mm: 4.75}

# R2 A — driven straight THROUGH TP2M's land without ending on it.
- net: R2_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 14.0, y_mm: 20.0}
  - {x_mm: 30.0, y_mm: 20.0}

# R2 B bottom — comes in under the package to the via-in-pad.
- net: R2_B
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 52.0, y_mm: 19.75}
  - {x_mm: 45.75, y_mm: 20.25}

# R2 B top — the 0.25 mm stub, from the via to a point 0.5/-0.25 off the
#            exposed pad's centre. Both ends land on copper.
- net: R2_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 45.75, y_mm: 20.25}
  - {x_mm: 46.5, y_mm: 19.75}

# R5 A top — stops 2.1 mm from MH5's centre, which is 0.5 mm clear of the
#            3.2 mm bore. DANGLING, because there is no copper on an NPTH.
- net: R5_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 17.0, y_mm: 56.0}
  - {x_mm: 22.9, y_mm: 56.0}

# R5 A bottom — the mirror of it on the other side of the hole. Also DANGLING.
- net: R5_A
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 33.0, y_mm: 56.0}
  - {x_mm: 27.1, y_mm: 56.0}

# R5 B — feeds V5 from the top and stops. Nothing on the bottom, which is what
#        makes the via's layers_touched a one-element list.
- net: R5_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 40.0, y_mm: 56.0}
  - {x_mm: 46.0, y_mm: 56.0}

# R9 A — ends 0.2 mm inside the TALL (rotated) land, 0.5 mm outside the same
#        land unrotated.
- net: R9_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 17.0, y_mm: 104.8}
  - {x_mm: 22.0, y_mm: 104.8}

# R9 B — approaches the roundrect's south-east corner diagonally from outside
#        and stops 0.0757 mm inside the true copper. The bounding box says
#        "inside" 0.2 mm earlier; the rounded corner is the whole difference.
- net: R9_B
  layer: top
  width_mm: 0.05
  points:
  - {x_mm: 48.5, y_mm: 106.5}
  - {x_mm: 46.8, y_mm: 104.8}

# R14 — minted ids, held by hand across export_yaml -> load_board.
- id: trace:14000000000000000000000000000001
  net: R14_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 16.0, y_mm: 164.0}
  - {x_mm: 22.0, y_mm: 164.0}
- id: trace:14000000000000000000000000000003
  net: R14_A
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 22.0, y_mm: 164.0}
  - {x_mm: 28.0, y_mm: 164.0}

# R16 — the ESTABLISHED copper. 0.4 mm, deliberately unequal to the board's
#       0.25 mm design rule, so a route's reported width names its source.
- net: R16_A
  layer: top
  width_mm: 0.4
  points:
  - {x_mm: 15.0, y_mm: 188.0}
  - {x_mm: 21.0, y_mm: 188.0}

vias:

# R2 B — via-in-pad under the exposed land. Same net as the pad it sits in.
- {x_mm: 45.75, y_mm: 20.25, drill_mm: 0.4, diameter_mm: 0.8, net: R2_B,
   from_layer: top, to_layer: bottom}

# R5 B — the dead via: spanned top..bottom, fed on top only.
- {x_mm: 46.0, y_mm: 56.0, drill_mm: 0.4, diameter_mm: 0.8, net: R5_B,
   from_layer: top, to_layer: bottom}

# R14 — minted id, the one the human notes before the reload.
- {id: "via:14000000000000000000000000000002",
   x_mm: 22.0, y_mm: 164.0, drill_mm: 0.4, diameter_mm: 0.8, net: R14_A,
   from_layer: top, to_layer: bottom}

zones:

# R3 — the pour TP3B is already inside. Fills to ONE region.
- net: R3_G
  layer: top
  clearance_mm: 0.2
  outline:
  - {x_mm: 21.0, y_mm: 28.0}
  - {x_mm: 34.0, y_mm: 28.0}
  - {x_mm: 34.0, y_mm: 36.0}
  - {x_mm: 21.0, y_mm: 36.0}

# R4 A — the FOREIGN pour. TP4A (net R4_A) stands 4.2 mm west of it.
- net: R4_G
  layer: top
  clearance_mm: 0.2
  outline:
  - {x_mm: 20.0, y_mm: 40.0}
  - {x_mm: 34.0, y_mm: 40.0}
  - {x_mm: 34.0, y_mm: 48.0}
  - {x_mm: 20.0, y_mm: 48.0}

# R4 B — a real pour whose fill comes back EMPTY, because K4 below covers it
#        completely. Expect `fill: []` from zone_fill and a zone_fill_empty
#        warning from the compile. NOT the same thing as an uncomputed fill.
- net: R4_B
  layer: top
  clearance_mm: 0.2
  outline:
  - {x_mm: 40.0, y_mm: 40.0}
  - {x_mm: 54.0, y_mm: 40.0}
  - {x_mm: 54.0, y_mm: 48.0}
  - {x_mm: 40.0, y_mm: 48.0}

# R4 B — the keepout that empties it. Netless: it applies to all copper.
- kind: keepout
  layer: top
  outline:
  - {x_mm: 39.5, y_mm: 39.5}
  - {x_mm: 54.5, y_mm: 39.5}
  - {x_mm: 54.5, y_mm: 48.5}
  - {x_mm: 39.5, y_mm: 48.5}

# R13 — SHIPPED FILLABLE. Add `thermal_gap_mm: 0.3` here to make the filler
#       refuse it; remove it to clear the lead. See the R13 block above for why
#       the fault is a gesture and not the shipped state.
- net: R13_G
  layer: top
  clearance_mm: 0.2
  outline:
  - {x_mm: 20.0, y_mm: 148.0}
  - {x_mm: 34.0, y_mm: 148.0}
  - {x_mm: 34.0, y_mm: 156.0}
  - {x_mm: 20.0, y_mm: 156.0}

# R15 — the obstacle. A top-layer keepout the router cannot cross, so the only
#       way from TP15A to TP15B is a hop to the bottom layer and back.
- kind: keepout
  layer: top
  outline:
  - {x_mm: 34.0, y_mm: 171.0}
  - {x_mm: 38.0, y_mm: 171.0}
  - {x_mm: 38.0, y_mm: 181.0}
  - {x_mm: 34.0, y_mm: 181.0}

# ===========================================================================
# THE ROW LABELS.
#
# One F.SilkS text per row, anchored in the left 10 mm at cap height 0.7 mm, on
# the row's own centre line. They are BOARD graphics, not component silk: a
# label that belonged to a part would move when somebody moved the part, and the
# table would stop being a table.
# ===========================================================================
