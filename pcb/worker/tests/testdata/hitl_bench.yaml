# ===========================================================================
# R22 add a part by library ref                                            [I]
#
# MECHANISM: a part added by a LIBRARY REF ("LibNick:PartName") gets the
# library's own lands, silk and courtyard and is fabricable the moment it
# lands. A part added as a generic ENUM gets estimated defaults with no
# library behind them — a SKETCH — and the hermetic worker refuses it by name,
# which takes the whole board's geometric DRC and EVERY pour fill with it.
# The two adds must not look alike, and neither may be silent about which it
# was.
#
# WHAT IS SHIPPED: TP22A and a 6 mm top stub that stops in mid-air at
# (22.0, 260.0) — the exact point pin 1 of the part in R22 A lands on. That
# stub is DANGLING on purpose; closing it is what the gesture does.
#
# R22 A: add `Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical` at
#        (22.0, 260.0) BY REF, connect its pin 1 to net R22_A, and re-check.
#        The footprint's pad 1 is a 1.8 x 1.8 thru-hole land at its own local
#        origin, so it lands dead on the stub's end; pad 2 sits 2.54 mm south
#        of it, on nothing.
#        Expected: the add reply's geometry block reads fabricable true,
#        source "library", pad_count 2; net R22_A is COMPLETE with 1 pin
#        group; the stub's dangling finding is GONE; and the geometric DRC
#        gains no finding it did not already have.
# R22 B: add a generic `HEADER` at (46.0, 260.0) — no colon, no library.
#        Expected: the add reply's geometry block reads fabricable FALSE,
#        source "sketch", and carries the note naming the way out; the canvas
#        wears the unresolved badge; the panel's status lead names the part;
#        and every pour on the board STOPS FILLING, with the fill refusal
#        naming the offending component by ref.
#        THIS IS A GESTURE AND NOT A SHIPPED STATE, for the same reason R13's
#        fault is one: while that part is on the board NOTHING fills, so R3's
#        and R21's answers go dark with it. Delete it — or one Undo — to clear.
# ===========================================================================
- ref: TP22A
  footprint: TH_TestPoint
  x_mm: 16.0
  y_mm: 260.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

# ===========================================================================
# R23 a part on the back                                                   [P]
#
# MECHANISM: a part placed on the BACK has its footprint-local geometry
# mirrored about the local Y axis and its layers flipped, so an F.Cu land
# becomes a B.Cu one and a land authored NORTH of the part origin is placed
# SOUTH of it. Both parts below are the same footprint and both are
# `layer: bottom`; the only difference is which side the copper reaching them
# is on, which is what makes the pair decide one thing.
#
# R23 A: BS23A's pad 1 is authored at local (0.0, -2.0) — north of the origin —
#        so it lands on B.Cu at (22.0, 274.0), SOUTH of it. The 0.25 mm BOTTOM
#        run from TP23A ends on that land's centre.
#        Expected: the pad row reports the land on B.Cu at (22.0, 274.0); net
#        R23_A COMPLETE, 1 pin group, dangling = 0.
#        FALSIFIER: read that land unmirrored and unflipped — F.Cu at
#        (22.0, 270.0), where its front-side twin would sit — and the run's end
#        reports `dangling_endpoint at (22.0, 274.0)` instead.
# R23 B: the SAME footprint on the SAME side, reached by a run on the TOP
#        layer. Copper on the other side of the laminate joins nothing without
#        a via, however exactly it lines up in plan.
#        Expected: `dangling_endpoint at (46.0, 274.0)`, R23_B partial with
#        2 pin groups. A land that reads as top-side passes this cell by
#        accident, which is why A and B are both here.
# ===========================================================================
- ref: BS23A
  footprint: Bench_BottomLand_2P
  value: BACK-LAND
  x_mm: 22.0
  y_mm: 272.0
  rotation_deg: 0
  layer: bottom
  pads:
  - number: "1"
    type: smd
    shape: rect
    position: {x: 0.0, y: -2.0}
    size: {width: 1.6, height: 1.0}
    layers: [F.Cu, F.Mask, F.Paste]
  - number: "2"
    type: smd
    shape: rect
    position: {x: 0.0, y: 2.0}
    size: {width: 1.6, height: 1.0}
    layers: [F.Cu, F.Mask, F.Paste]
  pins:
  - {number: "1", x_mm: 0.0, y_mm: -2.0}
  - {number: "2", x_mm: 0.0, y_mm: 2.0}
  # Authored on F.SilkS; the back-side placement flips it to B.SilkS and
  # mirrors it, which is the same transform the lands go through.
  graphics:
  - {layer: F.SilkS, kind: line, start: [-1.1, -2.8], end: [1.1, -2.8], width: 0.12}
  - {layer: F.SilkS, kind: line, start: [-1.1, 2.8], end: [1.1, 2.8], width: 0.12}
- ref: TP23A
  footprint: TH_TestPoint
  x_mm: 16.0
  y_mm: 274.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: BS23B
  footprint: Bench_BottomLand_2P
  value: BACK-LAND
  x_mm: 46.0
  y_mm: 272.0
  rotation_deg: 0
  layer: bottom
  pads:
  - number: "1"
    type: smd
    shape: rect
    position: {x: 0.0, y: -2.0}
    size: {width: 1.6, height: 1.0}
    layers: [F.Cu, F.Mask, F.Paste]
  - number: "2"
    type: smd
    shape: rect
    position: {x: 0.0, y: 2.0}
    size: {width: 1.6, height: 1.0}
    layers: [F.Cu, F.Mask, F.Paste]
  pins:
  - {number: "1", x_mm: 0.0, y_mm: -2.0}
  - {number: "2", x_mm: 0.0, y_mm: 2.0}
  # Authored on F.SilkS; the back-side placement flips it to B.SilkS and
  # mirrors it, which is the same transform the lands go through.
  graphics:
  - {layer: F.SilkS, kind: line, start: [-1.1, -2.8], end: [1.1, -2.8], width: 0.12}
  - {layer: F.SilkS, kind: line, start: [-1.1, 2.8], end: [1.1, 2.8], width: 0.12}
- ref: TP23B
  footprint: TH_TestPoint
  x_mm: 40.0
  y_mm: 274.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}

nets:

# R1 — A joins, B stops 1.0 mm short.
- name: R1_A
  pins: [TP1A.1, J1A.1]
- name: R1_B
  pins: [TP1B.1, J1B.1]

# R2 — A's run passes through TP2M; B reaches the QFN's exposed pad.
- name: R2_A
  pins: [TP2A.1, TP2M.1, TP2B.1]
- name: R2_B
  pins: [U2B.17, TP2C.1]

# R3 — TP3B is inside the pour, TP3A is not. The pour is the second island.
- name: R3_G
  pins: [TP3A.1, TP3B.1]

# R4 — R4_A is the span the router has to deliver; R4_N is the net whose only
#      member is a hole nothing can be routed to.
- name: R4_A
  pins: [TP4A.1, TP4B.1]
- name: R4_N
  pins: [MH4.1]

# R5 — MH5.1 is on the net and can never join it (np_thru_hole, no barrel).
- name: R5_A
  pins: [TP5T.1, TP5B.1, MH5.1]
- name: R5_B
  pins: [TP5C.1]

# R6 — three one-pin nets, nothing routed. Swap/move is the only thing that
#      can change these lists.
- name: R6_A
  pins: [TP6A.1]
- name: R6_B
  pins: [TP6B.1]
- name: R6_C
  pins: [TP6C.1]

# R7 — the EAST column is netted so the whole WEST column stays free for the
#      free_pins side filter.
- name: R7_A
  pins: [J7.4]
- name: R7_B
  pins: [J7.5]

# R8 — one net per part, so a pad row can be asked for by net name.
- name: R8_A
  pins: [R8A.1]
- name: R8_B
  pins: [R8B.1]

# R9 — each land plus the test point that probes it.
- name: R9_A
  pins: [TP9A.1, U9A.1]
- name: R9_B
  pins: [TP9B.1, U9B.1]

# R12 — U12A's two inline lands, one net each (a single net across both would
#       short the part it stands in for).
- name: R12_A
  pins: [U12A.1]
- name: R12_B
  pins: [U12A.2]

# R13 — the pour's net. One pin: this row is about the FILL, not connectivity.
- name: R13_G
  pins: [TP13.1]

# R14 — the net whose trace and via ids are held across a reload.
- name: R14_A
  pins: [TP14A.1, TP14B.1]

# R15 — unrouted on purpose: this is the net the hint has to solve.
- name: R15_A
  pins: [TP15A.1, TP15B.1]

# R16 — four pins, one 0.4 mm trace, two pads still owed.
- name: R16_A
  pins: [TP16A.1, TP16B.1, TP16C.1, TP16D.1]

# R21 — probe pair plus the land standing in the back pour. The via is the
#       only thing that can put all three in one group.
- name: R21_A
  pins: [U21A.1, U21A.2, TP21C.1]
- name: R21_B
  pins: [U21B.1, U21B.2, TP21D.1]

# R22 — one pin and a stub, until the by-ref add lands pin 1 on the stub's end.
- name: R22_A
  pins: [TP22A.1]

# R23 — one net per side of the laminate, both reaching the SAME land geometry
#       on a bottom-mounted part.
- name: R23_A
  pins: [TP23A.1, BS23A.1]
- name: R23_B
  pins: [TP23B.1, BS23B.1]

traces:

# R1 A — 1.0 mm wide, ending at (18.5, 5.0): +0.25/+0.25 off J1A.1's centre,
#        0.354 mm from it, inside the land's inner core. JOINED.
- net: R1_A
  layer: top
  width_mm: 1.0
  points:
  - {x_mm: 14.0, y_mm: 5.0}
  - {x_mm: 18.5, y_mm: 5.0}

# R1 B — the same run stopped short. End cap leading edge x = 40.6; J1B.1's
#        left copper edge x = 41.6. Gap 1.0 mm. DANGLING at (40.475, 4.75).
- net: R1_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 38.0, y_mm: 4.75}
  - {x_mm: 40.475, y_mm: 4.75}

# R2 A — driven straight THROUGH TP2M's land without ending on it.
- net: R2_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 14.0, y_mm: 20.0}
  - {x_mm: 30.0, y_mm: 20.0}

# R2 B bottom — comes in under the package to the via-in-pad.
- net: R2_B
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 52.0, y_mm: 19.75}
  - {x_mm: 45.75, y_mm: 20.25}

# R2 B top — the 0.25 mm stub, from the via to a point 0.5/-0.25 off the
#            exposed pad's centre. Both ends land on copper.
- net: R2_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 45.75, y_mm: 20.25}
  - {x_mm: 46.5, y_mm: 19.75}

# R5 A top — stops 2.1 mm from MH5's centre, which is 0.5 mm clear of the
#            3.2 mm bore. DANGLING, because there is no copper on an NPTH.
- net: R5_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 17.0, y_mm: 56.0}
  - {x_mm: 22.9, y_mm: 56.0}

# R5 A bottom — the mirror of it on the other side of the hole. Also DANGLING.
- net: R5_A
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 33.0, y_mm: 56.0}
  - {x_mm: 27.1, y_mm: 56.0}

# R5 B — feeds V5 from the top and stops. Nothing on the bottom, which is what
#        makes the via's layers_touched a one-element list.
- net: R5_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 40.0, y_mm: 56.0}
  - {x_mm: 46.0, y_mm: 56.0}

# R9 A — ends 0.2 mm inside the TALL (rotated) land, 0.5 mm outside the same
#        land unrotated.
- net: R9_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 17.0, y_mm: 104.8}
  - {x_mm: 22.0, y_mm: 104.8}

# R9 B — approaches the roundrect's south-east corner diagonally from outside
#        and stops 0.0757 mm inside the true copper. The bounding box says
#        "inside" 0.2 mm earlier; the rounded corner is the whole difference.
- net: R9_B
  layer: top
  width_mm: 0.05
  points:
  - {x_mm: 48.5, y_mm: 106.5}
  - {x_mm: 46.8, y_mm: 104.8}

# R14 — minted ids, held by hand across export_yaml -> load_board.
- id: trace:14000000000000000000000000000001
  net: R14_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 16.0, y_mm: 164.0}
  - {x_mm: 22.0, y_mm: 164.0}
- id: trace:14000000000000000000000000000003
  net: R14_A
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 22.0, y_mm: 164.0}
  - {x_mm: 28.0, y_mm: 164.0}

# R16 — the ESTABLISHED copper. 0.4 mm, deliberately unequal to the board's
#       0.25 mm design rule, so a route's reported width names its source.
- net: R16_A
  layer: top
  width_mm: 0.4
  points:
  - {x_mm: 15.0, y_mm: 188.0}
  - {x_mm: 21.0, y_mm: 188.0}

# R21 A — pad centre to pad centre, 0.5 mm wide. Its MIDPOINT is where the via
#         sits, so no endpoint rule is in play on either side.
- net: R21_A
  layer: top
  width_mm: 0.5
  points:
  - {x_mm: 20.6, y_mm: 248.0}
  - {x_mm: 23.4, y_mm: 248.0}

# R21 B — the identical run. Only the via beside it differs.
- net: R21_B
  layer: top
  width_mm: 0.5
  points:
  - {x_mm: 44.6, y_mm: 248.0}
  - {x_mm: 47.4, y_mm: 248.0}

# R22 — the stub that stops in mid-air at the point pin 1 of the by-ref part
#       will occupy. DANGLING until the gesture lands the part on it.
- net: R22_A
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 16.0, y_mm: 260.0}
  - {x_mm: 22.0, y_mm: 260.0}

# R23 A — on the BACK, ending on the centre of a back-mounted part's land.
- net: R23_A
  layer: bottom
  width_mm: 0.25
  points:
  - {x_mm: 16.0, y_mm: 274.0}
  - {x_mm: 22.0, y_mm: 274.0}

# R23 B — the same approach on the FRONT, to a land that is not on the front.
- net: R23_B
  layer: top
  width_mm: 0.25
  points:
  - {x_mm: 40.0, y_mm: 274.0}
  - {x_mm: 46.0, y_mm: 274.0}

vias:

# R2 B — via-in-pad under the exposed land. Same net as the pad it sits in.
- {x_mm: 45.75, y_mm: 20.25, drill_mm: 0.4, diameter_mm: 0.8, net: R2_B,
   from_layer: top, to_layer: bottom}

# R5 B — the dead via: spanned top..bottom, fed on top only.
- {x_mm: 46.0, y_mm: 56.0, drill_mm: 0.4, diameter_mm: 0.8, net: R5_B,
   from_layer: top, to_layer: bottom}

# R14 — minted id, the one the human notes before the reload.
- {id: "via:14000000000000000000000000000002",
   x_mm: 22.0, y_mm: 164.0, drill_mm: 0.4, diameter_mm: 0.8, net: R14_A,
   from_layer: top, to_layer: bottom}

# R21 A — ON the run's interior, at its exact midpoint, and inside the pour.
- {x_mm: 22.0, y_mm: 248.0, drill_mm: 0.4, diameter_mm: 0.8, net: R21_A,
   from_layer: top, to_layer: bottom}

# R21 B — BESIDE the run, 1.0 mm off its centreline. Copper reaches 0.65 mm,
#         so 0.35 mm of laminate is left and the two never meet.
- {x_mm: 46.0, y_mm: 249.0, drill_mm: 0.4, diameter_mm: 0.8, net: R21_B,
   from_layer: top, to_layer: bottom}

zones:

# R3 — the pour TP3B is already inside, on the BACK where a ground plane lives.
#      Fills to ONE region. Both test points are through-hole lands, so they
#      stand in the fill from either side; only the RUN has a side to get wrong.
- net: R3_G
  layer: bottom
  clearance_mm: 0.2
  outline:
  - {x_mm: 21.0, y_mm: 28.0}
  - {x_mm: 34.0, y_mm: 28.0}
  - {x_mm: 34.0, y_mm: 36.0}
  - {x_mm: 21.0, y_mm: 36.0}

# R13 — SHIPPED FILLABLE. Add `thermal_gap_mm: 0.3` here to make the filler
#       refuse it; remove it to clear the lead. See the R13 block above for why
#       the fault is a gesture and not the shipped state.
- net: R13_G
  layer: top
  clearance_mm: 0.2
  outline:
  - {x_mm: 20.0, y_mm: 148.0}
  - {x_mm: 34.0, y_mm: 148.0}
  - {x_mm: 34.0, y_mm: 156.0}
  - {x_mm: 20.0, y_mm: 156.0}

# R15 — the obstacle. A top-layer keepout the router cannot cross, so the only
#       way from TP15A to TP15B is a hop to the bottom layer and back.
- kind: keepout
  layer: top
  outline:
  - {x_mm: 34.0, y_mm: 171.0}
  - {x_mm: 38.0, y_mm: 171.0}
  - {x_mm: 38.0, y_mm: 181.0}
  - {x_mm: 34.0, y_mm: 181.0}

# R21 A — the plane the via drops into. On the BACK, so the front run reaches
#         it through the via barrel and through nothing else.
- net: R21_A
  layer: bottom
  clearance_mm: 0.2
  outline:
  - {x_mm: 19.0, y_mm: 244.5}
  - {x_mm: 29.0, y_mm: 244.5}
  - {x_mm: 29.0, y_mm: 251.5}
  - {x_mm: 19.0, y_mm: 251.5}

# R21 B — its twin, for the via that misses the run.
- net: R21_B
  layer: bottom
  clearance_mm: 0.2
  outline:
  - {x_mm: 43.0, y_mm: 244.5}
  - {x_mm: 53.0, y_mm: 244.5}
  - {x_mm: 53.0, y_mm: 251.5}
  - {x_mm: 43.0, y_mm: 251.5}

# ===========================================================================
# THE ROW LABELS.
#
# One F.SilkS text per row, anchored in the left 10 mm at cap height 0.7 mm, on
# the row's own centre line. They are BOARD graphics, not component silk: a
# label that belonged to a part would move when somebody moved the part, and the
# table would stop being a table.
# ===========================================================================
