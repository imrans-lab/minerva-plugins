# ===========================================================================
# R17 view fit          [I]   no geometry — the label IS the row
# R18 fab preview       [I]   no geometry
# R19 status timer      [I]   no geometry
# R20 annotation dock   [I]   no geometry
#
# These four are about the SHELL, not the copper, so putting entities in them
# would only give the reader something irrelevant to stare at. The rows exist
# because the silk label exists, which is enough to point at.
#
# R17 A: with the panel docked narrow, set_view fit:true shows the WHOLE board —
#        60 x 250 is deliberately extreme, so a fit that only fits one axis is
#        obvious at a glance.
# R17 B: the Home key centres on the board.
# R18 A: View > Fab preview renders. This board is well over the 64 KiB IPC cap,
#        so the render must ride the snapshot-by-reference path, not the pipe.
# R18 B: the preview's contrast is readable.
# R19 A: two refused clicks less than 2 s apart — the second message must still
#        stand for its full 2 s.
# R19 B: a held lead survives a transient status message.
# R20 A: three long annotations at ~554 px — the dock opens at about 1/3 height,
#        cannot be dragged past 50%, and re-clamps on resize.
# R20 B: every row's controls are reachable, nothing scrolls sideways at
#        1200 px, and the chevron closes the dock.
# ===========================================================================

# ===========================================================================
# R21 via credit                                                           [P]
#
# MECHANISM: a via is COPPER WITH EXTENT, and it joins whatever its barrel
# touches — including a run it sits in the MIDDLE of. Strapping a probe pad to
# the plane beneath it with one via dropped on the run's interior is the
# ordinary way that is done, and a credit that only looked at a run's two ENDS
# scored it as no join at all.
#
# Both cells are the same experiment twice, and only the via moves. The lands
# are authored inline so they are SMD copper on the FRONT only: a through-hole
# land would stand in the pour by itself and the via would decide nothing.
#
# R21 A: U21A's two lands are joined to each other by a 0.5 mm top run between
#        their centres, and to nothing else on the front. The via at
#        (22.0, 248.0) is that run's exact MIDPOINT — 1.4 mm from either end —
#        and drops into the R21_A pour on the BACK, where TP21C stands.
#        Expected: net R21_A COMPLETE, pin_groups = 1, dangling = 0.
#        FALSIFIER: delete that one via and the probe pair is its own island —
#        R21_A partial, pin_groups = 2. A credit that says yes to everything
#        passes the first answer and fails this one.
# R21 B: the same geometry with the via moved 1.0 mm off the run's centreline.
#        Copper reaches 0.25 mm (half the run) plus 0.40 mm (the annulus) =
#        0.65 mm, so 0.35 mm of laminate stands between them and nothing is
#        joined through it.
#        Expected: R21_B partial, pin_groups = 2, dangling = 0 — both run ends
#        are still on their own lands, so this is an OPEN and not a loose end.
# ===========================================================================
- ref: U21A
  footprint: Bench_Probe_2P
  value: PROBE-PAIR
  x_mm: 22.0
  y_mm: 248.0
  rotation_deg: 0
  layer: top
  pads:
  - number: "1"
    type: smd
    shape: rect
    position: {x: -1.4, y: 0.0}
    size: {width: 1.25, height: 1.75}
    layers: [F.Cu, F.Mask, F.Paste]
  - number: "2"
    type: smd
    shape: rect
    position: {x: 1.4, y: 0.0}
    size: {width: 1.25, height: 1.75}
    layers: [F.Cu, F.Mask, F.Paste]
  pins:
  - {number: "1", x_mm: -1.4, y_mm: 0.0}
  - {number: "2", x_mm: 1.4, y_mm: 0.0}
  graphics:
  - {layer: F.SilkS, kind: line, start: [-2.3, -1.2], end: [2.3, -1.2], width: 0.12}
  - {layer: F.SilkS, kind: line, start: [-2.3, 1.2], end: [2.3, 1.2], width: 0.12}
# The plane anchor: a through-hole land standing IN the back pour, so the only
# path from the probe pair to it runs through the via.
- ref: TP21C
  footprint: TH_TestPoint
  x_mm: 27.0
  y_mm: 248.0
  rotation_deg: 0
  layer: top
  pins:
  - {number: "1", x_mm: 0.0, y_mm: 0.0}
- ref: U21B
  footprint: Bench_Probe_2P
  value: PROBE-PAIR
  x_mm: 46.0
  y_mm: 248.0
  rotation_deg: 0
  layer: top
  pads:
  - number: "1"
    type: smd
    shape: rect
    position: {x: -1.4, y: 0.0}
    size: {width: 1.25, height: 1.75}
    layers: [F.Cu, F.Mask, F.Paste]
  - number: "2"
    type: smd
    shape: rect
    position: {x: 1.4, y: 0.0}
    size: {width: 1.25, height: 1.75}
    layers: [F.Cu, F.Mask, F.Paste]
  pins:
  - {number: "1", x_mm: -1.4, y_mm: 0.0}
  - {number: "2", x_mm: 1.4, y_mm: 0.0}
  graphics:
  - {layer: F.SilkS, kind: line, start: [-2.3, -1.2], end: [2.3, -1.2], width: 0.12}
  - {layer: F.SilkS, kind: line, start: [-2.3, 1.2], end: [2.3, 1.2], width: 0.12}
- ref: TP21D
  footprint: TH_TestPoint
  x_mm: 51.0
  y_mm: 248.0
  rotation_deg: 0
