# THE ANCHOR + TRANSFORM fixture: every placement case whose emitted coordinate
# a hand derivation can state exactly, using REAL seed-library footprints so the
# geometry is the geometry an order actually ships.
#
# TWO FOOTPRINTS, chosen for what they prove and measured before they were
# chosen (pcb/library/footprints):
#
#   * Package_TO_SOT_SMD:SOT-23 — the ASYMMETRIC part. Its fab-layer body box is
#     (-0.7, -1.5)..(0.7, 1.5), so its body centre IS its origin and every
#     Q row below must emit exactly what it emitted before assembly anchors
#     existed — the reverse oracle. Its LANDS are asymmetric in both axes
#     (pin 1 at (-0.9375, -0.95), pin 2 at (-0.9375, 0.95), pin 3 at
#     (0.9375, 0)), which is what makes it able to witness a rotation SIGN and a
#     side MIRROR that a symmetric chip resistor would hide.
#   * Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical — the part
#     whose ORIGIN IS PIN 1. Fab body box (-1.32, -1.32)..(1.32, 16.56), so its
#     body centre is (0, 7.62): 7.62 mm from the datum its coordinates used to
#     be emitted at. Every J and U row below MOVES, and by exactly that.
#
# The U rows are the SYNTHETIC EXPANSION, shaped like this board's U1S: one
# drawn socket strip standing for the two strips a DevKit sits in, its rows
# 22.86 mm apart (the ESP32-S3-DevKitC-1 row pitch the seed library's own
# socket-set footprint carries). U1S is the plain case; U2S is the same
# expansion put through a parent rotation, a bottom side AND a per-placement
# rotation at once, which is the only case where all three compose.
#
# Deliberately NO nets: every claim here is about geometry, and a net list would
# only add a way for the fixture to stop compiling for an unrelated reason.
version: 1
name: AssemblyAnchor
width_mm: 120
height_mm: 100
origin: {x_mm: 0, y_mm: 0}
layers: [top, bottom]
design_rules:
  clearance_mm: 0.2
  trace_width_mm: 0.25
  via_diameter_mm: 0.8
  via_drill_mm: 0.4

components:
  # --- centroid-at-origin control: these four must not move, on either side,
  #     at either angle.
  - ref: Q1
    footprint: Package_TO_SOT_SMD:SOT-23
    value: MMBT3904
    x_mm: 10.0
    y_mm: 10.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C20526}
  - ref: Q2
    footprint: Package_TO_SOT_SMD:SOT-23
    value: MMBT3904
    x_mm: 20.0
    y_mm: 10.0
    rotation_deg: 90
    layer: top
    assembly: {mpn: C20526}
  - ref: Q3
    footprint: Package_TO_SOT_SMD:SOT-23
    value: MMBT3904
    x_mm: 30.0
    y_mm: 10.0
    rotation_deg: 0
    layer: bottom
    assembly: {mpn: C20526}
  - ref: Q4
    footprint: Package_TO_SOT_SMD:SOT-23
    value: MMBT3904
    x_mm: 40.0
    y_mm: 10.0
    rotation_deg: 90
    layer: bottom
    assembly: {mpn: C20526}

  # --- origin-on-pin-1: the anchor is 7.62 mm from the placement, and the
  #     three cases below turn and mirror it.
  - ref: J2
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: 1x07 socket
    x_mm: 10.0
    y_mm: 30.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C7501749}
  - ref: J3
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: 1x07 socket
    x_mm: 25.0
    y_mm: 30.0
    rotation_deg: 90
    layer: top
    assembly: {mpn: C7501749}
  - ref: J4
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: 1x07 socket
    x_mm: 40.0
    y_mm: 30.0
    rotation_deg: 0
    layer: bottom
    assembly: {mpn: C7501749}

  # --- U1S-shaped synthetic expansion: one drawing, two soldered strips.
  - ref: U1S
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: DevKit socket set
    x_mm: 20.0
    y_mm: 50.0
    rotation_deg: 0
    layer: top
    assembly:
      mpn: C41376161
      placements:
        - {ref: U1S_A, offset_mm: {x: 0, y: 0}, rotation_deg: 0}
        - {ref: U1S_B, offset_mm: {x: 22.86, y: 0}, rotation_deg: 0}
  # --- the same expansion with all three composers acting at once: a parent
  #     rotation, the bottom side, and a per-placement rotation on U2S_B.
  - ref: U2S
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: DevKit socket set
    x_mm: 60.0
    y_mm: 50.0
    rotation_deg: 90
    layer: bottom
    assembly:
      mpn: C41376161
      placements:
        - {ref: U2S_A, offset_mm: {x: 0, y: 0}, rotation_deg: 0}
        - {ref: U2S_B, offset_mm: {x: 22.86, y: 0}, rotation_deg: 90}
