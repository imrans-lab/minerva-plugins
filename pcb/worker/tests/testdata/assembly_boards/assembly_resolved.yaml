# COMPILABLE twin of assembly_fixture.yaml — the board the BOM/CPL emitters are
# measured on now that they derive every row from a strict compilation.
#
# Why two fixtures. assembly_fixture.yaml declares pin positions that do NOT
# coincide with its library pads and names a footprint (D_SOD-123) no library
# supplies, so the compiler refuses it — measured: pin_pad_desync on all four
# resistor pins, footprint_unresolved on D1, two missing via rules. It kept
# emitting CSVs anyway while the emitters read the raw board dict, which is the
# defect the cutover closes. It stays, unchanged, as the fixture that proves
# the NAMED refusal; this file is the one that proves the emission.
#
# Every CPL-bearing number here is IDENTICAL to assembly_fixture.yaml's — same
# x_mm/y_mm, same rotations, same sides, same values, same MPNs — so the CPL
# bytes the hand-derived seals assert are the same bytes the raw-dict path
# emitted. What changed is only what had to: real library footprints, no pin
# overrides (the library owns the pads), and the two via rules the compiler
# requires.
#
# Deliberately exercises:
#   * two components sharing every EMITTED BOM column (package, value, part
#     number) -> one grouped BOM line with two refs (R1, R2). `package` is
#     authored on BOTH, because the Footprint column prints the authored
#     package when there is one and the footprint ref when there is not: a
#     board that authored it on only one of the pair would print `0805` beside
#     `R_0805` and split the row on the asymmetry rather than on anything the
#     grouping seals are about. The asymmetry itself is measured on its own
#     board (test_bom_asymmetric_package_authoring_splits_the_row);
#   * a non-zero rotation (R2 @ 90) and a BOTTOM-side off-axis one (D1 @ 45);
#   * all THREE authored homes for part identity — the structured assembly
#     block (R1), the pre-block top-level scalars (R2, which carries both its
#     `mpn` and its `package` there), and a nested properties mapping (D1) — so
#     the compile-time precedence fold is covered by the board every emitter
#     test already loads;
#   * BOTH non-populated forms — the legacy `assembly: exclude` scalar (FID1)
#     and the structured `populate: false` (TXT1) — which must contribute no
#     BOM row, no CPL row, and no identity requirement.
version: 1
name: AssemblyResolved
width_mm: 30
height_mm: 20
origin: {x_mm: 0, y_mm: 0}
layers: [top, bottom]
design_rules:
  clearance_mm: 0.2
  trace_width_mm: 0.25
  via_diameter_mm: 0.8
  via_drill_mm: 0.4

components:
  # Identity in the structured block — the canonical home.
  - ref: R1
    footprint: R_0805
    value: "10k"
    x_mm: 10.0
    y_mm: 5.0
    rotation_deg: 0
    layer: top
    assembly:
      mpn: C25804
      manufacturer: Yageo
      # QUOTED: the identity fold takes strings only, and an unquoted package
      # whose digits happen to parse as a number (0402, 0603) would reach the
      # IR as None and silently fall back to the footprint ref.
      package: "0805"
      house_parts: {jlcpcb: C25804}
  # Identity as pre-block top-level scalars — mpn AND package, so R1 and R2
  # print the same Footprint cell from two different authored homes.
  - ref: R2
    footprint: R_0805
    value: "10k"
    mpn: C25804
    package: "0805"
    x_mm: 15.0
    y_mm: 5.0
    rotation_deg: 90
    layer: top
  # Identity in a nested properties mapping, on the bottom side at 45 degrees.
  - ref: D1
    footprint: Diode_SMD:D_SMA
    value: 1N4148
    x_mm: 12.5
    y_mm: 14.0
    rotation_deg: 45
    layer: bottom
    properties:
      mpn: C2128
  # Board furniture, legacy scalar form: fabricated copper, never purchased.
  - ref: FID1
    footprint: Minerva_Fixture:FID_Circle_1mm
    value: ""
    x_mm: 2.0
    y_mm: 2.0
    rotation_deg: 0
    layer: top
    assembly: exclude
  # Board furniture, structured form.
  - ref: TXT1
    footprint: Minerva_Fixture:TXT_CouponRev
    value: ""
    x_mm: 27.0
    y_mm: 18.0
    rotation_deg: 0
    layer: top
    assembly:
      populate: false

nets:
  - name: NET1
    pins: ["R1.2", "R2.1"]
  - name: NET2
    pins: ["R2.2", "D1.1"]
