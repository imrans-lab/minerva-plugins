# THE ORIENTATION FIXTURE: a synthetic board whose every bought part is a pair
# the SHIPPED ledger (pcb/library/part_orientation.json) has actually measured.
#
# WHY THIS BOARD EXISTS AND WHY IT LOOKS LIKE THIS
# ------------------------------------------------
# Every part here is placed TOP-SIDE, where the emitted CPL rotation is the
# placed rotation PLUS the part's measured orientation offset. (A bottom
# placement mirrors the footprint's local frame before rotating it, so it
# SUBTRACTS the offset instead; that half is proved on one-part boards built in
# test_assembly_orientation.py rather than on this board, so the emitted bytes
# below stay a single flat table a reader can check by hand.)
#
# An inverted sign is INVISIBLE on any part whose offset is
# 0 or 180 — R+180 and R-180 are the same number modulo 360 — and nine of the
# eleven measured pairs are exactly that. A fixture assembled only out of them
# would pass with the correction subtracting instead of adding, and every
# quarter-turn part would ship a quarter turn out.
#
# So U1 and U2 are the two measured 270s, and they are the point of this file:
#
#   ref  footprint / catalogue part            offset  placed  emitted  subtraction
#   ---  -----------------------------------   ------  ------  -------  -----------
#   U1   TSOT-23-6 / C780769                      270      30      300          120
#   U2   VQFN-16-1EP_3x3mm / C910544              270       0      270           90
#   J1   JST_PH_S4B-PH-SM4-TB / C265102           180      90      270          270
#   R1   R_0805_2012Metric / C149504                0      45       45           45
#
# U1's placed rotation is 30 rather than a right angle deliberately: it makes
# the emitted number (300) differ from every other angle in the table, so a
# test asserting it cannot be satisfied by a stray 90 or 270 from somewhere
# else. J1 and R1 are the blind rows, kept on purpose — they are what the
# corpus mostly looks like, and a suite must contain both the cases that can
# falsify the sign and the cases that cannot.
#
# Every part carries `mpn` as well: the jlc dialect REQUIRES an identity field
# per placed part, and the corpus's convention is to spell the LCSC number
# there. The orientation join reads `house_parts`, never `mpn` — see
# assembly_orientation's KNOWN GAP note — so the two are stated separately even
# where they happen to hold the same string.
#
# FID1 is board furniture: fabricated copper nobody buys, so it carries no
# catalogue number, is not populated, and must never reach the orientation gate
# at all.
#
# NOT a product board. Every part here is a seed-library footprint paired with
# the catalogue number the vendor-payload corpus already pairs it with
# (tests/testdata/vendor_footprints/index.json), placed at coordinates chosen
# for legibility and nothing else.
version: 1
name: AssemblyOrientation
width_mm: 40
height_mm: 30
origin: {x_mm: 0, y_mm: 0}
layers: [top, bottom]
design_rules:
  clearance_mm: 0.2
  trace_width_mm: 0.25
  via_diameter_mm: 0.8
  via_drill_mm: 0.4

components:
  # offset 270, placed at 30 -> 300. The row that falsifies the sign.
  - ref: U1
    footprint: Package_TO_SOT_SMD:TSOT-23-6
    value: "SGM2036"
    x_mm: 8.0
    y_mm: 8.0
    rotation_deg: 30
    layer: top
    assembly:
      mpn: C780769
      house_parts: {jlcpcb: C780769}
  # offset 270, placed at 0 -> 270. The second falsifier, and the one whose pad
  # field is rotationally symmetric enough that no preview would show the fault.
  - ref: U2
    footprint: Package_DFN_QFN:VQFN-16-1EP_3x3mm_P0.5mm_EP1.68x1.68mm
    value: "MCU"
    x_mm: 20.0
    y_mm: 8.0
    rotation_deg: 0
    layer: top
    assembly:
      mpn: C910544
      house_parts: {jlcpcb: C910544}
  # offset 180, placed at 90 -> 270. Blind to the sign, and that is the point.
  - ref: J1
    footprint: Connector_JST:JST_PH_S4B-PH-SM4-TB_1x04-1MP_P2.00mm_Horizontal
    value: "PH-4"
    x_mm: 12.0
    y_mm: 22.0
    rotation_deg: 90
    layer: top
    assembly:
      mpn: C265102
      house_parts: {jlcpcb: C265102}
  # offset 0, placed at 45 -> 45. Measured AND aligned: the row that proves a
  # measured zero is applied as a zero rather than skipped.
  - ref: R1
    footprint: Resistor_SMD:R_0805_2012Metric
    value: "10k"
    x_mm: 30.0
    y_mm: 20.0
    rotation_deg: 45
    layer: top
    assembly:
      mpn: C149504
      house_parts: {jlcpcb: C149504}
  # Furniture: no catalogue number, not populated, never gated.
  - ref: FID1
    footprint: Minerva_Fixture:FID_Circle_1mm
    value: ""
    x_mm: 3.0
    y_mm: 27.0
    rotation_deg: 0
    layer: top
    assembly:
      populate: false
