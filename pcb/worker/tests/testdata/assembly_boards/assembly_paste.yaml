# THE PASTE MATRIX fixture: every combination of populate x authored paste x land
# type whose emitted stencil a hand derivation can state exactly, on real seed-
# library footprints.
#
# One component per matrix cell, each on its own 10 mm X band so a stray aperture
# from the wrong part cannot hide inside another part's flashes:
#
#   R1 @ x=10  populated SMD, paste absent (auto)  -> apertures EMITTED
#   R2 @ x=20  do-not-populate SMD, paste include  -> apertures EMITTED
#   R3 @ x=30  do-not-populate SMD, paste exclude  -> apertures SUPPRESSED
#   J1 @ x=10  populated THROUGH-HOLE, paste auto  -> NO apertures, either side
#   D1 @ x=15  populated bottom-side SMD, auto     -> apertures EMITTED to B.Paste
#   D2 @ x=30  do-not-populate bottom SMD, exclude -> apertures SUPPRESSED
#
# The cell deliberately ABSENT is do-not-populate + paste auto on a paste-bearing
# footprint: that combination refuses at export (assembly_paste_undecided), so a
# board carrying it could not emit the CSVs this fixture is also used for. It is
# exercised in test_assembly_gates.py instead.
#
# J1 is the THT regression seal. Its footprint declares only *.Cu and *.Mask on
# its pads, so it reaches neither paste layer — which is a consequence of the
# library's layer lists, not a pad_type rule, and is exactly what the seal is
# there to catch changing.
#
# Deliberately NO nets: every claim here is about emitted geometry, and a net
# list would only add a way for the fixture to stop compiling for an unrelated
# reason.
version: 1
name: AssemblyPaste
width_mm: 50
height_mm: 40
origin: {x_mm: 0, y_mm: 0}
layers: [top, bottom]
design_rules:
  clearance_mm: 0.2
  trace_width_mm: 0.25
  via_diameter_mm: 0.8
  via_drill_mm: 0.4

components:
  - ref: R1
    footprint: R_0805
    value: "10k"
    x_mm: 10.0
    y_mm: 5.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C25804}
  - ref: R2
    footprint: R_0805
    value: "10k"
    x_mm: 20.0
    y_mm: 5.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C25804, populate: false, paste: include}
  - ref: R3
    footprint: R_0805
    value: "10k"
    x_mm: 30.0
    y_mm: 5.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C25804, populate: false, paste: exclude}
  - ref: J1
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x07_P2.54mm_Vertical
    value: 1x07 socket
    x_mm: 10.0
    y_mm: 20.0
    rotation_deg: 0
    layer: top
    assembly: {mpn: C7501749}
  - ref: D1
    footprint: Diode_SMD:D_SMA
    value: 1N4148
    x_mm: 15.0
    y_mm: 32.0
    rotation_deg: 0
    layer: bottom
    assembly: {mpn: C2128}
  - ref: D2
    footprint: Diode_SMD:D_SMA
    value: 1N4148
    x_mm: 30.0
    y_mm: 32.0
    rotation_deg: 0
    layer: bottom
    assembly: {mpn: C2128, populate: false, paste: exclude}
