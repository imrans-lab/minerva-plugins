<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MultiMeter Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Guide panel: a generic flat drawing of a handheld multimeter with this
     meter's control layout (our own artwork, no maker branding) that shows the dial slot and lead
     jacks the assistant asked for, next to where the dial actually is.
     Single self-contained file; runs under godot-cef and godot_wry. */
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e8eb; --muted:#8a919c;
    --ok:#66bb6a; --warn:#ffb74d; --bad:#ef5350; --target:#4fc3f7; --live:#ffd54f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { display:flex; flex-direction:column; gap:10px; padding:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  #instruction { font-size:17px; min-height: 24px; }
  #warning { color:var(--warn); }
  #match { display:inline-block; padding:3px 10px; border-radius:12px; font-weight:600; font-size:12px; background:#3a2a1a; color:var(--warn); }
  #match.ok { background:#1f3a22; color:var(--ok); }
  #match.off { background:#3a1f1f; color:var(--bad); }
  .legend { display:flex; gap:14px; color:var(--muted); font-size:12px; flex-wrap:wrap; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
  #wrap { display:flex; justify-content:center; }
  svg { max-height:70vh; width:auto; }
  .body { fill:#3b4fa3; stroke:#2a3a80; stroke-width:3; }
  .lcd { fill:#c9d3b8; stroke:#8a9478; }
  .btn { fill:#f0a020; stroke:#b07010; }
  .btn.blue { fill:#3d8ad6; stroke:#245c95; }
  .knob { fill:#1c1f26; stroke:#0b0c10; stroke-width:2; }
  .ring { fill:none; stroke:#8fa0d8; stroke-width:1; opacity:.5; }
  .lbl { fill:#eef; font-size:13px; font-weight:600; text-anchor:middle; }
  .lbl.hot { fill:var(--target); }
  .lblg path { fill:none; stroke:#eef; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .lblg path.filled { fill:#eef; stroke:none; }
  .lblg text { fill:#eef; font-size:13px; font-weight:600; text-anchor:middle; }
  .lblg.hot path { stroke:var(--target); }
  .lblg.hot path.filled { fill:var(--target); }
  .lblg.hot text { fill:var(--target); }
  .jack { fill:#111; stroke:#c33; stroke-width:5; }
  .jack.black { stroke:#111; fill:#000; }
  .jack.hot { stroke:var(--target); stroke-width:7; }
  .jlbl { fill:#eef; font-size:12px; font-weight:700; text-anchor:middle; }
  .warn { fill:#f2c230; stroke:#111; stroke-width:1; }
  .warn-x { fill:#111; font-size:9px; font-weight:800; text-anchor:middle; }
  .limit { fill:#dfe4f5; font-size:7px; text-anchor:middle; letter-spacing:.3px; }
  .lead { fill:none; stroke-width:6; stroke-linecap:round; opacity:.95; }
  .lead.red { stroke:#e53935; } .lead.black { stroke:#111; }
  .grip { fill:#3a3f4b; stroke:#15171c; stroke-width:2; }
  .grip-hi { fill:none; stroke:#6a7080; stroke-width:3; stroke-linecap:round; opacity:.8; }
  .notch { fill:var(--live); }
  .target-mark { fill:var(--target); }
  #knob { transition: transform .4s ease; }
  .hidden { display:none; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<div class="card">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span id="match" class="off">no meter</span>
    <span id="liveText" class="hint"></span>
  </div>
  <div id="instruction">Waiting for your assistant to set a guide…</div>
  <div id="warning"></div>
</div>

<div class="card">
  <div class="legend">
    <span><span class="sw" style="background:var(--target)"></span>turn the dial to the blue marker; plug the leads into the blue-ringed jacks</span>
    <span><span class="sw" style="background:var(--live)"></span>the knob is drawn where the meter says it is</span>
    <span><span class="sw" style="background:#e53935"></span>red lead</span>
    <span><span class="sw" style="background:#111;border:1px solid #666"></span>black lead</span>
  </div>
  <div id="wrap">
  <svg id="meter" viewBox="0 0 320 590" xmlns="http://www.w3.org/2000/svg" aria-label="handheld multimeter front, generic drawing">
    <rect class="body" x="10" y="10" width="300" height="570" rx="28"/>
    <text x="160" y="46" class="lbl" style="font-size:16px">Multimeter</text>
    <rect class="lcd" x="40" y="60" width="240" height="130" rx="6"/>
    <!-- main digits sit high; the strip under them carries the annunciators and bargraph, as on the LCD -->
    <text id="lcdText" x="268" y="108" style="font:700 40px 'SF Mono',Menlo,monospace;fill:#222;text-anchor:end">0.0000</text>
    <text id="lcdSub" x="48" y="140" style="font:600 11px -apple-system,Helvetica,Arial,sans-serif;fill:#333">AUTO  DC</text>
    <g id="lcdBar" transform="translate(48,156)">
      <line x1="0" y1="8" x2="224" y2="8" stroke="#666" stroke-width="1"/>
      <rect id="lcdBarFill" x="0" y="4" width="0" height="8" fill="#333"/>
    </g>
    

    <!-- orange buttons -->
    <g id="buttons">
      <rect class="btn" x="46" y="224" width="50" height="20" rx="6"/><text x="71" y="238" class="jlbl" style="fill:#222;font-size:10px">Select</text>
      <rect class="btn" x="104" y="224" width="50" height="20" rx="6"/><text x="129" y="238" class="jlbl" style="fill:#222;font-size:10px">Range</text>
      <rect class="btn" x="162" y="224" width="50" height="20" rx="6"/><text x="187" y="238" class="jlbl" style="fill:#222;font-size:10px">Hz/Duty</text>
      <rect class="btn" x="220" y="224" width="54" height="20" rx="6"/><text x="247" y="238" class="jlbl" style="fill:#222;font-size:10px">Max/Min</text>
      <!-- blue lens-shaped buttons: rounded on the outside, tapering toward the dial;
           left = backlight / hold, right = REL / Bluetooth -->
      <g transform="translate(0,8)">
      <path class="btn blue" d="M 44 263 C 44 250, 60 246, 78 248 L 100 263 L 78 278 C 60 280, 44 276, 44 263 Z"/>
      <g stroke="#123" stroke-width="1.6" fill="none">
        <path d="M 58 255 a 5 5 0 0 1 3 9 v 3 h -6 v -3 a 5 5 0 0 1 3 -9 Z"/><path d="M 55.5 269.5 h 5"/>
        <path d="M 73 258 v10 M 73 263 h6 M 79 258 v10"/>
        <path d="M 70 256 L 84 271" stroke-width="1"/>
      </g>
      <path class="btn blue" d="M 276 263 C 276 250, 260 246, 242 248 L 220 263 L 242 278 C 260 280, 276 276, 276 263 Z"/>
      <g stroke="#123" stroke-width="1.6" fill="none">
        <path d="M 240 269 L 246 257 L 252 269 Z"/>
        <path d="M 262 256 V 270 M 262 256 L 266 259.5 L 258 266.5 M 262 270 L 266 266.5 L 258 259.5"/>
        <path d="M 254 256 L 268 271" stroke-width="1"/>
      </g>
      </g>
    </g>

    <!-- dial: labels sit on a ring around the knob; pointer lines drawn from centre -->
    <g id="dial" transform="translate(160,392)">
      <circle class="ring" r="86"/>
      <path id="targetMark" class="target-mark hidden" d="M -7 -84 L 7 -84 L 0 -72 Z"/>
      <g id="knob">
        <!-- one black disc; a raised arrow-shaped grip in the middle points at the
             selected position, and a notch in the rim marks the tip -->
        <circle class="knob" r="66"/>
        <path class="grip" d="M 0 -50 C 14 -34, 20 -10, 20 10 C 20 30, 12 40, 0 42 C -12 40, -20 30, -20 10 C -20 -10, -14 -34, 0 -50 Z"/>
        <path class="grip-hi" d="M -3 -42 C 6 -30, 10 -12, 10 6 C 10 20, 6 30, 0 34"/>
        <path class="notch" d="M -4 -66 L 4 -66 L 0 -56 Z"/>
      </g>
      <g id="dialLabels"></g>
    </g>

    <!-- jacks, from docs/meter-front.jpg: 20A top-left, mA µA TEMP bottom-middle-left,
         COM bottom-middle-right, VΩ top-right. COM is common: the line art ties 20A
         and VΩ to it through a double diagonal, and a bracket ties mA to it below. -->
    <g id="jackArt" fill="none" stroke="#dfe4f5" stroke-width="1.4">
      <path d="M 64 508 H 150"/>
      <path d="M 150 508 L 180 528 M 156 508 L 186 528"/>
      <path d="M 256 508 H 206"/>
      <path d="M 206 508 L 176 528 M 200 508 L 170 528"/>
      <path d="M 112 552 V 560 H 208 V 552"/>
    </g>
    <g id="jackWarnings">
      <path class="warn" d="M 104 480 L 111 492 L 97 492 Z"/><text x="104" y="491" class="warn-x">!</text>
      <text x="104" y="502" class="limit">20 A · FUSED</text>
      <path class="warn" d="M 232 480 L 239 492 L 225 492 Z"/><text x="232" y="491" class="warn-x">!</text>
      <text x="232" y="502" class="limit">1000 V MAX</text>
      <path class="warn" d="M 160 540 L 167 552 L 153 552 Z"/><text x="160" y="551" class="warn-x">!</text>
      <text x="160" y="572" class="limit">mA µA · FUSED</text>
    </g>
    <g id="jacks">
      <circle id="jack-20A" class="jack" cx="52" cy="508" r="11"/><text x="52" y="486" class="jlbl">20A</text>
      <circle id="jack-MAUA" class="jack" cx="124" cy="538" r="11"/><text x="52" y="556" class="jlbl">mA µA</text><text x="52" y="570" class="jlbl">TEMP</text>
      <circle id="jack-COM" class="jack black" cx="196" cy="538" r="11"/><text x="268" y="562" class="jlbl">COM</text>
      <circle id="jack-VOHM" class="jack" cx="268" cy="508" r="11"/><text x="268" y="486" class="jlbl">V Ω Hz</text>
    </g>
    <!-- leads: drawn from below the meter into the jacks -->
    <path id="leadBlack" class="lead black hidden" d=""/>
    <path id="leadRed" class="lead red hidden" d=""/>
  </svg>
  </div>
</div>

<script>
(function () {
  'use strict';
  var PLUGIN = 'minerva_multimeter_';
  var $ = function (id) { return document.getElementById(id); };

  // Dial slots clockwise from OFF at ~8 o'clock, angles in degrees clockwise
  // from 12 o'clock, read off docs/meter-front.jpg.
  // Ten positions spread over the meter's ~195° sweep, from just below
  // nine o'clock (OFF) to just below three o'clock (A).
  var SLOT_START = 262.5, SLOT_STEP = 195 / 9;
  var SLOTS = [
    { id: 'OFF',  label: 'OFF' }, { id: 'V', label: 'V' }, { id: 'mV', label: 'mV' },
    { id: 'OHM',  label: 'Ω ⊣ •)))' }, { id: 'HZ', label: 'Hz %' }, { id: 'CAP', label: '⊣⊢' },
    { id: 'TEMP', label: 'TEMP' }, { id: 'uA', label: 'µA' }, { id: 'mA', label: 'mA' }, { id: 'A', label: 'A' }
  ].map(function (s, i) { s.deg = (SLOT_START + i * SLOT_STEP) % 360; return s; });
  var JACK_X = { '20A': 52, MAUA: 124, COM: 196, VOHM: 268 };
  var JACK_Y = { '20A': 508, MAUA: 538, COM: 538, VOHM: 508 };
  var SLOT_NAMES = { OFF: 'off', V: 'volts', mV: 'millivolts', OHM: 'ohms', HZ: 'frequency', CAP: 'capacitance', TEMP: 'temperature', uA: 'microamps', mA: 'milliamps', A: 'amps' };

  var guide = null, dial = { slot: 'OFF' }, connected = false;

  function polar(deg, r) { var a = (deg - 90) * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; }

  // Symbol labels are drawn, not typed: diode, speaker and Ω share the OHM slot
  // (Select cycles them), and the CAP slot carries the capacitor glyph.
  var SYMBOL_LABELS = {
    OHM: '<path class="filled" d="M -3 -17 h 2.5 l 4 -3.5 v 10 l -4 -3.5 h -2.5 Z"/><path d="M 5.5 -16.5 a 3 3 0 0 1 0 5 M 8 -18.5 a 6 6 0 0 1 0 9"/>' +
         '<path class="filled" d="M -16 -6 L -10 -2 L -16 2 Z"/><path d="M -10 -6 V 2 M -19 -2 H -16 M -10 -2 H -7"/>' +
         '<text x="4" y="3" style="font-size:12px">Ω</text>',
    CAP: '<path d="M -9 0 h 6 M -3 -6 v 12 M 3 -6 v 12 M 3 0 h 6"/>'
  };
  function buildLabels() {
    var g = $('dialLabels'); g.innerHTML = '';
    SLOTS.forEach(function (s) {
      var p = polar(s.deg, 100);
      var el;
      if (SYMBOL_LABELS[s.id]) {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        el.setAttribute('transform', 'translate(' + p[0] + ',' + p[1] + ')');
        el.setAttribute('class', 'lbl lblg');
        el.innerHTML = SYMBOL_LABELS[s.id];
      } else {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        el.setAttribute('x', p[0]); el.setAttribute('y', p[1] + 5); el.setAttribute('class', 'lbl');
        el.textContent = s.label;
      }
      el.id = 'lbl-' + s.id; g.appendChild(el);
    });
  }

  function degOf(slotId) { var s = SLOTS.filter(function (x) { return x.id === slotId; })[0]; return s ? s.deg : null; }
  function turnKnob(slotId) { var d = degOf(slotId); $('knob').setAttribute('transform', 'rotate(' + (d === null ? SLOT_START : d) + ')'); }
  function markTarget(slotId) {
    var d = degOf(slotId), el = $('targetMark');
    if (d === null) { el.classList.add('hidden'); return; }
    el.setAttribute('transform', 'rotate(' + d + ')'); el.classList.remove('hidden');
  }

  function leadPath(j) { var x = JACK_X[j], y = JACK_Y[j] + 11; return 'M ' + x + ' 586 C ' + x + ' 575, ' + x + ' ' + (y + 12) + ', ' + x + ' ' + y; }

  function render() {
    SLOTS.forEach(function (s) { $('lbl-' + s.id).classList.toggle('hot', !!guide && guide.slot === s.id); });
    Object.keys(JACK_X).forEach(function (j) {
      $('jack-' + j).classList.toggle('hot', !!guide && (guide.red_jack === j || j === 'COM'));
    });
    if (guide) {
      markTarget(guide.slot);
      $('leadRed').setAttribute('d', leadPath(guide.red_jack)); $('leadRed').classList.remove('hidden');
      $('leadBlack').setAttribute('d', leadPath('COM')); $('leadBlack').classList.remove('hidden');
      $('instruction').textContent = 'Dial to ' + SLOT_NAMES[guide.slot] + '. ' + (guide.instruction || '');
      $('warning').textContent = guide.warning || '';
    } else {
      $('targetMark').classList.add('hidden'); $('leadRed').classList.add('hidden'); $('leadBlack').classList.add('hidden');
      $('instruction').textContent = 'Waiting for your assistant to set a guide…';
      $('warning').textContent = '';
    }
    turnKnob(connected ? dial.slot : 'OFF');
    var m = $('match');
    if (!connected) { m.className = 'off'; m.textContent = 'meter off or out of reach'; }
    else if (!guide) { m.className = ''; m.textContent = 'meter on ' + (SLOT_NAMES[dial.slot] || dial.slot); }
    else if (dial.slot === guide.slot) { m.className = 'ok'; m.textContent = 'dial matches'; }
    else { m.className = ''; m.textContent = 'not yet: dial is on ' + (SLOT_NAMES[dial.slot] || dial.slot); }
    $('liveText').textContent = connected && dial.function ? (dial.function + (dial.prefix ? ' (' + dial.prefix + ')' : '')) : '';
  }

  function applyState(st) {
    if (!st) return;
    connected = !!st.connected;
    if (st.dial) dial = st.dial;
    guide = st.guide || null;
    render();
  }

  function onReading(r) {
    connected = true;
    if (r.slot) dial = { slot: r.slot, function: r.function, prefix: r.prefix };
    $('lcdText').textContent = r.overload ? 'OL' : r.display;
    $('lcdSub').textContent = (r.flags.indexOf('auto') >= 0 ? 'AUTO  ' : '') + r.function.replace('V DC', 'DC').replace('V AC', 'AC') +
      r.flags.filter(function (f) { return f !== 'auto'; }).map(function (f) { return '  ' + f.toUpperCase(); }).join('');
    var mag = r.overload ? 1 : Math.min(1, Math.abs(r.value) / (Math.pow(10, Math.ceil(Math.log10(Math.abs(r.value) || 1))) || 1));
    $('lcdBarFill').setAttribute('width', Math.round(224 * (isFinite(mag) ? mag : 0)));
    render();
  }

  function start(attempt) {
    if (!(window.minerva && typeof window.minerva.call === 'function')) {
      if (attempt < 20) return setTimeout(function () { start(attempt + 1); }, 500);
      $('instruction').textContent = 'Minerva bridge not available'; return;
    }
    window.minerva.onPluginState(applyState);
    window.minerva.onPluginEvent(function (name, payload) { if (name === 'multimeter.reading') onReading(payload); });
    var refresh = function () { window.minerva.call(PLUGIN + 'status', {}).then(applyState).catch(function () {}); };
    refresh();
    setInterval(refresh, 3000);
  }
  buildLabels(); render(); start(0);
})();
</script>
</body>
</html>
