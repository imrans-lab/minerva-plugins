title = "minerva-plugins secret history policy"

# Scanned over git history, not just the working tree: a credential that was
# committed and later deleted is still leaked.

[extend]
# Start from the maintained upstream ruleset; only carve out what is provably
# not ours. Never disable rules wholesale.
useDefault = true

[[allowlists]]
description = "Compiled Rust metadata in local build output"
# Every Rust plugin's target/ is gitignored. The compiled rmeta of rsa,
# pkcs1, pkcs8, pem-rfc7468 and openssl embeds those crates' own PEM
# documentation and test vectors, which read as private keys. A directory
# scan walks them anyway, and 55 unfixable findings train everyone to
# ignore the check. Scoped to the one rule those artifacts trip, so a real
# credential force-added under a target/ path is still caught by every
# other rule.
targetRules = ["private-key"]
paths = ['''(^|/)target/''']

[[allowlists]]
description = "Docket trackers carry record keys and prose, not credentials"
# generic-api-key is a heuristic on `key`-adjacent strings, so it fires on a
# docket hint's `"key":"pcb.bus.followups..."` and on ordinary sentences in
# comment bodies. Scoped to that one rule so a real AWS key, GitHub token or
# private key pasted into a tracker is still caught; scoped to the tracker
# files because they are tool-owned and cannot be edited to appease a scanner.
targetRules = ["generic-api-key"]
paths = ['''\.dct(\.cache(-shm|-wal)?)?$''']
