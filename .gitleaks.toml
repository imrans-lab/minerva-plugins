title = "minerva-plugins secret history policy"

# Scanned over git history, not just the working tree: a credential that was
# committed and later deleted is still leaked.

[extend]
# Start from the maintained upstream ruleset; only carve out what is provably
# not ours. Never disable rules wholesale.
useDefault = true

# Docket comment 579 lists two CI run IDs, not an API credential (01a0ca29befd).
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact CI run references in the Docket checkpoint"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/plugins\.dct$''']
regexes = ['''secret-scan35708739383, corpus-policy35708739337''']

# Remote examples and Rust tests replay this fixed, synthetic hello token;
# tests/common creates an isolated paired store with it, never a live store.
[[rules.allowlists]]
description = "Exact synthetic remote protocol replay token"
condition = "AND"
regexTarget = "secret"
paths = ['''^smart-remote/protocol/examples/(?:invalid/)?[A-Za-z0-9_]+\.jsonl$''', '''^smart-remote/src/message\.rs$''']
regexes = ['''^3f9a1c0e7b2d4a6f$''']

# The rejected unknown device ID follows a token argument in these assertions;
# the generic credential pattern captures the fixed device ID, not a secret.
[[rules.allowlists]]
description = "Exact remote rejection-test device ID"
condition = "AND"
regexTarget = "secret"
paths = ['''^smart-remote/tests/session\.rs$''']
regexes = ['''^0123456789ab$''']
