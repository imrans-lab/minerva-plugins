# cad/scripts/runtime-bundle.lock — shell-sourceable lock file
#
# Source-of-truth pins for the cad-plugin embedded python runtime bundle.
# Read by scripts/build-python-runtime-bundle.sh (repo root, plugin-agnostic).
#
# Format: shell-sourceable KEY=VALUE. Deviates from docket W1a TOML suggestion
# because only bash reads this in v1; bash TOML parsers are heavyweight and
# the rubric weighs cost vs readability against the extra dep. Switch to TOML
# if a Go-side or other-language consumer is added later (cheap migration).
#
# Filed under DCR 019e6a4bcb0c71019723011d8f8c8cf1 (CAD plugin embedded PBS
# python runtime, Plan A). Scope-amended 2026-05-27 to 5-target matrix.

# --- python-build-standalone (PBS) ----------------------------------------
# Release tag: https://github.com/astral-sh/python-build-standalone/releases
# Pin a specific PBS release for reproducibility. Bump deliberately when a
# CVE or new cpython patch matters.
PBS_TAG="20260510"
CPYTHON="3.12.13"

# --- plugin python deps ---------------------------------------------------
# Space-separated, version-pinned pip packages to install into the bundle's
# site-packages. Transitive deps resolve via pip. For cad-plugin the important
# transitive is cadquery-ocp (pinned by build123d <7.9,>=7.8 to the 7.8.x line;
# verified at bundle-build-time via Layer 1 self-test below).
PIP_PKGS="build123d==0.10.0"

# Wheels installed WITHOUT their declared dependencies. python-fcl's
# Requires-Dist names Cython, which only its BUILD needs — `import fcl` works
# with Cython absent, and LAYER1_IMPORTS below is what proves that on every
# native leg. Installing with deps would drag a compiler front-end into a
# runtime bundle for nothing.
#
# python-fcl 0.7.0.11 wheel filenames, all four release targets, each one
# downloaded and confirmed to exist on PyPI (sizes as downloaded):
#   python_fcl-0.7.0.11-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl  4.7 MB
#   python_fcl-0.7.0.11-cp312-cp312-macosx_11_0_arm64.whl                            1.6 MB
#   python_fcl-0.7.0.11-cp312-cp312-macosx_10_13_x86_64.whl                          2.0 MB
#   python_fcl-0.7.0.11-cp312-cp312-win_amd64.whl                                    1.1 MB
# Every one of those platform tags is in the build script's WHEEL_PLATS list
# for its triple, which is what lets the macos-amd64 CROSS install resolve a
# wheel instead of silently shipping an arm64-only slice.
#
# Expected cost, to be checked against the "Record runtime bundle sizes" step
# of a CI run: roughly +4.7 MB compressed on linux (+28 MB extracted), +3.6 MB
# across both macos slices, +1.1 MB on windows — about 3% of a bundle whose
# linux site-packages is already ~975 MB, nearly all of it cadquery-ocp.
#
# The wheel wraps FCL 0.7.0 built from the ambi-robotics/fcl fork, which
# upstream archived in 2026 — the code is frozen, not maintained. If a future
# CPython bump finds no matching wheel, the fallback is an in-house NumPy BVH
# distance query rather than a newer release of this package.
PIP_NO_DEPS_PKGS="python-fcl==0.7.0.11"

# --- windows wheel repair -------------------------------------------------
# Wheels whose compiled extension resolves a C++ runtime DLL from the machine
# rather than carrying its own, repaired on the windows leg so the bundle is
# self-contained on a user box with no Visual C++ redistributable installed.
# Entries must appear verbatim in PIP_NO_DEPS_PKGS.
#
# fcl.cp312-win_amd64.pyd imports MSVCP140.dll, VCRUNTIME140.dll and
# VCRUNTIME140_1.dll; python-build-standalone ships only the two VCRUNTIME
# ones. cadquery-ocp's wheel survives because upstream already delvewheel'd a
# private copy of msvcp140 into it; python-fcl's is unrepaired, so without
# this a CI runner (which has the redistributable) passes while a bare user
# machine fails `import fcl` at worker startup.
WHEEL_REPAIR_PKGS="python-fcl==0.7.0.11"
WHEEL_REPAIR_TOOL="delvewheel==1.13.1"

# --ignore-existing (a.k.a. --ignore-in-wheel) is REQUIRED here, and its name
# undersells what it does: delvewheel only builds its map of the wheel's own
# files when this flag is given. python-fcl keeps ccd.dll, octomap.dll and
# octomath.dll next to the .pyd inside fcl/, so without the flag the repair
# looks for ccd.dll on PATH alone and dies with "Unable to find library:
# ccd.dll". With it, those three resolve to the copies already in the wheel and
# are left exactly where they are.
# --analyze-existing then covers the second dependent: octomap.dll imports
# MSVCP140.dll too, and without this flag only the .pyd's own imports would be
# vendored.
WHEEL_REPAIR_ARGS="--ignore-existing --analyze-existing"

# What a repaired wheel must CONTAIN for the repair to count, as a python
# regular expression matched case-insensitively against the wheel's member
# names. delvewheel writes an output wheel even when it vendored nothing, so
# the build proves the repair by content — and which runtime is missing is a
# property of the wheel being repaired, not of the mechanism: a wheel whose
# extension links vcomp140 or libgomp is repaired the same way and proven
# against a different name.
WHEEL_REPAIR_PROOF="msvcp140.*\.dll$"

# --- Layer 1 import probe -------------------------------------------------
# Semicolon-separated python statements run inside the freshly-built bundle
# (env-isolated, PYTHONHOME=<stage>) to confirm the wheels resolve at import
# time. Native builds fail the script if any import raises; a cross build
# cannot run its own interpreter, so CI runs the same probe over the cross
# stage through a translator (scripts/probe-python-runtime-bundle.sh with
# RUNTIME_PROBE_PREFIX="arch -x86_64" for the macos-amd64 slice).
LAYER1_IMPORTS="import build123d; import cadquery_ocp; import fcl"

# --- licence texts --------------------------------------------------------
# Directory (relative to the plugin dir) copied into the bundle as licenses/.
# BSD and MIT binary redistribution requires the notice, conditions and
# disclaimer to travel with the distribution, and the wheels ship only some of
# the texts their contents need. Inventory + drift gate: cad/scripts/gen_notice.py.
BUNDLE_LICENSE_DIR="licenses"

# --- worker package layout ------------------------------------------------
# Where to find the plugin's python worker source (relative to plugin dir),
# and which directories to copy into the bundle's site-packages.
WORKER_SOURCE_DIR="worker"
WORKER_PACKAGES="mcad_worker mcad"

# --- bundle output location -----------------------------------------------
# Where the final tarball lands (relative to plugin dir). Must be a path
# that go:embed can reach from the package using the embed (Go forbids `..`
# in embed paths, so the bundle must live under the Go source tree). Scratch
# state (PBS cache, extraction stage) still goes under runtime-build/.
# 2026-06-10's `refactor(shared): extract plugin-agnostic bridge + runtime from
# cad` (1c8291b) renamed internal/runtime -> internal/cadruntime and moved the
# go:embed directives with it, but left this path behind. The bundle has been
# landing in a directory nothing embeds ever since, so every cad CI run has
# failed at `Build (native)` with "pattern bundle/runtime-bundle-<triple>.sha256:
# no matching files found". This line was the last reference to the old path.
BUNDLE_OUT_DIR="internal/cadruntime/bundle"
