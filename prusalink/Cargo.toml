[package]
name = "prusalink-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.5.0", features = ["json"] }
url = "2"
md-5 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
flate2 = "1"
crc32fast = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
