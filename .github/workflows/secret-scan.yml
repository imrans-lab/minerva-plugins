name: secret-scan

# One workflow for the whole monorepo, not a step per plugin: the per-plugin
# workflows are path-filtered, so a credential committed outside any plugin
# directory would be scanned by none of them.

on:
  push:
    branches: [main, "dcr/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
  # Called by every plugin workflow that publishes a release, so publication
  # depends on this scan of the same commit range; the caller's event drives
  # the range selection below.
  workflow_call:

permissions:
  contents: read

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan walks commits, so the range endpoints must be present.
          fetch-depth: 0
      - name: Scan the pushed range, the PR range, or manual full history
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: scripts/scan-secret-history-ci.sh
