name: drive

# Plugin dir is `drive`; plugin id (manifest) is `drive`, so the binary
# is `drive-plugin`, release tarballs are `drive-<version>-<target>.tar.gz`,
# and the release tag is `drive-v<version>` (regen_registry.py keys off id).
on:
  push:
    branches: [main, "dcr/**"]
    paths:
      - "drive/**"
      - ".github/workflows/drive.yml"
      - "scripts/**"
    tags: ["drive-v*"]
  pull_request:
    paths:
      - "drive/**"
      - ".github/workflows/drive.yml"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    # Nightly compatibility check against Minerva development HEAD (see the
    # panel job): resolves the branch once to a full SHA and records it.
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  build:
    name: drive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-22.04
            rust-targets: ""
            ext: ""
          - target: macos-universal
            runs-on: macos-14
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
            ext: ""
          - target: windows-x86_64
            runs-on: windows-2022
            rust-targets: ""
            ext: ".exe"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: drive
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: drive -> target
          key: ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'macos-universal'
        run: cargo build --release --locked

      - name: Build (macOS universal — lipo x86_64 + arm64)
        if: matrix.target == 'macos-universal'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/drive-plugin \
            target/aarch64-apple-darwin/release/drive-plugin \
            -output target/release/drive-plugin
          lipo -info target/release/drive-plugin

      - name: Cargo test (linux-x86_64 only — Linux is the source of truth)
        if: matrix.target == 'linux-x86_64'
        run: cargo test --release --locked

      - name: Smoke
        run: python3 ../scripts/smoke/mcp_smoke.py target/release/drive-plugin${{ matrix.ext }}

      - name: Pack release tarball
        run: |
          PLATFORM="${{ matrix.target }}"
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          mkdir -p dist
          PACKDIR="dist/drive-${VERSION}-${PLATFORM}"
          mkdir -p "$PACKDIR"
          cp target/release/drive-plugin${{ matrix.ext }} "$PACKDIR/"
          # Binary tier (pcb/manifest_binary_tier_test.go): the PACKED manifest
          # must not carry the source-tier `setup` stanza. The repo manifest
          # declares how to build this plugin from a checkout; the tarball
          # ships that build's output, and a host predating Minerva's
          # install-lane split would run the stanza against source that was
          # never packaged. Strip it here — SHA256SUMS below covers the
          # stripped file, so integrity still checks out.
          python3 -c "import json,sys; m=json.load(open('manifest.json')); m.pop('setup',None); json.dump(m,open(sys.argv[1],'w'),indent=2)" "$PACKDIR/manifest.json"
          # Ship the ui/ tree — manifest declares a godot_scene panel
          # (ui/DrivePanel.tscn + ui/DrivePanel.gd) loaded at panel-open
          # time from the install dir.
          cp -r ui "$PACKDIR/"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$PACKDIR" && find . -type f ! -name SHA256SUMS -print0 \
              | xargs -0 sha256sum | sed 's| \./| |' > SHA256SUMS)
          else
            (cd "$PACKDIR" && find . -type f ! -name SHA256SUMS -print0 \
              | xargs -0 shasum -a 256 | sed 's| \./| |' > SHA256SUMS)
          fi
          tar -czf "dist/drive-${VERSION}-${PLATFORM}.tar.gz" -C "$PACKDIR" .
          # The listing is diagnostic only, so it must never fail the step.
          # Piping tar into `head` lets head close the pipe at line 30 while tar
          # is still streaming a large archive; tar then dies on EPIPE and
          # `set -o pipefail` fails the pack. Write the whole listing to a file
          # and head the file instead: tar always runs to completion, so a
          # truncated or corrupt archive still fails here, but a listing longer
          # than 30 entries never does.
          LISTING="dist/drive-${VERSION}-${PLATFORM}.contents.txt"
          tar -tzf "dist/drive-${VERSION}-${PLATFORM}.tar.gz" > "$LISTING"
          echo "Packed contents ($(wc -l < "$LISTING") entries, first 30):"
          head -30 "$LISTING"
          ls -la "dist/drive-${VERSION}-${PLATFORM}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive-${{ matrix.target }}
          path: drive/dist/drive-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  panel:
    name: drive panel (GD suite-registry compatibility ONLY — nothing executes)
    # ============================================================
    # THIS JOB IS NOT A BUILD CHECK AND NOT A TEST. READ THIS BEFORE
    # TREATING IT AS EITHER.
    # ============================================================
    # Same shape and the same narrow claim as cad.yml's and pcb.yml's `panel`
    # jobs — see pcb.yml's header for the long version of why CI does not RUN
    # the GDScript suites. Short version: they need a Minerva `src/` host with
    # its NATIVE GDEXTENSIONS BUILT, a plain actions/checkout has no src/bin/
    # at all, and building another repo's three toolchains on every push to run
    # a suite CI is not supposed to run was measured on pcb: five consecutive
    # red runs that told nobody anything.
    #
    # What this job certifies is SUITE-REGISTRY AND HOST-CONTRACT
    # COMPATIBILITY: the pinned host exists and carries every file
    # drive/tests/gd/REQUIRED_HOST_FILES names, the sibling layout the suites'
    # res:// preloads hardcode is correct, and the suite set on disk matches
    # drive/tests/gd/EXPECTED_SUITES in BOTH directions — a suite deleted or
    # renamed while still listed, and a suite added to disk without being
    # registered. That last pair is the point: the runner's suite list is a
    # bare `test_*.gd` glob, so without the manifest a deleted suite is a
    # smaller GREEN run rather than a failure.
    #
    # A .gd file can be syntactically invalid, fail to preload, or regress
    # behaviourally while its filename sits in EXPECTED_SUITES and this job
    # stays green. Execution is a LOCAL gate:
    # scripts/run-gd-tests.sh --plugin drive <minerva> without the flag.
    #
    # It reaches the check through the runner's own --preflight-only flag
    # rather than reimplementing it, so local and CI cannot drift: one
    # implementation, shared with pcb, cad and council.
    # No Godot is downloaded — everything checked is filesystem state.
    runs-on: ubuntu-22.04
    env:
      # Pinned to a commit, not a moving branch: a third-party repo changing
      # underneath us must not turn drive red without someone choosing that.
      # THIS IS `development`, NOT `main` — Minerva's default branch is ~a year
      # stale and the plugin system does not exist there. Same SHA pcb.yml, cad.yml and
      # council.yml pin; if you bump it, bump all four and re-check the files
      # listed in each plugin's tests/gd/REQUIRED_HOST_FILES still exist at the
      # new SHA.
      MINERVA_SHA: "2289b80d0885692b9ffbe4ab538a9dca0618681c"
    steps:
      - name: Checkout minerva-plugins
        uses: actions/checkout@v4

      # Minerva must end up as a SIBLING of the minerva-plugins checkout: the
      # suites preload `res://../../minerva-plugins/drive/...` resolved from
      # <minerva>/src, so <minerva>/../minerva-plugins has to exist. On a
      # runner the workspace is /home/runner/work/minerva-plugins/minerva-plugins,
      # so the sibling slot is $GITHUB_WORKSPACE/../Minerva. It CANNOT be
      # checked out there directly — actions/checkout rejects any `path`
      # outside $GITHUB_WORKSPACE — so clone inside and relocate.
      # PR and push runs use the pinned SHA above. The nightly resolves
      # `development` ONCE to a full SHA, records it in the job summary, and
      # checks out exactly that revision, so a red nightly names the host
      # commit it saw and a green one is reproducible from the summary.
      - name: Resolve the Minerva host revision
        id: host
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            sha=$(git ls-remote https://github.com/turnrocklabs/Minerva refs/heads/development | cut -f1)
            src="development (nightly)"
          else
            sha="$MINERVA_SHA"
            src="pinned"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Minerva host: $sha ($src)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Minerva (pinned)
        uses: actions/checkout@v4
        with:
          repository: turnrocklabs/Minerva
          ref: ${{ steps.host.outputs.sha }}
          path: _minerva_host

      - name: Place Minerva beside minerva-plugins
        working-directory: ${{ github.workspace }}
        run: mv _minerva_host "$GITHUB_WORKSPACE/../Minerva"

      # WHAT THIS FAILS ON, i.e. what "not in a testable state" means:
      #   - the pinned Minerva host is missing or lacks src/project.godot
      #   - a host file drive/tests/gd/REQUIRED_HOST_FILES names is absent at
      #     the pinned SHA (the suites preload them by res:// path, so a bumped
      #     SHA that drops one breaks the harness rather than the code)
      #   - the sibling layout res://../../minerva-plugins/... hardcodes is wrong
      #   - a suite was deleted or renamed and is still in EXPECTED_SUITES
      #   - a suite was added to disk and NOT registered in EXPECTED_SUITES
      - name: Pre-flight the GD suite registry and host wiring
        run: bash drive/scripts/run-gd-tests.sh --preflight-only ../Minerva

  secret-scan:
    # The shared scan over the exact commit range; a release cannot publish
    # without it passing for this SHA.
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  release:
    name: Publish release
    needs: [build, secret-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all matrix tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: drive-*
          path: artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Compute tag + prerelease flag
        id: tag
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("drive/manifest.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="drive-v${VERSION}"
            PRE="false"
          else
            SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g; s|[^a-zA-Z0-9_.-]|-|g')
            TAG="drive-v${VERSION}-branch-${SAFE_BRANCH}"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          bash scripts/release-publish-guard.sh "$TAG" "$PRE"
          echo "Computed: tag=$TAG prerelease=$PRE"

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: artifacts/drive-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
