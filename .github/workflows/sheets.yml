name: sheets

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths: ["sheets/**", ".github/workflows/sheets.yml", ".go-version"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after the on-demand gates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify generated catalog
        run: python3 sheets/scripts/gen-tools.py --check
      - name: Compile and vet
        working-directory: sheets
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/sheets-plugin" .

  build:
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runner: ubuntu-22.04
            goos: linux
            goarch: arm64
          - target: windows-x86_64
            runner: ubuntu-22.04
            goos: windows
            goarch: amd64
          - target: macos-universal
            runner: macos-15
            goos: darwin
            goarch: universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: sheets
        run: go test ./...
      - name: Build archive
        working-directory: sheets
        env:
          CGO_ENABLED: "0"
          SHEETS_GOOS: ${{ matrix.goos }}
          SHEETS_GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$SHEETS_GOARCH" = universal ]; then
            GOOS=darwin GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/sheets-amd64" .
            GOOS=darwin GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/sheets-arm64" .
            lipo -create "$RUNNER_TEMP/sheets-amd64" "$RUNNER_TEMP/sheets-arm64" -output "$RUNNER_TEMP/sheets-plugin"
          else
            GOOS="$SHEETS_GOOS" GOARCH="$SHEETS_GOARCH" go build -trimpath -o "$RUNNER_TEMP/sheets-plugin" .
          fi
          python3 scripts/package.py '${{ matrix.target }}' "$RUNNER_TEMP/sheets-plugin" dist
      - name: Verify packaged manifest and checksums
        working-directory: sheets
        env:
          SHEETS_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, sys, tarfile
          scripts = pathlib.Path.cwd().parent / "scripts"
          sys.path.insert(0, str(scripts))
          spec = importlib.util.spec_from_file_location("release_verifier", scripts / "verify-release.py")
          verifier = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = verifier
          spec.loader.exec_module(verifier)
          source = json.loads(pathlib.Path("manifest.json").read_text())
          path = pathlib.Path("dist") / f"sheets-{source['version']}-{os.environ['SHEETS_TARGET']}.tar.gz"
          data = path.read_bytes()
          asset = verifier.Asset(path.name, len(data), "sha256:" + hashlib.sha256(data).hexdigest())
          receipt = verifier.verify_archive(path, asset, source)
          print(receipt)
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sheets-packed"
          destination.mkdir()
          with tarfile.open(path) as archive:
              for name in ("manifest.json", "sheets-plugin"):
                  (destination / name).write_bytes(archive.extractfile(name).read())
          (destination / "sheets-plugin").chmod(0o755)
          PY
          python3 ../scripts/verify-packed-manifest.py manifest.json "$RUNNER_TEMP/sheets-packed/manifest.json"
          file "$RUNNER_TEMP/sheets-packed/sheets-plugin"
      - name: Packaged native handshake
        if: matrix.target == 'linux-x86_64' || matrix.target == 'macos-universal'
        working-directory: sheets
        run: python3 ../scripts/smoke/mcp_smoke.py "$RUNNER_TEMP/sheets-packed/sheets-plugin"
      - uses: actions/upload-artifact@v7
        with:
          name: sheets-${{ matrix.target }}
          path: sheets/dist/sheets-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  release:
    timeout-minutes: 10
    concurrency: sheets-release
    needs: [source-build, build, secret-scan]
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && always() && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: sheets-*
          path: artifacts/
          merge-multiple: true
      - name: Compute tag and verify publication
        id: tag
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("sheets/manifest.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          elif [ "$GITHUB_REF_NAME" = main ]; then
            TAG="sheets-v${VERSION}"
            PRE="false"
          else
            SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g; s|[^a-zA-Z0-9_.-]|-|g')
            TAG="sheets-v${VERSION}-branch-${SAFE_BRANCH}"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          bash scripts/release-publish-guard.sh "$TAG" "$PRE" sheets
      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: artifacts/sheets-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
