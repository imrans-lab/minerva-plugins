name: registry-check

# Validate committed release selections, independent of newer tags or manifests.

on:
  push:
    branches: [main, "dcr/**"]
    paths:
      - "registry.json"
      - "scripts/*registry*.py"
      - "scripts/release-publish-guard.sh"
      - "*/manifest.json"
      - ".github/workflows/registry-check.yml"
    tags: ["*-v*"]
  pull_request:
    paths:
      - "registry.json"
      - "scripts/*registry*.py"
      - "scripts/release-publish-guard.sh"
      - "*/manifest.json"
      - ".github/workflows/registry-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    name: Registry release and asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generator can find git tags of the form
          # <plugin>-v*.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Registry regression tests
        run: python3 -m unittest discover -s scripts -p 'test_registry.py'

      - name: Validate selected releases and published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/regen_registry.py --check --published
