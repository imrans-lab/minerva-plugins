name: smart-remote
on:
  push:
    branches: [main, "dcr/**"]
    paths: ["smart-remote/**", ".github/workflows/smart-remote.yml"]
  pull_request:
    paths: ["smart-remote/**", ".github/workflows/smart-remote.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smart-remote
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-remote -> target
      - run: cargo fmt --check
      - run: cargo build --locked
  qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-remote
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-remote -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install jsonschema==4.26.0
      - run: python3 protocol/tools/check_examples.py
      - run: cargo clippy --locked --all-targets
      - run: SMART_REMOTE_MDNS_TEST=1 cargo test --locked -- --nocapture
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
