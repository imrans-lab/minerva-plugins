name: Docket signed release
on:
  pull_request:
    paths: ['.go-version', 'docket/**', '.github/workflows/docket.yml']
  push:
    paths: ['.go-version', 'docket/**', '.github/workflows/docket.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: docket
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: docket/go.sum
      - name: Compile source and test files
        run: GOWORK=off go vet -mod=readonly ./...
      - name: Verify all published pins with the acquisition verifier
        if: github.event_name == 'workflow_dispatch'
        run: GOWORK=off go run -mod=readonly . verify-pins
      - name: Retain the real official fixture
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/docket-release"
          tag=$(python3 -c 'import json; print(json.load(open("release.lock.json"))["tag"])')
          gh release download "$tag" --repo imrans-lab/docket --dir "$RUNNER_TEMP/docket-release" --pattern SHA256SUMS --pattern SHA256SUMS.asc --pattern '*.zip' --pattern '*.tar.gz'
      - name: Exercise official fixture and rejection cases independently
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKET_RELEASE_FIXTURE: ${{ runner.temp }}/docket-release
        run: GOWORK=off go test -mod=readonly -count=1 ./...
      - name: Acquire the official release for this runner (no GUI)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/docket-private"
          chmod 700 "$RUNNER_TEMP/docket-private"
          GOWORK=off go run -mod=readonly . acquire "$RUNNER_TEMP/docket-private"

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
