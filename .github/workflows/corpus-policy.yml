# Corpus policy gate — this repo is PUBLIC; real product board designs are
# banned from it. See pcb/worker/tests/testdata/POLICY.md for the rule and
# the incident that created it (2026-07-30). This is a repo-content policy
# check, not a test suite: it greps tracked files and fails on banned
# product data, nothing more.
name: corpus-policy

on:
  push:
  pull_request:

jobs:
  no-product-boards:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ban product board files
        run: |
          set -euo pipefail
          # Public plugin source is allowed; product board data stays private.
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/smart-remote.yml) continue ;;
              smart-remote/*.rs|smart-remote/*.md|smart-remote/*.py) continue ;;
              smart-remote/Cargo.toml|smart-remote/Cargo.lock|smart-remote/manifest.json|smart-remote/.gitignore) continue ;;
              smart-remote/protocol/schema/*.json|smart-remote/protocol/examples/*.jsonl) continue ;;
              smart-remote/scripts/check-protocol-sync.sh|smart-remote/scripts/protocol-owner-amendment.json) continue ;;
            esac
            echo "::error::product board file is banned: $path (see pcb/worker/tests/testdata/POLICY.md)"
            exit 1
          done < <(git ls-files | grep -iE 'smart[-_]?remote' || true)
      - name: Ban product board identities in YAML
        run: |
          set -euo pipefail
          # A renamed file still declares its identity in the canonical
          # board contract's `name:` field — ban the identity itself.
          if git grep -nE '^[[:space:]]*name:[[:space:]]*["'"'"']?smart[-_]?remote' -- '*.yml' '*.yaml' ':!.github/workflows/smart-remote.yml'; then
            echo "::error::the smart-remote board definition is banned from this public repo (see pcb/worker/tests/testdata/POLICY.md)"
            exit 1
          fi

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
