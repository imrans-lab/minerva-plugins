name: pcb

# TEST GATES ONLY (round A0a). No packaging/release/registry/NOTICE/runtime
# bundle here — that is round A0b, a separate follow-up workflow change.
#
# Two jobs, split on whether kicad-cli is present:
#
#   `test`   — every push (main, dcr/**), every pull_request, and manual
#              dispatch. Linux only, no kicad-cli installed. This is the fast
#              PR gate: go vet, go test -count=1, and the worker pytest suite
#              with the 15 kicad-cli-gated "oracle" tests skipping (a 16th
#              test skips unconditionally, unrelated to kicad-cli).
#              Expected baseline (measured 2026-07-25 @ 5c81a22): 1018 passed,
#              16 skipped.
#
#   `oracle` — push to main and manual dispatch ONLY (never pull_request).
#              Installs kicad-cli via the KiCad PPA, then runs the full
#              worker suite so the oracle-gated tests actually execute.
#              Expected baseline (same commit, with kicad-cli 9.0.9):
#              1033 passed, 1 skipped.
#
# Why two jobs instead of one: if kicad-cli is never installed, 15 oracle
# tests skip on every single run and nobody notices when they silently start
# failing (skips don't fail CI). If kicad-cli is installed on every PR, every
# contributor pays a heavy KiCad-install tax on every push, which in practice
# makes people route around CI rather than wait for it. Keeping oracle checks
# on main-only (+ workflow_dispatch for on-demand verification) exercises them
# regularly without taxing the PR loop.
#
# pytest's own exit code is the pass/fail gate in both jobs — the counts above
# are baselines to sanity-check against, not counts asserted in this file.

on:
  push:
    branches: [main, "dcr/**"]
    # NOTE: the two paths lists below are duplicated on purpose. GitHub Actions
    # does not support YAML anchors/aliases in workflow files, so they cannot be
    # factored. Keep them in sync by hand.
    #
    # shared/** and go.work are included because pcb/go.mod `replace`s the shared
    # module to ../shared and go.work joins them into one workspace — a change
    # there can break the pcb build without touching pcb/**. Silent
    # non-execution is worse than a red build. Precedent: 3d-gen.yml,
    # movie-gen.yml.
    paths:
      - "pcb/**"
      - "shared/**"
      - "go.work"
      - ".github/workflows/pcb.yml"
  pull_request:
    paths:
      - "pcb/**"
      - "shared/**"
      - "go.work"
      - ".github/workflows/pcb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pcb test (no kicad-cli)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MUST run BEFORE the Go steps. main_test.go's python3Available() (:647)
      # shells `python3 -c "import pcb_worker, yaml"`, and its callers at :112
      # and :373 t.Skip() when that fails. On a clean setup-python 3.12 the
      # worker isn't importable, so both Go<->Python bridge tests would skip
      # and the job would report green while never exercising the bridge —
      # exactly the silent-pass failure this workflow exists to prevent.
      - name: Install worker (dev extras)
        working-directory: pcb/worker
        run: pip install -e ".[dev]"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # -count=1 is required — cached Go test results would hide
        # worker-side changes that don't touch Go source.
        run: go test -count=1 ./...

      # Run the two standing campaign gates by name first, so a red run is
      # legible at a glance (which gate failed) without digging through the
      # full pytest log below. They are ordinary tests inside tests/, so the
      # full-suite step re-runs them — that's intentional duplication for
      # log legibility, not a coverage gap.
      - name: Standing gates (determinism + kicad-cli boundary lint)
        working-directory: pcb/worker
        run: python -m pytest tests/test_determinism_gate.py tests/test_kicad_cli_boundary.py -v

      - name: Worker test suite (kicad-cli absent — oracle tests skip)
        working-directory: pcb/worker
        run: python -m pytest tests/ -q

  oracle:
    name: pcb oracle (with kicad-cli)
    # main + manual dispatch ONLY. `event_name != 'pull_request'` would have
    # been wrong in one direction: it also fires on every dcr/** push, which
    # contradicts the main-only intent stated at the top of this file.
    #
    # The step list below duplicates the `test` job. That is deliberate: the
    # obvious de-duplication (a `matrix: kicad: [false, true]`) cannot work,
    # because matrix context is not valid in a job-level `if:` — cad.yml
    # carries the same note — so the kicad entry could not be restricted to
    # main. A composite action would trade ~30 readable lines for indirection
    # at a size that does not earn it. Revisit if a third job appears.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kicad-cli (KiCad PPA)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          if sudo apt-get install -y kicad-cli; then
            echo "installed kicad-cli package"
          else
            echo "kicad-cli package unavailable, falling back to full kicad package"
            sudo apt-get install -y kicad
          fi
          kicad-cli --version

      # Before the Go steps — see the equivalent comment in the `test` job.
      - name: Install worker (dev extras)
        working-directory: pcb/worker
        run: pip install -e ".[dev]"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Standing gates (determinism + kicad-cli boundary lint)
        working-directory: pcb/worker
        run: python -m pytest tests/test_determinism_gate.py tests/test_kicad_cli_boundary.py -v

      - name: Worker test suite (kicad-cli present — oracle tests execute)
        working-directory: pcb/worker
        run: python -m pytest tests/ -q
