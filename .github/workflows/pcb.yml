name: pcb

# Test gates (rounds A0a/A0c/A1a) PLUS the marketplace binary-tier packaging
# pair `package`/`release` (epoch GA-4, docket 019f985bd921 — the "round A0b"
# this header used to defer). The five test jobs are the merge gate; the
# packaging pair builds the embedded-runtime binary, packs the tarball
# (binary + manifest + ui/ + library/ + libraries.lock.json + NOTICE.md) and
# publishes on push, mirroring cad.yml.
#
# Five test jobs:
#
#   `fab-gate`
#            — epoch CP2 station S1. Runs pcb/scripts/hermetic-fab-check.sh,
#              which compiles a board TWICE from a throwaway `git worktree` at
#              HEAD and byte-compares the two output trees.
#
#              WHAT THIS BUYS *ON A RUNNER*, stated precisely because the
#              obvious pitch for the script is wrong here. Its clean-checkout
#              dimension (no stale .pyc, no uncommitted edit, no leftover
#              .pcbskel sidecar) is what makes it valuable LOCALLY and is
#              close to vacuous in CI, where actions/checkout already hands us
#              a pristine tree. What it genuinely adds in this job is: a
#              CROSS-PROCESS two-run compare (fresh interpreter, so a fresh
#              hash seed, per compile) over REAL boards; BOM and CPL inside
#              the byte compare, which the determinism gate does not cover;
#              and the public coupon gated BY NAME.
#
#              PRECISE STATEMENT OF WHAT WAS MISSING, because the loose
#              version ("nothing ran the script") is wrong and was briefly
#              believed during S1: pcb/worker/tests/test_hermetic_check.py
#              DOES run in the `test` job and DOES drive the script as a
#              subprocess — including a full --self-test and a GREEN two-run
#              compare — but only over a tiny synthetic fixture built to clear
#              the minimum-manifest bar. What no job did was run any of that
#              against a REAL board. That is what this job adds, which is why
#              it names the full-feature fixture and the coupon explicitly
#              rather than trusting a stand-in.
#
#   `test`   — every push (main, dcr/**), every pull_request, and manual
#              dispatch. Linux only, no kicad-cli installed. This is the fast
#              PR gate: go vet, go test -count=1, and the worker pytest suite
#              with the 15 kicad-cli-gated "oracle" tests skipping (a 16th
#              test skips unconditionally, unrelated to kicad-cli).
#              Expected baseline (re-measured 2026-07-25 after the IR-parity
#              gate landed): 1076 passed, 16 skipped. Measured by running the
#              suite with kicad-cli off PATH, which is what this job sees.
#              STALE AS OF EPOCH CP2 — that epoch authors tests across every
#              station and does not execute any of them until its boundary
#              (S10), so no honest pass count can be written here before then.
#              Both baselines in this file are to be re-measured at S10 rather
#              than adjusted by guesswork. They were never assertions (see the
#              note at the bottom of this block: pytest's own exit code is the
#              gate), so a stale count misleads a reader but breaks nothing.
#
#   `test-crossplatform`
#            — round A0c. The SAME gate as `test`, on macos-latest and
#              windows-latest. push-to-main + manual dispatch only (see the
#              job's own note for the cost argument). Nothing about the worker
#              (Python) or the bridge (Go) is Linux-specific by design, but
#              nothing proved it either, and the owner develops on Linux while
#              testing opportunistically on Mac and Windows laptops — so a
#              portability break would otherwise surface on a laptop, days
#              later, with N rounds of changes to bisect.
#
#   `oracle` — push to main and manual dispatch ONLY (never pull_request).
#              Installs kicad-cli via the KiCad PPA, then runs the full
#              worker suite so the oracle-gated tests actually execute.
#              Expected baseline (same measurement, with kicad-cli 9.0.9):
#              1091 passed, 1 skipped. STALE as of epoch CP2 — see the note on
#              `test`'s baseline above; re-measure at S10.
#
#   `panel`  — round A1a. Runs pcb/tests/gd/*.gd, the GDScript layer covering
#              the plugin's panel + UI models. Nothing ran these before this
#              job existed: they are `extends SceneTree` scripts that must be
#              hosted by a Minerva `src/` checkout (see
#              pcb/scripts/run-gd-tests.sh for why). Same triggers as `test`
#              (every push + PR) because the Godot download is cached — see
#              the cache step below — so there is no cost reason to restrict
#              coverage to main-only. Linux only: a second Godot download and
#              a second Minerva checkout per OS is a real cost, and the layer
#              under test is engine-portable GDScript with no platform seams.
#              Whether the plugin INSTALLS on Mac/Windows stays a human check.
#
# Why `test`/`oracle` are two jobs instead of one: if kicad-cli is never
# installed, 15 oracle tests skip on every single run and nobody notices when
# they silently start failing (skips don't fail CI). If kicad-cli is
# installed on every PR, every contributor pays a heavy KiCad-install tax on
# every push, which in practice makes people route around CI rather than wait
# for it. Keeping oracle checks on main-only (+ workflow_dispatch for
# on-demand verification) exercises them regularly without taxing the PR loop.
# `test-crossplatform` is gated the same way for the same reason, with a
# steeper multiplier — see its note.
#
# Shared setup lives in .github/actions/pcb-setup (round A0c). The previous
# revision of this file duplicated the toolchain steps per job and recorded
# the threshold for extracting them: "Revisit if a third job appears." One
# did. Read that action before editing any job below — it owns the ordering
# invariant (worker installed BEFORE `go test`) and the assertion that the
# Go<->Python bridge tests will actually run rather than silently skip.
#
# pytest's own exit code is the pass/fail gate in `test`/`test-crossplatform`/
# `oracle` — the counts above are baselines to sanity-check against, not counts
# asserted in this file. `panel` is gated the same way: every pcb/tests/gd/*.gd
# test is an `extends SceneTree` script whose _init() ends with
# `quit(1 if _fail > 0 else 0)`, so the Godot process's own exit code IS the
# pass/fail signal (confirmed 2026-07-25 by temporarily breaking an assertion
# in test_pad_synthesis.gd and observing run-gd-tests.sh exit non-zero).

on:
  push:
    branches: [main, "dcr/**"]
    tags: ["pcb-v*"]
    # NOTE: the two paths lists below are duplicated on purpose. GitHub Actions
    # does not support YAML anchors/aliases in workflow files, so they cannot be
    # factored. Keep them in sync by hand.
    #
    # shared/** and go.work are included because pcb/go.mod `replace`s the shared
    # module to ../shared and go.work joins them into one workspace — a change
    # there can break the pcb build without touching pcb/**. Silent
    # non-execution is worse than a red build. Precedent: 3d-gen.yml,
    # movie-gen.yml.
    #
    # .github/actions/pcb-setup/** is listed for the same reason: the toolchain
    # steps moved there in A0c, so a change to that action changes what every
    # job below actually does.
    #
    # scripts/** (repo root) because the package job depends on the shared
    # build-python-runtime-bundle.sh and smoke/mcp_smoke.py — an edit there
    # can break pcb's bundle build without touching pcb/** (cad.yml lists it
    # for the same reason).
    paths:
      - "pcb/**"
      - "shared/**"
      - "go.work"
      - "scripts/**"
      - ".github/workflows/pcb.yml"
      - ".github/actions/pcb-setup/**"
  pull_request:
    paths:
      - "pcb/**"
      - "shared/**"
      - "go.work"
      - "scripts/**"
      - ".github/workflows/pcb.yml"
      - ".github/actions/pcb-setup/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pcb test (linux, no kicad-cli)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go + Python + worker
        uses: ./.github/actions/pcb-setup

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # -count=1 is required — cached Go test results would hide
        # worker-side changes that don't touch Go source.
        run: go test -count=1 ./...

      # Run the standing campaign gates by name first, so a red run is
      # legible at a glance (which gate failed) without digging through the
      # full pytest log below. They are ordinary tests inside tests/, so the
      # full-suite step re-runs them — that's intentional duplication for
      # log legibility, not a coverage gap.
      #
      # test_ir_parity is the third standing gate (cross-surface geometry
      # parity: the compiled IR vs geometric DRC vs the emitted .kicad_pcb vs
      # the emitted Gerber/Excellon). It belongs in THIS job, not `oracle`,
      # because it needs no kicad-cli — it parses our OWN emitted bytes with
      # gerbonara, which the setup action already installs as a dev extra. A
      # parity break is caused by a code change, so it has to fail on the PR
      # that makes it, not days later on a main-only job. Same argument the
      # other two standing gates are here on.
      #
      # It runs in `test-crossplatform` and `oracle` too, for the same reason
      # those jobs re-run the other two: they are full-suite jobs, and a gate
      # that is skipped on Windows is a gate that breaks on Windows.
      - name: Standing gates (determinism + kicad-cli boundary lint + IR parity)
        working-directory: pcb/worker
        run: python -m pytest tests/test_determinism_gate.py tests/test_kicad_cli_boundary.py tests/test_ir_parity.py -v

      - name: Worker test suite (kicad-cli absent — oracle tests skip)
        working-directory: pcb/worker
        run: python -m pytest tests/ -q

  fab-gate:
    name: pcb fab gate (hermetic clean-checkout build)
    # EPOCH CP2 STATION S1.
    #
    # Same triggers as `test` (every push + PR) rather than main-only. The
    # cost argument that keeps `oracle` and `test-crossplatform` off the PR
    # loop does not apply: there is no KiCad install and no runner-minute
    # multiplier here — two compiles of a small board, measured at ~20s wall
    # clock locally. And the failure this catches (an artifact that depends
    # on local state) is introduced BY A COMMIT, so it has to fail on the PR
    # that makes it.
    #
    # WHY A SEPARATE JOB rather than a step inside `test`: a red `test` job
    # currently means "a test failed". Folding a fabrication-reproducibility
    # gate into it would overload that signal with a second, unrelated
    # meaning. A named job makes "the fab package is not reproducible"
    # legible at a glance in the checks list.
    runs-on: ubuntu-22.04
    # A hung compile (say a pyclipper pour pathology) would otherwise burn
    # toward the 360-minute default. The pytest wrapper caps the script at 120s
    # when IT drives it; these steps had no cap at all.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        # REPO ROOT, not pcb/ — unlike every other job here. Only the SCRIPT's
        # own invocation path is CWD-relative; the BOARD argument is not, since
        # the script joins a relative board path to the worktree root
        # (`${TMPWT}/${BOARD_ARG}`) regardless of where it was called from.
        # Running from pcb/ would still work, but would make the repo-rooted
        # board paths below read as pcb-relative — the wrong mental model to
        # leave for the next editor.
        working-directory: .
    steps:
      # fetch-depth is left at the default (1). VERIFIED, not assumed: a
      # `git clone --depth 1` of this repo followed by
      # `git worktree add --detach <HEAD_SHA>` succeeds and the worktree
      # contains the full tree. The script only ever asks for HEAD, whose
      # objects a depth-1 clone has. Do not "fix" this to fetch-depth: 0.
      - uses: actions/checkout@v4

      # The script needs the worker's deps (pyclipper, pyyaml, gerber-writer)
      # importable — it probes pyclipper in pre-flight and hard-fails as a
      # NAMED harness error if absent, so a missing toolchain can never read
      # as a fabrication problem. Go is not needed here, but this action is
      # the one place the Python setup is maintained and forking it would be
      # the drift this repo's composite action exists to prevent.
      - name: Set up Go + Python + worker
        uses: ./.github/actions/pcb-setup

      # Epoch LIB1 station S5/B6: the marketplace release NOTICE gate.
      # pcb/scripts/gen_notice.py --check reads pcb/library/footprints.lock.json
      # (the acquisition lock, same authority the census test
      # test_library_lock.py reads) and refuses (exit 1, naming every
      # offending ref) if any entry's source_kind/license/source_ref is empty,
      # its source_kind is outside LOCK_SOURCE_KINDS, or its license contains
      # "UNKNOWN" — a strictly narrower dev census allows a staged UNKNOWN
      # license so it does not block unrelated PRs; this is the gate that
      # stops such an entry from ever reaching a release. --check also
      # refuses on drift between the committed pcb/NOTICE.md and what the
      # generator produces from the current lock, so an updated lock with no
      # regenerated NOTICE fails here rather than shipping a stale file.
      # Placed here (not in `test`) because fab-gate is this repo's named
      # release-readiness job — see the job header above — and this check
      # needs no worktree/compile machinery, only the worker's import path
      # the setup action above already established.
      - name: NOTICE release gate (license/attribution inventory drift check)
        run: python3 pcb/scripts/gen_notice.py --check

      # FIRST, and deliberately before any real board: prove the gate can
      # FAIL. --self-test runs one honest compile, asserts the minimum-manifest
      # check passes, then deletes a required Gerber and asserts the SAME check
      # now fails by name.
      #
      # BELT-AND-BRACES WITHIN THIS JOB, not unique evidence — be honest about
      # which: test_min_manifest_fails_on_sub_minimum_tree already runs the
      # very same --self-test via subprocess in the `test` job on every push
      # and PR. It is repeated here so that a red fab-gate is diagnosable on
      # its own (harness broken vs artifact wrong) without cross-referencing
      # another job's log. If that ever stops being worth ~5 seconds, delete
      # this step, not the pytest one.
      - name: Prove the gate fails when it should (--self-test)
        run: |
          HERMETIC_FAB_PYTHON="$(command -v python3)" \
            pcb/scripts/hermetic-fab-check.sh --self-test

      # The synthetic full-feature fixture: pours + a keepout + named refs +
      # assembly-identity-clean components, i.e. every v1 fab output on one
      # board.
      - name: Hermetic fab build — full-feature fixture
        run: |
          HERMETIC_FAB_PYTHON="$(command -v python3)" \
            pcb/scripts/hermetic-fab-check.sh \
              pcb/worker/tests/testdata/zone_fill.yaml

      # The public fab coupon — the board actually intended for a board-house
      # order (K21). Its package is the one whose reproducibility has to hold
      # if the artifacts are ever submitted, so it is gated by name rather
      # than left to the fixture above to stand in for.
      #
      # NOTE ON THE VIEWER STEP: the script's independent-viewer smoke-load
      # (gerbv) is best-effort and NON-FATAL by its own design, and gerbv is
      # not installed on this runner, so it degrades to printing the artifact
      # list. Installing gerbv + xvfb here was considered and rejected: the
      # step gates nothing, so the apt tax would buy a line of log output.
      - name: Hermetic fab build — public coupon (jlc-coupon-1)
        run: |
          HERMETIC_FAB_PYTHON="$(command -v python3)" \
            pcb/scripts/hermetic-fab-check.sh \
              pcb/worker/tests/testdata/coupon_jlc1.yaml

  test-crossplatform:
    name: pcb test (${{ matrix.os }})
    # ROUND A0c. Owner-requested 2026-07-25: development happens on a Linux
    # desktop, acceptance happens opportunistically on Mac and Windows laptops.
    # Without this job a portability break is found by a human, on a laptop,
    # after an unknown number of rounds have landed on top of it.
    #
    # main + manual dispatch ONLY, matching `oracle`. The cost argument is
    # steeper here than anywhere else in this file: GitHub bills macOS runners
    # at a 10x minute multiplier and Windows at 2x. Paying that on every push
    # to every dcr/** branch buys very little — the failure mode this job
    # catches (a path separator, a shell assumption, a missing `python3`) is
    # introduced by code, and every round of this campaign lands on main, so
    # main-only still gives per-round coverage.
    #
    # `if:` cannot reference the matrix (cad.yml carries the same note), but it
    # does not need to — this condition is matrix-independent.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      # Independent results. A macOS-only break must not hide whether Windows
      # is also broken — with two platforms, one cancelled run is half the
      # information the job exists to produce.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on the Windows runner too (Git Bash). Every command below is
        # POSIX; pinning the shell means the steps are literally identical
        # across the matrix rather than merely similar.
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go + Python + worker
        uses: ./.github/actions/pcb-setup

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Standing gates (determinism + kicad-cli boundary lint + IR parity)
        working-directory: pcb/worker
        run: python -m pytest tests/test_determinism_gate.py tests/test_kicad_cli_boundary.py tests/test_ir_parity.py -v

      # kicad-cli is absent here, exactly as in `test` — the oracle tests skip.
      # Installing KiCad on three platforms is a separate and much larger
      # undertaking; the oracle contract is verified on Linux (`oracle` job),
      # and what THIS job is asking is "does our own code run off-Linux".
      - name: Worker test suite (kicad-cli absent — oracle tests skip)
        working-directory: pcb/worker
        run: python -m pytest tests/ -q

  oracle:
    name: pcb oracle (with kicad-cli)
    # main + manual dispatch ONLY. `event_name != 'pull_request'` would have
    # been wrong in one direction: it also fires on every dcr/** push, which
    # contradicts the main-only intent stated at the top of this file.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      # Before the shared setup, so a KiCad-install failure is reported as
      # itself rather than as a confusing downstream test failure. The setup
      # action's own ordering invariant (worker before `go test`) is unaffected
      # — nothing here touches Python or Go.
      - name: Install kicad-cli (KiCad PPA)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          if sudo apt-get install -y kicad-cli; then
            echo "installed kicad-cli package"
          else
            echo "kicad-cli package unavailable, falling back to full kicad package"
            sudo apt-get install -y kicad
          fi
          kicad-cli --version

      - name: Set up Go + Python + worker
        uses: ./.github/actions/pcb-setup

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Standing gates (determinism + kicad-cli boundary lint + IR parity)
        working-directory: pcb/worker
        run: python -m pytest tests/test_determinism_gate.py tests/test_kicad_cli_boundary.py tests/test_ir_parity.py -v

      - name: Worker test suite (kicad-cli present — oracle tests execute)
        working-directory: pcb/worker
        run: python -m pytest tests/ -q

  panel:
    name: pcb panel (GD suite-registry compatibility ONLY — nothing executes)
    # Round A1a, RESHAPED at the CP2 S10 boundary. This job used to RUN the
    # 47 `extends SceneTree` suites in pcb/tests/gd/. It no longer does, and
    # the reason is a scoping principle rather than a defect workaround:
    #
    #   CI IS NOT A TEST RUNNER. Its job is to certify that the plugin BUILT
    #   and is in a TESTABLE STATE — not that it has been tested.
    #
    # It also could not do the job it was given. These suites must be hosted
    # by a Minerva `src/` checkout, and any suite that starts a real plugin
    # subprocess needs that checkout's NATIVE GDEXTENSIONS BUILT — the
    # `terminal` extension registers the `SubProcess` class the MCP STDIO
    # transport requires (chore 019fb6632a4e, documented at length in
    # pcb/scripts/run-gd-tests.sh). A plain actions/checkout has no src/bin/
    # at all. Worse, scripts reaching the FFmpeg-backed VideoRecorder fail to
    # COMPILE without it, and "Failed to compile depended scripts" cascades
    # into SingletonObject, taking down suites that have nothing to do with
    # either extension.
    #
    # MEASURED at 014b6d7: CI reported 27/47 suites with real assertions and
    # 2233 assertions; the same commit on a developer machine with
    # build-extensions.sh already run reports 47/47 and 5093. Every one of
    # those failures was the host scaffold, none was pcb code. The job had
    # been red for five consecutive commits and told nobody anything — the
    # same way the Go-step failure silently skipped pytest for four.
    #
    # Building three native toolchains (Zig, SCons/C++, FFmpeg) for ANOTHER
    # REPO on every push, to run a suite CI is not supposed to be running,
    # is the wrong trade twice over. So execution is a LOCAL gate
    # (pcb/scripts/run-gd-tests.sh, see pcb/docs/gd-tests.md) and CI keeps
    # the part it can honestly certify: the host wiring resolves and the
    # suite set on disk matches its checked-in manifest, in both directions.
    #
    # That check needs no Godot, so this job no longer downloads or caches
    # one — it is now filesystem-only and finishes in seconds.
    #
    # ============================================================
    # THIS JOB IS NOT A BUILD CHECK AND NOT A TEST. READ THIS BEFORE
    # TREATING IT AS EITHER.
    # ============================================================
    # Cold review 019ff34dd1cf (blocking finding 1) landed on the first
    # version of this job for claiming more than it delivers, and the name
    # and comments have been narrowed accordingly. What it verifies is
    # SUITE-REGISTRY AND HOST-CONTRACT COMPATIBILITY — nothing more.
    #
    # A .gd file can be syntactically invalid, fail to preload, or regress
    # behaviourally while its filename sits in EXPECTED_SUITES and this job
    # stays green. There is currently NO automated execution check for the
    # GDScript layer anywhere: the old CI run was removed as unhostable, and
    # the local runner it deferred to is itself known to false-green on
    # SCRIPT ERROR / Compile Error output and canned-worker fallback
    # (bug 019ff2b1fccb). That is a real coverage hole, deliberately visible
    # rather than papered over.
    #
    # THE AGREED PATH BACK, not yet done and not this job's to do: repair
    # 019ff2b1fccb so the runner fails closed, classify which suites are
    # valid on a STOCK pinned host versus which need native extensions or a
    # real worker, and run that stock-safe subset here under the fail-closed
    # runner. Native/real-worker suites stay a local or extension-enabled
    # gate. Do NOT simply restore the old full run — it was red for five
    # consecutive commits for host-scaffold reasons and told nobody anything.
    runs-on: ubuntu-22.04
    env:
      # Pinned to a specific commit, not a moving branch: pcb's CI must be
      # deterministic, and a third-party repo changing underneath us must not
      # turn pcb red without someone choosing that. Bumping this SHA is a
      # deliberate act.
      #
      # THIS IS `development`, NOT `main`. Minerva's DEFAULT branch is `main`
      # and it is roughly a year stale — the plugin system does not exist
      # there. Verified 2026-07-25: `src/test/helpers/plugin_panel_driver.gd`,
      # which test_workspace_persistence / test_workspace_ingest /
      # test_parity_bridge all preload, is ABSENT from main's tree and present
      # on development. Pinning main makes this job fail while looking like a
      # reasonable choice. If you bump this SHA, take it from
      # `origin/development` and re-check that helper still exists.
      #
      # Round 019f70a26607 relocated the 17 test_pcb_*.gd suites from
      # Minerva src/test/ into pcb/tests/gd/ (this directory). Seven of them
      # (plus the non-pcb test_cad_panel_tool_adoption.gd, which stays in
      # Minerva) also preload src/test/helpers/panel_tool_registry_driver.gd
      # — a second generic driver, distinct from plugin_panel_driver.gd.
      # Both helpers are confirmed present at the pinned SHA below; re-check
      # both if you bump it.
      #
      # Head of turnrocklabs/Minerva `development` on 2026-07-25.
      MINERVA_SHA: "8cc7ace5d916f79ebfe987b22cfd36a69979572d"
    steps:
      - name: Checkout minerva-plugins
        uses: actions/checkout@v4

      # Minerva must end up as a SIBLING of the minerva-plugins checkout,
      # because every test preloads `res://../../minerva-plugins/pcb/...`
      # resolved from <minerva>/src — so <minerva>/../minerva-plugins has to
      # exist. On a runner the workspace is
      #   /home/runner/work/minerva-plugins/minerva-plugins
      # so the sibling slot is $GITHUB_WORKSPACE/../Minerva.
      #
      # It CANNOT be checked out there directly: actions/checkout rejects any
      # `path` outside $GITHUB_WORKSPACE ("Repository path '...' is not under
      # '...'"), which would kill this job at step 2 on every run. So clone
      # inside the workspace and relocate.
      #
      # Minerva is public, so no credentials are needed to fetch it.
      - name: Checkout Minerva (pinned)
        uses: actions/checkout@v4
        with:
          repository: turnrocklabs/Minerva
          ref: ${{ env.MINERVA_SHA }}
          path: _minerva_host

      - name: Place Minerva beside minerva-plugins
        working-directory: ${{ github.workspace }}
        run: |
          mv _minerva_host "$GITHUB_WORKSPACE/../Minerva"
          # Fail loudly here rather than letting Godot report an opaque
          # "Cannot open file res://..." twenty lines later. Both generic
          # test driver helpers are asserted: 9 of the relocated suites
          # preload plugin_panel_driver.gd and 7 preload
          # panel_tool_registry_driver.gd (round 019f70a26607).
          test -f "$GITHUB_WORKSPACE/../Minerva/src/project.godot"
          test -f "$GITHUB_WORKSPACE/../Minerva/src/test/helpers/plugin_panel_driver.gd"
          test -f "$GITHUB_WORKSPACE/../Minerva/src/test/helpers/panel_tool_registry_driver.gd"

      # No Godot download, no cache, no suite execution — see the job header.
      # This is the same pre-flight the local runner performs before it starts
      # Godot, reached through the runner's own --preflight-only flag rather
      # than reimplemented here, so the two cannot drift: one implementation,
      # exercised on every push and on every local run.
      #
      # WHAT THIS FAILS ON, i.e. what "not in a testable state" means:
      #   - the pinned Minerva host is missing, or lacks src/project.godot
      #   - either generic driver helper is absent at the pinned SHA (the
      #     suites preload them by res:// path, so a bumped SHA that drops one
      #     breaks the harness rather than the code)
      #   - the sibling layout res://../../minerva-plugins/... hardcodes is wrong
      #   - a suite was deleted or renamed and is still in EXPECTED_SUITES
      #   - a suite was added to disk and NOT registered in EXPECTED_SUITES
      #
      # The last two are the ones worth having: a bare test_*.gd glob shrinks
      # silently, so without the manifest a deleted suite is a smaller green
      # run rather than a failure.
      - name: Pre-flight the GD suite registry and host wiring
        run: bash pcb/scripts/run-gd-tests.sh --preflight-only ../Minerva

  # ---------------------------------------------------------------------------
  # MARKETPLACE BINARY TIER (epoch GA-4, docket 019f985bd921) — mirror of
  # cad.yml's build+release pair. Each matrix leg builds the embedded Python
  # runtime bundle (overwriting the committed zero-byte placeholders in
  # internal/pcbruntime/bundle/ — see that dir's README), compiles the Go
  # binary with the bundle embedded, smoke-tests it over MCP stdio, and packs
  # the release tarball. Unlike cad, pcb ships the FULL matrix including
  # linux-arm64: its one native wheel (pyclipper 1.4.0) publishes
  # manylinux_2_28_aarch64 for cp312 (verified in worker/pyproject.toml's
  # wheel-availability note), so there is no cad-style blocker.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.target }})
    # Public-repo standard runners are free across all OSes, so full matrix
    # runs on every trigger. (Matrix context isn't valid in job-level `if:`.)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            runs-on: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            ext: ""
          - target: macos-universal
            runs-on: macos-14
            goos: darwin
            goarch: ""
            ext: ""
          - target: windows-x86_64
            runs-on: windows-2022
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: pcb
    steps:
      - uses: actions/checkout@v4

      # Go 1.26, NOT go.mod's 1.22 language floor: the macOS 26 runner's dyld
      # rejects Go 1.22-linked binaries (missing LC_UUID — see
      # .github/actions/pcb-setup/action.yml for the run reference).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zstd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: which zstd || brew install zstd

      - name: Confirm zstd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Git-for-Windows bundles zstd under usr/bin, which the pwsh system
        # PATH does not include (the later bash steps see it as /usr/bin).
        # Prepend it so this probe cannot fail spuriously on a runner image
        # without a system-wide zstd — same workaround cad.yml carries.
        run: |
          $env:Path = "C:\Program Files\Git\usr\bin;$env:Path"
          zstd --version

      - name: Cache PBS downloads
        uses: actions/cache@v4
        with:
          path: pcb/runtime-build/cache/pbs
          key: pbs-${{ matrix.target }}-${{ hashFiles('pcb/scripts/runtime-bundle.lock') }}

      # NOTICE release gate — the license/attribution inventory must be in
      # sync with footprints.lock.json before anything is packed for
      # distribution (shipping the tarball REDISTRIBUTES KiCad-derived
      # footprint definitions; DCR 019f761e item 7).
      - name: NOTICE release gate
        run: python3 scripts/gen_notice.py --check

      - name: Build runtime bundle (single arch)
        if: matrix.target != 'macos-universal'
        run: |
          bash ../scripts/build-python-runtime-bundle.sh . ${{ matrix.target }}
          ls -la internal/pcbruntime/bundle/

      - name: Build runtime bundle (macos arm64 + amd64 for lipo)
        if: matrix.target == 'macos-universal'
        run: |
          bash ../scripts/build-python-runtime-bundle.sh . macos-arm64
          bash ../scripts/build-python-runtime-bundle.sh . macos-amd64
          ls -la internal/pcbruntime/bundle/

      - name: Go build (single arch)
        if: matrix.target != 'macos-universal'
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -o build/pcb-plugin${{ matrix.ext }} .

      - name: Go build (macos universal via lipo)
        if: matrix.target == 'macos-universal'
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -o build/pcb-plugin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o build/pcb-plugin-amd64 .
          lipo -create build/pcb-plugin-arm64 build/pcb-plugin-amd64 -output build/pcb-plugin
          lipo -info build/pcb-plugin

      - name: Binary-size assertion (catches go:embed silently consuming empty bundle)
        run: |
          # Threshold is PER-PLUGIN, deliberately NOT cad's 100MB: cad's
          # bundle carries build123d/OCP (~150-250MB), pcb's is bare CPython
          # plus three small wheels. Measured from the pinned PBS assets
          # (tag 20260510 / cpython 3.12.13): windows 46MB, macos slices
          # ~25MB each, linux-x86_64 111MB — so the smallest legitimate
          # binary (windows: Go code + ~40MB zstd bundle) sits near 60MB,
          # while a placeholder-built binary is Go code only (~15-25MB).
          # 40MB separates the two on every leg with margin both ways.
          BIN="build/pcb-plugin${{ matrix.ext }}"
          if [ ! -f "$BIN" ]; then
            echo "::error::built binary not found at $BIN"; exit 1
          fi
          SIZE=$(wc -c < "$BIN")
          echo "binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ "$SIZE" -lt 40000000 ]; then
            echo "::error::binary too small ($SIZE bytes < 40MB) — go:embed likely embedded the zero-byte placeholders"
            exit 1
          fi

      # Run the pcbruntime tests against the REAL bundle (cold GA-4 review
      # finding 4): the repo-wide `test` job only ever sees the zero-byte
      # placeholders, so embed_test.go's sha-verification branch is dead
      # there. Here the bundle is real, so a corrupt or mispaired
      # bundle/sidecar fails THIS job instead of a user machine (PythonPath
      # deliberately falls back to system python on embedded-tier failure,
      # so the smoke below would not catch it).
      - name: Go test pcbruntime (real bundle)
        run: go test -count=1 ./internal/pcbruntime/

      - name: MCP stdio smoke (initialize + tools/list)
        run: python3 ../scripts/smoke/mcp_smoke.py build/pcb-plugin${{ matrix.ext }}

      - name: Pack release tarball
        run: |
          PLATFORM="${{ matrix.target }}"
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          mkdir -p dist
          PACKDIR="dist/pcb-${VERSION}-${PLATFORM}"
          mkdir -p "$PACKDIR"
          cp build/pcb-plugin${{ matrix.ext }} "$PACKDIR/"
          cp manifest.json "$PACKDIR/"
          # ui/ — manifest declares godot_scene panels; without it the
          # installed plugin starts its backend but cannot open its panel
          # (same class of bug cad.yml documents).
          cp -r ui "$PACKDIR/"
          # library/ — the plugin is DATA-DEPENDENT (hermetic compilation):
          # the seed footprint library + manufacturer profiles +
          # footprints.lock.json. Omit it and every board fails to resolve —
          # fail-closed means a marketplace user's first action errors out.
          # cp -r preserves bytes; the sha pins in the lock survive because
          # library/.gitattributes pins EOLs at checkout, not here.
          cp -r library "$PACKDIR/"
          # libraries.lock.json — the download-on-demand KiCad-subset lock
          # read by minerva_pcb_fetch_libraries via DefaultLockPath(root).
          cp libraries.lock.json "$PACKDIR/"
          # NOTICE.md — the license/attribution inventory for the
          # redistributed KiCad-derived footprints; gated for drift above.
          cp NOTICE.md "$PACKDIR/"
          # SHA256SUMS covers every shipped file.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$PACKDIR" && find . -type f ! -name SHA256SUMS -print0 \
              | xargs -0 sha256sum | sed 's| \./| |' > SHA256SUMS)
          else
            (cd "$PACKDIR" && find . -type f ! -name SHA256SUMS -print0 \
              | xargs -0 shasum -a 256 | sed 's| \./| |' > SHA256SUMS)
          fi
          tar -czf "dist/pcb-${VERSION}-${PLATFORM}.tar.gz" -C "$PACKDIR" .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcb-${{ matrix.target }}
          path: pcb/dist/pcb-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    # Push only — PRs build but never release. Same tag scheme as cad.yml:
    # a version tag releases as-is; main releases pcb-v<manifest version>;
    # a dcr/** branch releases a -branch- prerelease that regen_registry.py
    # deliberately skips.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: pcb-*
          merge-multiple: true
          path: dist

      - name: Compute tag
        id: tag
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("pcb/manifest.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; PRE="false"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="pcb-v${VERSION}"; PRE="false"
          else
            SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g; s|[^a-zA-Z0-9_.-]|-|g')
            TAG="pcb-v${VERSION}-branch-${SAFE_BRANCH}"; PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
