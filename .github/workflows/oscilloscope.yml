name: oscilloscope

# Build pinned libusb and open firmware, then package the shared UI/MCP backend.

on:
  push:
    branches: [main, "dcr/**"]
    paths:
      - "oscilloscope/**"
      - ".github/workflows/oscilloscope.yml"
      - "scripts/**"
      - "shared/**"
      - "go.work"
  pull_request:
    paths:
      - "oscilloscope/**"
      - ".github/workflows/oscilloscope.yml"
      - "scripts/**"
      - "shared/**"
      - "go.work"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: oscilloscope (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-22.04
            goos: linux
            goarch: amd64
            cgo: "1"
          - target: macos-universal
            runs-on: macos-14
            goos: darwin
            goarch: ""
            cgo: "1"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: oscilloscope
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build prerequisites (Linux)
        if: matrix.target == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev autoconf automake libtool pkg-config sdcc

      - name: Build prerequisites (macOS)
        if: matrix.target == 'macos-universal'
        run: brew install libusb autoconf automake libtool pkgconf sdcc

      - name: Focused tests and vet
        env:
          GOWORK: 'off'
          CGO_ENABLED: '1'
        run: |
          go test -race ./...
          go vet ./...

      - name: Build self-contained marketplace archive
        run: python3 scripts/package.py --target '${{ matrix.target }}'

      - name: Packaged MCP handshake (no USB access)
        run: python3 ../scripts/smoke/mcp_smoke.py "$PWD/build/package-${{ matrix.target }}/oscilloscope-plugin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscilloscope-${{ matrix.target }}
          path: oscilloscope/dist/oscilloscope-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  release:
    name: Publish release
    concurrency: oscilloscope-release
    needs: [build, secret-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all matrix tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: oscilloscope-*
          path: artifacts/
          merge-multiple: true

      - name: Compute tag + prerelease flag
        id: tag
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("oscilloscope/manifest.json"))["version"])')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="oscilloscope-v${VERSION}"
            PRE="false"
          else
            SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g; s|[^a-zA-Z0-9_.-]|-|g')
            TAG="oscilloscope-v${VERSION}-branch-${SAFE_BRANCH}"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Computed: tag=$TAG prerelease=$PRE"
          bash scripts/release-publish-guard.sh "$TAG" "$PRE"

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: artifacts/oscilloscope-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
